l_english:

 # Every Dungeon Delving event, in event id order. Each block holds the title, the description,
 # then each option: its text, its flavor line and the lines for a passed or failed check.

 ### Junctions: doors, tunnels and the pit ###

 # 1401: The Way Divides (doors)
 underdeep.1401.t: "The Way Divides"
 underdeep.1401.desc: "The passage divides ahead of the company, which must now choose a way."

 # 1402: The Tunnels Fork
 underdeep.1402.t: "The Tunnels Fork"
 underdeep.1402.desc: "Tunnels branch away from the passage here, some wide enough for a cart, some barely a crawl, with no telling where most of them go."

 # 1403: The Drop (pit)
 underdeep.1403.t: "The Drop"
 underdeep.1403.desc: "The floor of the gallery falls away into a shaft. Cold air rises from it. Far below a thin gleam of ice can be seen. There is no stair, only a few rungs of broken ladder. After that there is nothing but the drop."
 underdeep.1403.a: "Jump."
 underdeep.1403.a.flavor: "You take a breath, step off the edge and trust to whatever is below."
 underdeep.1403.b: "Climb down carefully."
 underdeep.1403.b.flavor: "You test each hold in turn and lower yourself into the dark."
 underdeep.1403.b.success: "You reach the bottom unhurt"
 underdeep.1403.b.failure: "A hold crumbles under your hand"
 underdeep.1403.d: "Jump down (and do a flip)."
 underdeep.1403.d.flavor: "You take three steps back, run at the edge and turn over once in the empty air."

 ### The entrance ###

 # 1001: Under the Stone
 underdeep.1001.t: "Under the Stone"
 underdeep.1001.desc: "Behind them the grey daylight shrank to the size of a coin, then to nothing, as the company went on by torchlight. The walls were not the work of [dwarves|E], for each passage leaned a little, as if the rock had been made to bow. No dust lay anywhere, only rime. Few words were spoken among them. They had come in search of what was left of [utumno|E] and the way ahead went steadily down. That was the party's final chance to turn back."
 underdeep.1001.open_5038: "The Wyrms' Pathway ran through the Grey Mountains, along a valley scorched so long ago that moss had grown over the burns. Where the valley ended, a great crawlway went into the rock. Its sides had been worn smooth by the passing of long bodies.\n\n"
 underdeep.1001.open_5038_nixni: "The drakes used this road when they were young and the North was theirs. You had bargained with the eldest of them for the right to pass. You had kept your word to the letter and no further. That one was long dead now. Its children might not remember the bargain.\n\n"
 underdeep.1001.open_8075: "In the waste stands the mountain called Morgoth's Well. In the Elder Days it was a chasm. Here Maedhros cast himself down with the Silmaril that burned him. When the world was made round, fire came up through the crevice and built the mountain over it. A ledge had been cut into the old shaft long ago. The company went down it in single file, with warm air rising past them out of the dark.\n\n"
 underdeep.1001.open_8075_nixni: "You remember this place as a chasm, before the fire came. You were not there when the son of Fëanor threw himself down with the jewel burning in his hand, but you heard of it and were glad. A ledge had been cut into the old shaft long ago. You had walked it when it was new.\n\n"
 underdeep.1001.open_8105: "The way in lay through the ruined gates of Angband, at the foot of Thangorodrim, among the broken roots of the peaks that were thrown down in the War of Wrath. Black walls had been raised again across the approaches and somewhere beneath the earth the furnaces were burning. Past the last of them a stair that had been made for no friend went down beneath a fallen lintel.\n\n"
 underdeep.1001.open_8105_nixni: "The way in lay beneath your own gates. The orcs of Angband drew back from the stair as you passed and did not lift their eyes. You had come down this stair before, when the Master still sat his throne and the Sun was not yet made. Then it was lit and the walls rang with hammers. Now the lintel was fallen and the rime lay thick. Of all the company, only you knew how far down it went and what had waited at the bottom.\n\n"
 underdeep.1001.open_9191: "High in the Bleak Mountains, above the broken walls of Durnost that once held the passes, there was a cleft that appeared on no map the company had seen. Its sides had been cut square. The snow lay deep on every slope around it, but none had drifted in.\n\n"
 underdeep.1001.open_9191_nixni: "You knew this cleft. It was cut at your word long before there was any fortress below it, so that the Master's servants might come and go while the watchers kept their eyes on the wrong road. The snow still did not drift into it. That had been part of the bargain.\n\n"
 underdeep.1001.a: "Down, then."
 underdeep.1001.a.flavor: "Your back to the last of the day, you start the long descent."
 underdeep.1001.b: "Turn back."
 underdeep.1001.b.flavor: "You give the word and the company climbs back to the grey daylight."

 ### Rooms behind the doors ###

 # 1101: The Frozen Stair
 underdeep.1101.t: "The Frozen Stair"
 underdeep.1101.desc: "The air grew colder with every turn of the stair. Frost lay grey upon the steps, though no water had run there since before the Sun was lit. At first the company spoke little, then not at all. The echo of their feet came back to them late, until it seemed to come from the wrong side. At the next landing the torches burned low and blue, though there was no wind. By that thin light they saw that someone had swept the frost from the last step."
 underdeep.1101.a: "We go on with the torches kept close."
 underdeep.1101.a.flavor: "With the company drawn tight around the light, you climb steadily down."
 underdeep.1101.b: "Mark the wall to find our way back."
 underdeep.1101.b.flavor: "A torch is spent to scorch arrows on the stone at every landing."
 underdeep.1101.c: "Read the old cuts in the stone."
 underdeep.1101.c.flavor: "You hold a flame to the wall and follow the worn carvings with a finger."
 underdeep.1101.c.success: "The cuts name this place and they teach you more than you expected"
 underdeep.1101.c.failure: "The old script means nothing to you"
 underdeep.1101.d: "Steady them, for it is only an echo."
 underdeep.1101.d.flavor: "Speaking lightly and evenly, you talk the frightened company out of listening for footsteps."
 underdeep.1101.e: "Put out the torches, since we see well enough."
 underdeep.1101.e.flavor: "Every flame is doused and you lead on by sight that needs no fire."
 underdeep.1101.f: "Stay close, for I have felt this before."
 underdeep.1101.f.flavor: "You name the old dread aloud and keep everyone within arm's reach."
 underdeep.1101.g: "Copy out the cuts before the torches fail."
 underdeep.1101.g.flavor: "You lay a sheet against the stone and rub the old marks onto it with soot."

 # 1102: The Red Floor
 underdeep.1102.t: "The Red Floor"
 underdeep.1102.desc: "Along the walls stood racks of iron, long since rusted through and fallen, so that the floor was red with it to the ankle. The garrison that held this place in days when no Sun rose upon the world had gone in haste, or not gone at all. Among the ruin of the racks one blade lay clean. No rust had touched it. The frost had left a narrow space all about it, as folk leave a space about the sick."
 underdeep.1102.a: "Take the blade."
 underdeep.1102.a.flavor: "You reach for the one clean thing in that red ruin."
 underdeep.1102.a.success: "You knew to bind the hilt before touching it"
 underdeep.1102.a.failure: "The grip opens your hand to the bone, but the blade is yours"
 underdeep.1102.b: "Leave the blade, take the rest."
 underdeep.1102.b.flavor: "Turning from the clean steel, you go through the fallen iron for lesser prizes."
 underdeep.1102.c: "Sort out anything still sound."
 underdeep.1102.c.flavor: "Methodically you sift the ruin, setting aside whatever still holds an edge."
 underdeep.1102.c.success: "You find good iron and an old smith's pattern scratched on a plate"
 underdeep.1102.c.failure: "It all crumbles in your hands"
 underdeep.1102.d: "Clean or not, it is mine."
 underdeep.1102.d.flavor: "Bare-handed, you snatch the blade and dare the old curse to do its worst."
 underdeep.1102.e: "Let me judge the steel."
 underdeep.1102.e.flavor: "A knuckle to the flat, you test the temper and listen for true metal."
 underdeep.1102.f: "I have looted worse places than this."
 underdeep.1102.f.flavor: "You work through the racks with the ease of a practiced plunderer."
 underdeep.1102.g: "Strip every rack to the wall."
 underdeep.1102.g.flavor: "You set your back against the iron and heave the fallen racks aside one by one."
 underdeep.1102.g.success: "Sound steel lies under the rot"
 underdeep.1102.g.failure: "A rotten rack comes down on you"
 underdeep.1102.h: "Break the clean blade."
 underdeep.1102.h.flavor: "You lay the blade across two stones and bring your boot down on it."

 # 1103: The Fallen Roof
 underdeep.1103.t: "The Fallen Roof"
 underdeep.1103.desc: "Here the roof had come down in ages past, when the [valargods|E] made war upon the North. The way lay across a great slope of broken stone bound together with ice and the going was slow. Twice the slope settled beneath them with a long sigh and twice they stood still and held their breath. Far above, where the rock had been riven, hung boulders the size of houses, held by nothing that could be seen."
 underdeep.1103.a: "Cross quickly, one at a time."
 underdeep.1103.a.flavor: "Each crosser darts over the ice alone while the rest hold still."
 underdeep.1103.a.success: "Everyone reaches the far side unhurt"
 underdeep.1103.a.failure: "The slope slides out from under you"
 underdeep.1103.b: "Cut a safer path along the wall."
 underdeep.1103.b.flavor: "Hours go to chipping handholds along the sheer side, far from the hanging boulders."
 underdeep.1103.c: "Rope everyone together and lead them."
 underdeep.1103.c.flavor: "You tie the company waist to waist and call out every step."
 underdeep.1103.c.success: "The line holds and nobody falls"
 underdeep.1103.c.failure: "A slip drags the line down"
 underdeep.1103.d: "I will go first."
 underdeep.1103.d.flavor: "You test the loosest stones yourself so the others can tread in your footsteps."
 underdeep.1103.e: "Hold the rock up while they cross."
 underdeep.1103.e.flavor: "Shoulders braced beneath the worst of the ice, you bear it while the rest scurry across."
 underdeep.1103.f: "I have crossed worse for less pay."
 underdeep.1103.f.flavor: "With a mercenary's shrug, you scramble over and show the others where to tread."
 underdeep.1103.g: "Cross upright, where all can see."
 underdeep.1103.g.flavor: "You walk the slope with your head up and your hands empty."
 underdeep.1103.h: "Carry the weakest across yourself."
 underdeep.1103.h.flavor: "You take the slowest of the company on your back and start out over the ice."

 # 1104: The Procession
 underdeep.1104.t: "The Procession"
 underdeep.1104.desc: "For a furlong or more the left-hand wall was carved with figures in long procession, all bowing toward the deep. The carving was very fine, yet there was no joy in it. The company did not care to look at it long. At the end of the gallery one of them looked back and said nothing. Then another looked back. Every head along that wall was turned now toward the way that they had come."
 underdeep.1104.a: "Do not look back again."
 underdeep.1104.a.flavor: "Gaze fixed upon the torch ahead, you forbid any further glances."
 underdeep.1104.b: "Go back and look closer."
 underdeep.1104.b.flavor: "Alone, you retrace the gallery and peer into the carved faces one by one."
 underdeep.1104.b.success: "You glimpse what the carvers meant"
 underdeep.1104.b.failure: "The faces turn to follow you"
 underdeep.1104.c: "Look for the trick."
 underdeep.1104.c.flavor: "You inspect the joints of the carving for hidden pivots and false panels."
 underdeep.1104.c.success: "A false panel hides a stash"
 underdeep.1104.c.failure: "You find no seam or pivot"
 underdeep.1104.d: "It is only carving."
 underdeep.1104.d.flavor: "With a shrug and a slap at the nearest figure, you stroll after the torches."
 underdeep.1104.e: "Sing to keep them going."
 underdeep.1104.e.flavor: "An old song of the stars rises and you hold the company to its rhythm."
 underdeep.1104.f: "I have read of this."
 underdeep.1104.f.flavor: "You recite the chronicle of this gallery until the horror becomes mere history."
 underdeep.1104.g: "They bow to my kind."
 underdeep.1104.g.flavor: "You pass between the bowing ranks like a lord inspecting loyal servants."
 underdeep.1104.h: "Draw the procession."
 underdeep.1104.h.flavor: "You walk the length of the wall with a slate, setting down each bowed shape."
 underdeep.1104.i: "Hack off the faces."
 underdeep.1104.i.flavor: "You take a hammer to the nearest figure and order the others to do the same."
 underdeep.1104.j: "Bow with them."
 underdeep.1104.j.flavor: "You turn to the deep and bend your head as the carved ones do."

 # 1105: The Warm Stone
 underdeep.1105.t: "The Warm Stone"
 underdeep.1105.desc: "They came to a round chamber where a great flat stone lay in the midst of the floor. No frost would lie upon it. It was warm to the hand, as a hearthstone is warm long after the fire has been raked out. There they sat to eat and for the first time since the daylight some spoke of home. Not until they rose to go did any think to ask what warmed it."
 underdeep.1105.a: "Rest a while longer."
 underdeep.1105.a.flavor: "You stretch out upon the warm stone and let sleep come as it will."
 underdeep.1105.c: "Keep everyone talking of home."
 underdeep.1105.c.flavor: "You draw out tales of hearths and harvests until the stone is forgotten."
 underdeep.1105.c.success: "The talk of home lifts them"
 underdeep.1105.c.failure: "The talk turns to the lost"
 underdeep.1105.d: "Post a double watch, then rest."
 underdeep.1105.d.flavor: "Two sentries go to every door before anyone lays down a blanket."
 underdeep.1105.e: "Never mind the stone, but who has food?"
 underdeep.1105.e.flavor: "After rummaging through the packs, you lay out a proper supper on the warm rock."

 # 1106: The Breathing Mound
 underdeep.1106.t: "The Breathing Mound"
 underdeep.1106.desc: "The passage widened into a low cavern and its reek reached them before the torchlight did. Bones lay heaped along the walls, split for the marrow. Among them were the bones of creatures that had no name in any tale of [men|E]. At the far side rose a mound of rime with a hollow melted in its flank. As they watched, the hollow filled with mist, slowly cleared, then filled again."
 underdeep.1106.a: "Strike while it sleeps."
 underdeep.1106.a.flavor: "Bare blade low, you creep close and drive it into the heaving flank."
 underdeep.1106.a.success: "You read its breathing and make the kill as hunters do"
 underdeep.1106.a.failure: "It wakes before the blade lands"
 underdeep.1106.b: "Creep past along the wall."
 underdeep.1106.b.flavor: "Single file through the bones you lead them, placing every foot with care."
 underdeep.1106.b.success: "Not a bone shifts underfoot"
 underdeep.1106.b.failure: "A bone cracks beneath your heel"
 underdeep.1106.c: "Turn back and find another way."
 underdeep.1106.c.flavor: "You retreat from the reeking cavern and search out a longer road."
 underdeep.1106.d: "Surround it first."
 underdeep.1106.d.flavor: "Fighters take position on each side of the rime, cutting off any escape."
 underdeep.1106.d.success: "Your ring of spears brings it down"
 underdeep.1106.d.failure: "It breaks through your thin ring"
 underdeep.1106.g: "Wake it first, so the tale is worth telling."
 underdeep.1106.g.flavor: "You strike the flank with the flat of your blade and step back to meet it."

 # 1107: The Reckoner's Cell
 underdeep.1107.t: "The Reckoner's Cell"
 underdeep.1107.desc: "A side-passage ended in a cell no bigger than a cupboard, lined with shelves of slate. Each slate was scored from edge to edge with small, exact marks. They were the reckonings of some servant of [ROOT.Char.Custom('underdeep_enemy_name')] who had kept accounts when the world was young. Every line had been struck through but the last. Beneath the shelves stood an iron coffer. It was not locked and that gave them more pause than anything they had yet seen in that place."
 underdeep.1107.a: "Open it."
 underdeep.1107.a.flavor: "Without further thought, you lift the heavy lid and reach inside."
 underdeep.1107.a.success: "Nothing bites and the coins are real"
 underdeep.1107.a.failure: "A needle in the hinge finds your hand"
 underdeep.1107.b: "Study the slates."
 underdeep.1107.b.flavor: "You sort the slates by their marks and read the ones that are not accounts."
 underdeep.1107.b.success: "Some of the slates are worth far more than the rest"
 underdeep.1107.b.failure: "The figures swim and mean nothing"
 underdeep.1107.c: "Leave it alone."
 underdeep.1107.c.flavor: "You back out of the little cell and leave its accounts unsettled."
 underdeep.1107.d: "Check the coffer for traps first."
 underdeep.1107.d.flavor: "A thin blade probes the hinges and lid before you dare raise it."
 underdeep.1107.d.success: "You find the spring and jam it"
 underdeep.1107.d.failure: "A hidden spring catches your hand"
 underdeep.1107.f: "I can read these tallies."
 underdeep.1107.f.flavor: "You run a finger along the columns and pick out the valuable records."

 # 1108: Clean Water
 underdeep.1108.t: "Clean Water"
 underdeep.1108.desc: "In a cleft of the wall ran a thread of water and it was clean. None could tell why, for all else in that place was fouled or frozen. It tasted of nothing worse than stone and cold. That eased them a little. One of the company said that [ROOT.Char.Custom('underdeep_enemy_name')] had never made anything, but only spoiled what he found, though some things were slow to spoil. No one answered him, but each of them knelt in turn to fill a flask."
 underdeep.1108.desc_evil: "In a cleft of the wall ran a thread of water and it was clean. None could tell why, for all else in that place was fouled or frozen. It tasted of nothing worse than stone and cold. One of the company spat, then said that [Concept('morgothcharacter','the old master')|E] had left nothing here fit to drink, so this water must have been forgotten. No one answered him, but each of them knelt in turn to fill a flask."
 underdeep.1108.a: "Fill the flasks and rest."
 underdeep.1108.a.flavor: "Every flask is topped up and the company sits a while beside the spring."
 underdeep.1108.b: "Drink quickly and move on."
 underdeep.1108.b.flavor: "Each is allowed a few swallows before you press onward while the torches last."
 underdeep.1108.c: "Share out the water and stores."
 underdeep.1108.c.flavor: "You tally the packs and flasks, dividing everything evenly among the company."
 underdeep.1108.c.success: "Careful shares leave torches to spare"
 underdeep.1108.c.failure: "The count ends in bitter squabbles"
 underdeep.1108.d: "Let the weakest drink first."
 underdeep.1108.d.flavor: "Waving aside the strong, you cup water for the faint and frightened."
 underdeep.1108.e: "Speak a blessing over the spring."
 underdeep.1108.e.flavor: "Kneeling at the cleft, you thank the waters in the old tongue."
 underdeep.1108.f: "Drink up, for we have lived on less."
 underdeep.1108.f.flavor: "You gulp your share and wipe your mouth, already moving down the passage."
 underdeep.1108.g: "Ration it as we would at sea."
 underdeep.1108.g.flavor: "A sailor's portion goes to each and the rest you seal away."

 # 1109: The Black Flagstones
 underdeep.1109.t: "The Black Flagstones"
 underdeep.1109.desc: "The floor of this hall was laid with wide black flagstones. For the first time since the gate their footfalls rang hollow. A cold air came up between the joints and drew the torch-smoke downward. They went slowly in single file, testing each stone with a spear-butt. The stones gave back the same dull note, one after another, until the ninth gave back none at all."
 underdeep.1109.a: "Go around by the ledge."
 underdeep.1109.a.flavor: "Along the narrow shelf by the wall you edge, avoiding the hollow floor."
 underdeep.1109.b: "Lay planks and cross."
 underdeep.1109.b.flavor: "You lash boards together and slide them across the silent flagstones."
 underdeep.1109.b.success: "The boards bear every foot across"
 underdeep.1109.b.failure: "A board snaps over the hollow"
 underdeep.1109.c: "Work out the pattern in the stones."
 underdeep.1109.c.flavor: "Tapping out the note of each stone, you chart their sequence."
 underdeep.1109.c.success: "You see how the old miners laid their stone"
 underdeep.1109.c.failure: "The stones fall into no order"
 underdeep.1109.d: "Let me read the stonework."
 underdeep.1109.d.flavor: "You kneel and sound the joints, knowing at once which stones are true."
 underdeep.1109.e: "I have dug pits like this."
 underdeep.1109.e.flavor: "Recognizing the trapper's craft, you steer everyone around each baited stone."
 underdeep.1109.f: "Rig a line along the ledge."
 underdeep.1109.f.flavor: "From spike to spike you run a taut cord above the drop."

 # 1110: A Thing Out of Place
 underdeep.1110.t: "A Thing Out of Place"
 underdeep.1110.desc: "In a niche at the turning of the passage, among filth long frozen, something caught the torchlight and gave it back more softly than it came. It was a clasp of silver, worked with the likeness of a single star. No servant of that place had made it, for it was very old and very fair. How it had come so far beneath the North they could only guess, though none of them guessed aloud."
 underdeep.1110.a: "Keep it."
 underdeep.1110.a.flavor: "You wipe the silver clean and turn it under the torch to learn what it is."
 underdeep.1110.a.success: "You know the maker's hand and the star answers the light"
 underdeep.1110.a.failure: "You keep it, knowing little of what you carry"
 underdeep.1110.b: "Sell it."
 underdeep.1110.b.flavor: "You weigh the clasp in your palm and work out what a buyer would pay."
 underdeep.1110.b.success: "It is a rare piece and the price is high"
 underdeep.1110.b.mid: "It fetches a fair price and no more"
 underdeep.1110.b.failure: "The silver is only plate, for it is a fake"
 underdeep.1110.c: "Make a shrine for it and leave it."
 underdeep.1110.c.flavor: "You set the clasp back in its niche and clear the filth from around it."
 underdeep.1110.d: "Destroy it."
 underdeep.1110.d.flavor: "Dropped to the floor, the clasp is ground beneath your heel."

 # 1111: The Hall of Empty Thrones
 underdeep.1111.t: "The Hall of Empty Thrones"
 underdeep.1111.desc: "The door stood twice the height of a tall man, with neither ring nor lock upon it. Many had come against it in their time, for the iron was scored and dented as high as a spear could reach. But when the leader of the company laid a hand upon it, the iron grew warm. The door swung inward without a sound. Beyond it lay a hall set about with empty thrones, each turned to face the door."
 underdeep.1111.a: "Sit upon the highest throne."
 underdeep.1111.a.flavor: "You mount the dais and lower yourself into the great seat as torches gutter."
 underdeep.1111.b: "Search the hall and touch nothing."
 underdeep.1111.b.flavor: "The company goes along the walls under strict orders to keep hands off."
 underdeep.1111.c: "Mark this hall as taken."
 underdeep.1111.c.flavor: "Your banner goes up at the door, with guards posted before the seats."
 underdeep.1111.c.success: "Your banner stands unchallenged in the hall"
 underdeep.1111.c.failure: "The banner topples in the cold air"
 underdeep.1111.d: "These seats were kept for me."
 underdeep.1111.d.flavor: "Up the aisle you stride to claim the foremost seat as your due."

 # 1112: The Blue Arches
 underdeep.1112.t: "The Blue Arches"
 underdeep.1112.desc: "Beyond the broken wall the rock gave way to ice. The passage ran on beneath a long line of arches, blue as a bruise. The cold made the teeth ache. The arches were clear enough to show the dark shapes frozen within them. When one of the company coughed, a crack ran singing overhead from arch to arch and was a long time dying. Looking up then, all of them saw that the shapes in the ice had not been so near the surface before."
 underdeep.1112.a: "Run the arches with shields raised."
 underdeep.1112.a.flavor: "Shields locked overhead, you sprint beneath the singing ice."
 underdeep.1112.a.success: "You pass beneath before it breaks"
 underdeep.1112.a.failure: "Falling shards slash through the shields"
 underdeep.1112.b: "Go the long way round."
 underdeep.1112.b.flavor: "Away through colder side passages you lead them, burning precious light."
 underdeep.1112.c: "Keep everyone calm and silent."
 underdeep.1112.c.flavor: "With a steady hand you hush every voice and walk them through."
 underdeep.1112.c.success: "Not one breath disturbs the ice"
 underdeep.1112.c.failure: "A cry sends ice crashing down"
 underdeep.1112.d: "Follow me without a word."
 underdeep.1112.d.flavor: "One hand raised for quiet, you slip beneath the arches without speaking."
 underdeep.1112.e: "Let me climb ahead with a rope."
 underdeep.1112.e.flavor: "You scale the frozen wall, anchor a line and haul the others along."
 underdeep.1112.f: "Shield the others with your own back."
 underdeep.1112.f.flavor: "You send them beneath the arches first and walk last, where the ice will fall."

 # 1113: The Grim Hall
 underdeep.1113.t: "The Grim Hall"
 underdeep.1113.desc: "It was a great square hall, low yet very wide. Those who built it had cared for nothing but that it should hold many and comfort none. Long benches of stone ran the length of it, furred with frost. At the far end burned a small fire and about it sat four strangers, thin and silent, with a heap of old plunder between them. They looked up at the company without surprise. One of them moved over on the stone, as if to make room."
 underdeep.1113.a: "Greet them and walk on."
 underdeep.1113.a.flavor: "You nod to the hollow-eyed strangers and accept whatever small gift they offer."
 underdeep.1113.b: "Bargain for a share."
 underdeep.1113.b.flavor: "Across the fire you haggle over the heap, piece by piece."
 underdeep.1113.b.success: "They agree to a fair division"
 underdeep.1113.b.failure: "They turn silent and give nothing"
 underdeep.1113.c: "Drive them from the plunder."
 underdeep.1113.c.flavor: "Steel drawn, you order the four thin wanderers away from their heap."
 underdeep.1113.c.success: "The strangers flee and leave it all"
 underdeep.1113.c.failure: "The strangers fight back with startling strength"
 underdeep.1113.d: "Sit down and swap stories."
 underdeep.1113.d.flavor: "You take the offered bench and trade tall tales across the small fire."
 underdeep.1113.e: "Is there anything left to eat?"
 underdeep.1113.e.flavor: "Settling among them, you poke hopefully through their cooking pots and bundles."

 # 1114: Breath on the Air
 underdeep.1114.t: "Breath on the Air"
 underdeep.1114.desc: "Here the cold was so sharp that every word smoked. The breath of the company went up in small grey plumes. They stopped to bind a torch, standing close, with no one speaking. Yet beside the wall, where no one stood, a plume of breath rose and faded, then rose again, slow and even. Presently it drew a little nearer and one of them began quietly to weep."
 underdeep.1114.a: "Walk on and do not stop."
 underdeep.1114.a.flavor: "You quicken the pace and forbid anyone from glancing toward the wall."
 underdeep.1114.b: "Comfort the one who is weeping."
 underdeep.1114.b.flavor: "An arm about the sobbing one, you murmur quiet reassurance."
 underdeep.1114.b.success: "The weeping slows and the line steadies"
 underdeep.1114.b.failure: "Your words only deepen the weeping"
 underdeep.1114.c: "Strike the empty air."
 underdeep.1114.c.flavor: "Your blade swings through the plume where no body stands."
 underdeep.1114.c.success: "The plume scatters and does not return"
 underdeep.1114.c.failure: "Something unseen strikes back"
 underdeep.1114.d: "Greet it, since it may be lost."
 underdeep.1114.d.flavor: "With a slight bow to the empty place, you ask if it needs guidance."
 underdeep.1114.e: "I know this kind of silence."
 underdeep.1114.e.flavor: "You stand very still and listen until the presence loses its power."
 underdeep.1114.f: "I have seen stranger things drunk."
 underdeep.1114.f.flavor: "A long pull from your flask and you laugh at the plume."
 underdeep.1114.g: "Stand between it and the one who weeps."
 underdeep.1114.g.flavor: "You step into the empty place beside the wall and stay there."
 underdeep.1114.h: "Breathe with it."
 underdeep.1114.h.flavor: "You stand beside the plume and match your breath to its slow rise and fall."

 # 1115: The Barred Room
 underdeep.1115.t: "The Barred Room"
 underdeep.1115.desc: "A short way past the last of the ice they found a small guardroom with its door still whole. A beam of black oak stood ready beside it. In the corner someone had left a stack of kindling, dry as the day it was cut, tied up neatly with cord. They lit it and the warmth came slowly into their hands. Nothing stirred while they slept beside it. The fire was small, but it kept the cold from them until they woke."
 underdeep.1115.a: "Rest by the fire."
 underdeep.1115.a.flavor: "Hands stretched out to the flames, you let the others sleep."
 underdeep.1115.b: "Save the kindling for torches."
 underdeep.1115.b.flavor: "The dry sticks are bound with their cord and most are stowed for later."
 underdeep.1115.c: "Drop the beam across the door."
 underdeep.1115.c.flavor: "You heave the black oak into its brackets and seal out the dark."
 underdeep.1115.c.success: "The beam drops home and holds"
 underdeep.1115.c.failure: "The beam is too heavy to lift"
 underdeep.1115.d: "Get them singing softly."
 underdeep.1115.d.flavor: "You hum a low old tune until the others take it up."
 underdeep.1115.d.success: "Soft voices warm the little room"
 underdeep.1115.d.failure: "The song falters into silence"
 underdeep.1115.e: "Nobody wakes me until it is out."
 underdeep.1115.e.flavor: "Rolled in your cloak, you forbid anyone to disturb your sleep."
 underdeep.1115.f: "Brew something hot from the pack."
 underdeep.1115.f.flavor: "Dried herbs steep in a cup while you tend the worst hurts."

 # 1116: The Tongueless Bell
 underdeep.1116.t: "The Tongueless Bell"
 underdeep.1116.desc: "The gallery opened on a round shaft where a bell of black bronze hung in the midst, taller than a man. It had no tongue. A slow tremor came from it, felt in the teeth rather than heard, keeping time with nothing the company could name. Frost had formed on every side of it but one. On that side the bronze was worn bright by hands."
 underdeep.1116.a: "Walk on and leave it."
 underdeep.1116.a.flavor: "You turn the company along the wall and do not look back at it."
 underdeep.1116.b: "Lay a hand on it."
 underdeep.1116.b.flavor: "You set your palm on the bright place and wait."
 underdeep.1116.b.success: "You feel what it keeps time with and will not forget it"
 underdeep.1116.b.failure: "Your teeth ache with it long afterward"
 underdeep.1116.c: "Muffle it with cloaks."
 underdeep.1116.c.flavor: "You have the cloaks passed up and bound around the bronze."
 underdeep.1116.c.success: "The tremor dies under the wool"
 underdeep.1116.c.failure: "The cloaks shake loose and it goes on"
 underdeep.1116.d: "Read how it was cast."
 underdeep.1116.d.flavor: "You run a thumb along the seam and name the pour."
 underdeep.1116.e: "Sing along with it."
 underdeep.1116.e.flavor: "You find the note it is not making and hold it."
 underdeep.1116.f: "Crack it with a hammer."
 underdeep.1116.f.flavor: "You swing at the bright place with all your weight."
 underdeep.1116.g: "Press your brow to it."
 underdeep.1116.g.flavor: "You lean your forehead against the cold bronze and let it keep time for you."

 # 1117: The Green Place
 underdeep.1117.t: "The Green Place"
 underdeep.1117.desc: "Where a crack in the roof let down a thread of grey light, something was growing. It was only moss with a few pale stems no taller than a finger, in a bed of black earth that someone had once carried there by the handful. The air was almost mild. The company stopped without being told. For a while no one said anything at all."
 underdeep.1117.a: "Sit a while."
 underdeep.1117.a.flavor: "You sit down near the stems and let the company do the same."
 underdeep.1117.b: "Find who planted it."
 underdeep.1117.b.flavor: "You look along the stone around the black earth for any sign of the gardener."
 underdeep.1117.b.success: "Someone scratched a gardener's notes into the stone beside it. You read them all"
 underdeep.1117.b.failure: "Whoever it was left nothing you can read"
 underdeep.1117.c: "Gather what can be eaten."
 underdeep.1117.c.flavor: "You take what the stems can spare and add it to the packs."
 underdeep.1117.c.success: "There is more here than it looked"
 underdeep.1117.c.failure: "It wilts as soon as it is picked"
 underdeep.1117.d: "Sing to it."
 underdeep.1117.d.flavor: "You sing low over the stems in the oldest words you have."
 underdeep.1117.e: "Water it from your flask."
 underdeep.1117.e.flavor: "You kneel down to give it the last good water you have."
 underdeep.1117.f: "Pick the useful leaves."
 underdeep.1117.f.flavor: "You choose a few leaves with care and bind them to the worst of the hurts."
 underdeep.1117.g: "Stamp it flat."
 underdeep.1117.g.flavor: "You walk across the black earth twice to be sure of it."
 underdeep.1117.h: "Bless the ground."
 underdeep.1117.h.flavor: "You kneel at the edge of the earth and speak the words over it."
 underdeep.1117.i: "Pull it up by the roots."
 underdeep.1117.i.flavor: "You close your hand on the stems and pull."

 # 1118: The Hanging Keys
 underdeep.1118.t: "The Hanging Keys"
 underdeep.1118.desc: "A low room opened off the passage, its walls set from floor to roof with small iron pegs. On every peg hung a key. There were keys of silver and plain iron, keys for great doors and for little boxes, each tied with a slip of hide marked in the same careful hand. They had been taken from people who had expected to go home. No one went in until the leader did."
 underdeep.1118.a: "Take the silver ones."
 underdeep.1118.a.flavor: "You go along the pegs and lift down only what will sell."
 underdeep.1118.b: "Leave them hanging."
 underdeep.1118.b.flavor: "You turn back to the door without touching a single peg. Let them keep what is theirs."
 underdeep.1118.c: "Read the tags."
 underdeep.1118.c.flavor: "You turn over the slips of hide and begin to read."
 underdeep.1118.c.success: "The hand is a clerk's. You learn how such records were kept"
 underdeep.1118.c.failure: "The names begin to sound familiar"
 underdeep.1118.d: "Find what they open."
 underdeep.1118.d.flavor: "You try the likeliest keys against the seams in the wall."
 underdeep.1118.d.success: "One turns. A small box slides out of the wall"
 underdeep.1118.d.failure: "The wall closes on your hand"
 underdeep.1118.e: "Take all of them."
 underdeep.1118.e.flavor: "You pull the keys down row by row and fill the sacks."
 underdeep.1118.g: "Speak the names aloud."
 underdeep.1118.g.flavor: "You read out each tag in a clear voice until you have no voice left."
 underdeep.1118.h: "Take them down and bury them."
 underdeep.1118.h.flavor: "You gather the keys in a cloak and lay them under the broken stones."
 underdeep.1118.i: "Hang up a key of your own."
 underdeep.1118.i.flavor: "You take a key from your belt and find an empty peg for it."

 # 1119: The White Hounds
 underdeep.1119.t: "The White Hounds"
 underdeep.1119.desc: "The company heard the panting before they saw anything. Seven long white shapes lay across the passage with their chins upon the stone, hairless and very thin. They had no eyes, nor any place where eyes had been. As the first boot came down the nearest head lifted. All the others lifted with it, turning a little from side to side to find the sound."
 underdeep.1119.a: "Stand and fight them."
 underdeep.1119.a.flavor: "You set your feet and make enough noise for all of them to find you."
 underdeep.1119.a.success: "The last of them lies down and does not rise"
 underdeep.1119.a.failure: "Teeth close on your leg"
 underdeep.1119.b: "Creep past in silence."
 underdeep.1119.b.flavor: "You go first, placing each foot as if the floor were asleep."
 underdeep.1119.b.success: "Not one head turns"
 underdeep.1119.b.failure: "A scrape of leather brings them on"
 underdeep.1119.c: "Set a ring of spears."
 underdeep.1119.c.flavor: "You close the company into a ring with the points turned outward."
 underdeep.1119.c.success: "They break on the spears and fall back"
 underdeep.1119.c.failure: "They go under the points"
 underdeep.1119.d: "Throw them the rations."
 underdeep.1119.d.flavor: "You judge the distance and throw the packs far down the side-passage."
 underdeep.1119.d.success: "They run after the food and do not return"
 underdeep.1119.d.failure: "They finish it and come on anyway"
 underdeep.1119.e: "Whistle them to heel."
 underdeep.1119.e.flavor: "You give two low notes and wait."
 underdeep.1119.g: "Let them smell your hand."
 underdeep.1119.g.flavor: "You hold out your hand for the nearest of them to smell."
 underdeep.1119.h: "Stand still until they forget."
 underdeep.1119.h.flavor: "You stop where you are and breathe as little as you can."
 underdeep.1119.i: "Fight them barehanded."
 underdeep.1119.i.flavor: "You throw down your blade where the company can see it."
 underdeep.1119.j: "Draw them away yourself."
 underdeep.1119.j.flavor: "You strike your shield and run down the side-passage."

 # 1120: The Black Ice
 underdeep.1120.t: "The Black Ice"
 underdeep.1120.desc: "One wall of the gallery was a single sheet of black ice, polished so smooth that the company walked beside themselves as they went. Torch for torch the shapes kept pace. Near the end of the wall the leader stopped to look back. The shapes in the ice had stopped too, but they had not turned their heads. They were looking at something behind the company. Slowly they began to back away."
 underdeep.1120.a: "Keep walking."
 underdeep.1120.a.flavor: "You fix your eyes on the passage ahead and do not look at the wall again."
 underdeep.1120.b: "Turn them to face it."
 underdeep.1120.b.flavor: "You order the company about to face whatever the shapes are watching."
 underdeep.1120.b.success: "There is nothing behind you. The shapes in the ice turn back"
 underdeep.1120.b.failure: "Something is there. No one can say afterward what it was"
 underdeep.1120.c: "Count the shapes."
 underdeep.1120.c.flavor: "You walk back along the ice, counting under your breath."
 underdeep.1120.c.success: "You count them twice and know which one does not belong"
 underdeep.1120.c.failure: "There is one more each time you count"
 underdeep.1120.d: "Break the ice."
 underdeep.1120.d.flavor: "You set the butt of your spear to the black sheet and drive it home."
 underdeep.1120.d.success: "It cracks from roof to floor. Behind it lie the packs of an older company"
 underdeep.1120.d.failure: "The splinters come out sharp as knives"
 underdeep.1120.e: "Ask what they see."
 underdeep.1120.e.flavor: "You speak softly to the ice, as you would to a frightened child."
 underdeep.1120.f: "I knew it. Keep moving."
 underdeep.1120.f.flavor: "You have been waiting for this since the daylight. You do not slow down."
 underdeep.1120.g: "Hold a flame to it."
 underdeep.1120.g.flavor: "You press a torch to the ice until it weeps and the shapes run out of it."
 underdeep.1120.h: "Bid them come out of the ice."
 underdeep.1120.h.flavor: "You lay your palm flat on the black ice and speak the words the dark has taught you."

 # 1121: The Hiding Place
 underdeep.1121.t: "The Hiding Place"
 underdeep.1121.desc: "Behind a fallen slab they found a space no larger than a cart, swept clean. Someone had lived there in hiding for a long time. A shelf had been cut into the rock to hold a lamp. Beneath it lay a row of small figures whittled from bone, a horse and a dog and a woman with a basket. It was warm enough to sleep, so they lay down among the little figures to sleep."
 underdeep.1121.a: "Rest here."
 underdeep.1121.a.flavor: "You lie down among the little figures and close your eyes."
 underdeep.1121.b: "Leave something for them."
 underdeep.1121.b.flavor: "You set a share of the stores on the shelf beneath the lamp."
 underdeep.1121.c: "Talk about who lived here."
 underdeep.1121.c.flavor: "You start the company guessing who whittled the figures and why."
 underdeep.1121.c.success: "By the end they have given the hermit a name and a whole life"
 underdeep.1121.c.failure: "The guessing turns dark and then stops"
 underdeep.1121.d: "Search behind the shelf."
 underdeep.1121.d.flavor: "You work your fingers into the crack behind the shelf."
 underdeep.1121.d.success: "A purse of old coins is hidden there. You wish you had not seen what lay beneath it"
 underdeep.1121.d.failure: "Your hand closes on something that was not put there for you"
 underdeep.1121.e: "Add a figure to the row."
 underdeep.1121.e.flavor: "You carve a small torch from a splinter of bone and set it at the end of the row."
 underdeep.1121.f: "Burn them for warmth."
 underdeep.1121.f.flavor: "You sweep the figures into the fire and hold your hands to it."
 underdeep.1121.g: "Give each one a figure."
 underdeep.1121.g.flavor: "You hand a little bone figure to each of the company to carry home."
 underdeep.1121.h: "Say the words for them."
 underdeep.1121.h.flavor: "You speak the words for the dead over the swept floor."
 underdeep.1121.i: "Smash the row."
 underdeep.1121.i.flavor: "You bring your fist down on the shelf and grind the pieces underfoot."

 # 1122: The Still Air
 underdeep.1122.t: "The Still Air"
 underdeep.1122.desc: "The torches began to burn low without any wind to account for it. The air in that stretch of gallery did not move at all. It had a faint sweetness to it, like fruit left too long in a shut room. One of the company sat down against the wall and smiled. Another yawned. The far end of the gallery lay a long way off, past the place where the flames turned blue."
 underdeep.1122.a: "Run for the far end."
 underdeep.1122.a.flavor: "You take one deep breath and sprint for the blue flames."
 underdeep.1122.a.success: "You reach clean air with your head still clear"
 underdeep.1122.a.failure: "You fall halfway and crawl the rest"
 underdeep.1122.b: "Bind wet cloths over faces."
 underdeep.1122.b.flavor: "You have the last of the water poured over cloths and tied over every mouth."
 underdeep.1122.b.success: "Not one of them sits down"
 underdeep.1122.b.failure: "The cloths dry too fast"
 underdeep.1122.c: "Keep them walking."
 underdeep.1122.c.flavor: "You walk up and down the file, pulling up anyone who slows."
 underdeep.1122.c.success: "You bring every one of them through"
 underdeep.1122.c.failure: "One of them lies down and will not get up"
 underdeep.1122.d: "Go back the long way."
 underdeep.1122.d.flavor: "You turn the company around and take the long road past it."
 underdeep.1122.e: "I know this air."
 underdeep.1122.e.flavor: "You sniff once and point the company to the low side of the gallery."
 underdeep.1122.f: "Hold your breath and go."
 underdeep.1122.f.flavor: "You fill your chest and walk the whole length without breathing out."
 underdeep.1122.g: "Old mines breathe like this."
 underdeep.1122.g.flavor: "You lead them through low and quick, as it was done in the mines of your fathers."
 underdeep.1122.h: "Walk it slowly, head up."
 underdeep.1122.h.flavor: "You walk through at an easy pace so that the company can see it done."
 underdeep.1122.i: "Carry the last one out."
 underdeep.1122.i.flavor: "You go back for whoever has fallen behind and carry them through on your shoulders."
 underdeep.1122.j: "Breathe deep."
 underdeep.1122.j.flavor: "You fill your lungs with the sweet air and smile as the others did."

 # 1123: The Great Balance
 underdeep.1123.t: "The Great Balance"
 underdeep.1123.desc: "In the middle of the chamber stood a balance of black iron, as tall as two men. One pan hung heaped with old gold. The other held a single grey pebble. The two hung perfectly level. A fine dust had settled on the gold, but the pebble was clean, as though it had been set there that morning. Nothing else in the room had been disturbed."
 underdeep.1123.a: "Take a handful."
 underdeep.1123.a.flavor: "You reach into the heaped pan and take as much as one hand can hold."
 underdeep.1123.a.success: "The pans do not move"
 underdeep.1123.a.failure: "The pan swings down on your arm"
 underdeep.1123.b: "Match the weight."
 underdeep.1123.b.flavor: "You add coin to the pebble's side until the beam begins to tremble."
 underdeep.1123.b.success: "The beam holds level. The rest is yours"
 underdeep.1123.b.failure: "The beam swings and the iron pan catches you"
 underdeep.1123.c: "Find what the pebble is."
 underdeep.1123.c.flavor: "You lift the pebble out with two fingers and hold it to the torch."
 underdeep.1123.c.success: "It is a weight stone from the old counting-houses, older than the gold"
 underdeep.1123.c.failure: "It is warm and it is not a pebble"
 underdeep.1123.d: "Empty both pans."
 underdeep.1123.d.flavor: "You sweep the gold into the sacks and toss the pebble after it."
 underdeep.1123.e: "I know this metal."
 underdeep.1123.e.flavor: "You scrape the dust from one coin and test it with your teeth."
 underdeep.1123.f: "Add a coin to the pile."
 underdeep.1123.f.flavor: "You lay one coin of your own on the heap and take nothing."
 underdeep.1123.g: "Cast the pebble down a shaft."
 underdeep.1123.g.flavor: "You carry the pebble to the nearest shaft and drop it in."
 underdeep.1123.h: "Lay your hand in the pan."
 underdeep.1123.h.flavor: "You set your hand down beside the pebble and wait to be weighed."

 # 1124: The Same Word
 underdeep.1124.t: "The Same Word"
 underdeep.1124.desc: "The walls of the passage had been scratched over from floor to roof by something that had taken a very long time to do it. It was one word, repeated thousands of times in the same small hand. The company could not read it until the torches came close. Then several of them turned to look at [ROOT.Char.GetFirstName]. The scratches were deepest near the floor, where they were still white.\n\n#italic [ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName],[ROOT.Char.GetFirstName]...#!"
 underdeep.1124.a: "Walk on and say nothing."
 underdeep.1124.a.flavor: "You keep your eyes on the floor and walk a little faster."
 underdeep.1124.b: "Tell them it is a trick."
 underdeep.1124.b.flavor: "You laugh loud enough for everyone to hear and call it a cheap trick."
 underdeep.1124.b.success: "They laugh with you. It is only a word"
 underdeep.1124.b.failure: "No one laughs. They are still looking at you"
 underdeep.1124.c: "Follow the scratches."
 underdeep.1124.c.flavor: "You follow the lines down toward the floor where the newest ones are."
 underdeep.1124.c.success: "The hand changes as it goes. You learn more of its maker than you wished"
 underdeep.1124.c.failure: "At the bottom the scratches are still being made"
 underdeep.1124.d: "As it should be."
 underdeep.1124.d.flavor: "You run your fingers along your own name and nod."
 underdeep.1124.e: "Keep writing."
 underdeep.1124.e.flavor: "You sit down by the wall and begin where the last scratch left off."
 underdeep.1124.f: "Read what it really says."
 underdeep.1124.f.flavor: "You trace one of the words slowly until you see past the letters."
 underdeep.1124.g: "Sign it."
 underdeep.1124.g.flavor: "You cut your full name and titles into the wall beneath the rest."
 underdeep.1124.h: "Burn it clean with a torch."
 underdeep.1124.h.flavor: "You drag a torch along the wall until the scratches are black."
 underdeep.1124.i: "Write it once more."
 underdeep.1124.i.flavor: "You find a clear space near the floor and scratch it once more, slowly, so that something can watch you do it."

 # 1125: The Hot Spring
 underdeep.1125.t: "The Hot Spring"
 underdeep.1125.desc: "Steam drifted along the roof of the cavern long before they found its source. A pool lay there among the rocks, clear to the bottom and hot as a bath. It smelled of nothing but stone. The company took off their boots for the first time since the daylight. For a little while their spirits lifted."
 underdeep.1125.a: "Soak a while."
 underdeep.1125.a.flavor: "You sit at the edge with your feet in the water and let the heat work."
 underdeep.1125.b: "Wash the wounds."
 underdeep.1125.b.flavor: "You clean every cut in the hot water and bind it fresh."
 underdeep.1125.b.success: "The worst of it is clean at last"
 underdeep.1125.b.failure: "The heat opens the cuts again"
 underdeep.1125.c: "Set a watch first."
 underdeep.1125.c.flavor: "You post two at the mouth of the cavern before anyone takes off a boot."
 underdeep.1125.c.success: "Nothing comes. Everyone rests easier for it"
 underdeep.1125.c.failure: "The watch see shapes in the steam all night"
 underdeep.1125.d: "Boil what food remains."
 underdeep.1125.d.flavor: "You set the pots in the shallows and boil the hard rations soft."
 underdeep.1125.d.success: "The stores stretch further than they did"
 underdeep.1125.d.failure: "The pot tips into the pool"
 underdeep.1125.e: "Steep something in the water."
 underdeep.1125.e.flavor: "You crush a handful of dried leaves into the shallows and bathe the hurts in it."
 underdeep.1125.f: "Nobody leaves until I say."
 underdeep.1125.f.flavor: "You lie back in the water and announce that the company will wait."
 underdeep.1125.g: "See everyone washed first."
 underdeep.1125.g.flavor: "You stand at the edge with a cloth until every one of them has bathed."
 underdeep.1125.h: "Bless the water."
 underdeep.1125.h.flavor: "You kneel at the edge and speak the blessing for clean water."
 underdeep.1125.i: "Hold your head under."
 underdeep.1125.i.flavor: "You go under and stay there, listening to what the water says."

 # 1126: The Burned Feather
 underdeep.1126.t: "The Burned Feather"
 underdeep.1126.desc: "Where the stair turned, the glass of the wall had once run like water and set again. Something had been caught in it as it cooled. It was a single feather, longer than a man was tall, golden at the root and burned black at the tip. No bird of these days had ever worn it. The company stood a long while looking at it, but no one spoke of the battle it must have come from.\n\n#weak This event comes from the entrance you chose: Thangorodrim.#!"
 underdeep.1126.a: "Leave it in the glass."
 underdeep.1126.a.flavor: "You bow your head to the feather and lead the company on."
 underdeep.1126.b: "Cut it out of the glass."
 underdeep.1126.b.flavor: "You set your blade to the glass and work it loose a sliver at a time."
 underdeep.1126.b.success: "It comes free whole. There are men who would pay anything for it"
 underdeep.1126.b.failure: "The glass shatters into your hands"
 underdeep.1126.c: "Read the battle in the glass."
 underdeep.1126.c.flavor: "You hold a torch to the wall and study the shapes caught in it beside the feather."
 underdeep.1126.c.success: "Wings and fire and a falling shadow. You learn where the old walls were weakest"
 underdeep.1126.c.failure: "The shapes in the glass are still falling"
 underdeep.1126.d: "Sing of the Host of the West."
 underdeep.1126.d.flavor: "You sing of the Eagles of Thorondor and of the morning when the towers fell."
 underdeep.1126.e: "Spit on it."
 underdeep.1126.e.flavor: "You spit on the glass where the feather is and laugh at it."
 underdeep.1126.f: "Take a quill for your banner."
 underdeep.1126.f.flavor: "You chip one golden barb loose to carry home on your standard."
 underdeep.1126.g: "Bless what fell here."
 underdeep.1126.g.flavor: "You lay your hand flat on the glass and speak the words for the fallen of the Host."
 underdeep.1126.h: "Snap the black tip off."
 underdeep.1126.h.flavor: "You break off the burned end and keep it close."

 # 1127: The Black Roof
 underdeep.1127.t: "The Black Roof"
 underdeep.1127.desc: "For a long way the roof of the passage was not stone. It was black and ribbed. It sloped down on either hand like the inside of a great hall. Here and there a plate the size of a shield hung loose by one edge. The air beneath it was warm. Some of the company had heard what fell upon Thangorodrim at the end of the War of Wrath. They did not tell the tale now.\n\n#weak This event comes from the entrance you chose: Thangorodrim.#!"
 underdeep.1127.a: "Prise loose a scale."
 underdeep.1127.a.flavor: "You get your blade under the edge of a hanging plate and lean on it."
 underdeep.1127.a.success: "It comes away in your arms, black and heavy and worth a fortune"
 underdeep.1127.a.failure: "Its edge comes down on you"
 underdeep.1127.b: "Keep them moving under it."
 underdeep.1127.b.flavor: "You walk the file at a steady pace and let no one stop to look up."
 underdeep.1127.b.success: "Every one of them comes out the far side"
 underdeep.1127.b.failure: "A plate drops into the middle of the file"
 underdeep.1127.c: "Name what it was."
 underdeep.1127.c.flavor: "You walk beneath the ribs counting them and match them to the old tales."
 underdeep.1127.c.success: "It is Ancalagon the Black. You know now how the mountain broke"
 underdeep.1127.c.failure: "While you count, a loose plate swings down"
 underdeep.1127.d: "Go round by the lower galleries."
 underdeep.1127.d.flavor: "You turn the company down a side-stair and leave the black roof behind."
 underdeep.1127.e: "Strip a scale for the forge."
 underdeep.1127.e.flavor: "You knock a plate loose at the one place it will come away clean."
 underdeep.1127.f: "Cut your mark into the bone."
 underdeep.1127.f.flavor: "You climb up and cut your name into the nearest rib for those who come after."
 underdeep.1127.g: "Speak its doom over it."
 underdeep.1127.g.flavor: "You say aloud how the great worm fell and who struck it down."
 underdeep.1127.h: "Lay your palm on the warm bone."
 underdeep.1127.h.flavor: "You reach up and rest your hand on the rib until the warmth is in your blood."

 # 1128: The Snowmen's Gift
 underdeep.1128.t: "The Snowmen's Gift"
 underdeep.1128.desc: "A little way down the ledge someone had built a cairn of flat stones against the wall. Inside, wrapped in sealskin, were dried fish, a pot of seal fat and a charm of carved ivory on a thong. The Lossoth of Forochel leave such things at the mouths of evil places, so that whatever lives below will take the gift and stay below. The gifts were fresh. Someone had come this way not long ago.\n\n#weak This event comes from the entrance you chose: Morgoth's Well.#!"
 underdeep.1128.a: "Rest by the cairn."
 underdeep.1128.a.flavor: "You sit in the lee of the cairn out of the wind and let the company rest."
 underdeep.1128.b: "Wrap it up again."
 underdeep.1128.b.flavor: "You fold the sealskin back over the gift and set the stones as they were."
 underdeep.1128.c: "Read the ivory charm."
 underdeep.1128.c.flavor: "You turn the charm in the torchlight and follow the cuts with a fingernail."
 underdeep.1128.c.success: "It is a prayer of the Snowmen. You understand it better than you expected"
 underdeep.1128.c.failure: "The cuts mean nothing to you. They make you uneasy all the same"
 underdeep.1128.d: "Follow whoever left it."
 underdeep.1128.d.flavor: "You look for the marks of the Snowmen's boots on the ledge."
 underdeep.1128.d.success: "Their tracks show which ways down they would not take"
 underdeep.1128.d.failure: "The tracks go down. None come back up"
 underdeep.1128.e: "Take a seal from the ice above."
 underdeep.1128.e.flavor: "You climb back to the ice with a spear and come down at dusk with fresh meat."
 underdeep.1128.f: "Take the ivory charm."
 underdeep.1128.f.flavor: "You slip the charm into your pack. It will sell well in the south."
 underdeep.1128.g: "Bless the gift."
 underdeep.1128.g.flavor: "You speak a blessing over the cairn so that it may serve its purpose."
 underdeep.1128.h: "Carry the gift down yourself."
 underdeep.1128.h.flavor: "You lift the bundle from the cairn and take it with you to whatever waits below."

 # 1129: The Cold Breath
 underdeep.1129.t: "The Cold Breath"
 underdeep.1129.desc: "Halfway down the well the ledge passed a hollow in the wall that was full of white mist. In the mist something was breathing. Each breath came out as a long cold sigh that laid fresh frost on the ledge, so that the stone was slick all the way past it. Lossoth tales speak of cold-drakes that sleep away whole lives of men in the ice. None of the company had believed them until now.\n\n#weak This event comes from the entrance you chose: Morgoth's Well.#!"
 underdeep.1129.a: "Rope everyone together."
 underdeep.1129.a.flavor: "You pass the rope along the file and tie each of them to the next."
 underdeep.1129.a.success: "When one slips, the rope holds them"
 underdeep.1129.a.failure: "The rope drags two of them down together"
 underdeep.1129.b: "Creep past between breaths."
 underdeep.1129.b.flavor: "You wait for the sigh to end and then go quickly over the frost."
 underdeep.1129.b.success: "You are past before the next breath"
 underdeep.1129.b.failure: "The breath catches you halfway"
 underdeep.1129.c: "Kill it in its sleep."
 underdeep.1129.c.flavor: "You go into the mist with your blade drawn and feel for the throat."
 underdeep.1129.c.success: "It never wakes. Its hoard is small but real"
 underdeep.1129.c.failure: "It wakes"
 underdeep.1129.d: "Climb back and find another way."
 underdeep.1129.d.flavor: "You turn the company around on the ledge and go back up to look for another way."
 underdeep.1129.e: "Read its sleep."
 underdeep.1129.e.flavor: "You listen to three breaths and know how long it will be before the fourth."
 underdeep.1129.f: "Let someone braver go first."
 underdeep.1129.f.flavor: "You step aside on the ledge and wave the others past."
 underdeep.1129.g: "Touch its snout and walk on."
 underdeep.1129.g.flavor: "You reach into the mist and lay a hand on the cold snout before you go."
 underdeep.1129.h: "Breathe in its breath."
 underdeep.1129.h.flavor: "You kneel at the mouth of the hollow and draw the frost into your lungs."

 # 1130: The Toll-Stone
 underdeep.1130.t: "The Toll-Stone"
 underdeep.1130.desc: "A little below the mouth of the cleft a block of grey stone stood across half the stair, cut with a slot in its top. Around its foot lay coins of a dozen realms, some of them from kingdoms that are only names now. Above the slot was a line of runes worn almost smooth. The snow outside had not come in. Neither, it seemed, had any thief.\n\n#weak This event comes from the entrance you chose: the cleft above Durnost.#!"
 underdeep.1130.a: "Pay the toll."
 underdeep.1130.a.flavor: "You drop a good coin into the slot and listen to it fall a long way."
 underdeep.1130.b: "Take the coins."
 underdeep.1130.b.flavor: "You scoop up the coins around the foot of the stone."
 underdeep.1130.b.success: "The stone does nothing"
 underdeep.1130.b.failure: "The slot closes on your fingers"
 underdeep.1130.c: "Read the runes."
 underdeep.1130.c.flavor: "You brush the frost from the runes and trace them one by one."
 underdeep.1130.c.success: "They say the mountain keeps count of who pays. You learn which ways it guards"
 underdeep.1130.c.failure: "They say the mountain keeps count. It has counted you"
 underdeep.1130.d: "Find the catch."
 underdeep.1130.d.flavor: "You feel along the seams of the block for whatever opens it."
 underdeep.1130.d.success: "A panel slides back. The stone is full"
 underdeep.1130.d.failure: "Something inside the stone bites"
 underdeep.1130.e: "Pay it in the old way."
 underdeep.1130.e.flavor: "You lay a nugget of raw ore in the slot instead of a coin."
 underdeep.1130.f: "Break the stone open."
 underdeep.1130.f.flavor: "You set a crowbar in the slot and heave."
 underdeep.1130.g: "Pay for the whole company."
 underdeep.1130.g.flavor: "You count a coin into the slot for every one of the company."
 underdeep.1130.h: "Pay with blood."
 underdeep.1130.h.flavor: "You cut your palm and let it drip into the slot."

 # 1131: The Talking Wind
 underdeep.1131.t: "The Talking Wind"
 underdeep.1131.desc: "Off the stair a narrow cave ran back into the mountain, open to the sky at its far end by a crack no wider than a hand. Wind came down through it from the high snows. It made a low sound in the rock like many people talking quietly in another room. After the silence of the stair it was a comfort. The company sat with their backs to the wall and listened until most of them were asleep.\n\n#weak This event comes from the entrance you chose: the cleft above Durnost.#!"
 underdeep.1131.a: "Sleep to the sound."
 underdeep.1131.a.flavor: "You lie down with your cloak over your ears and let the voices carry you off."
 underdeep.1131.b: "Listen for words in it."
 underdeep.1131.b.flavor: "You sit by the crack and listen as closely as you can."
 underdeep.1131.b.success: "You hear the old names of the peaks above and fall asleep repeating them"
 underdeep.1131.b.failure: "You hear your own name and do not sleep again"
 underdeep.1131.c: "Stop the crack and sleep warm."
 underdeep.1131.c.flavor: "You have the spare cloaks stuffed into the crack until the cold stops."
 underdeep.1131.c.success: "The cave grows warm. Everyone sleeps through the night"
 underdeep.1131.c.failure: "The cloaks blow out in the night and the cold comes back"
 underdeep.1131.d: "Hear what the mountain says."
 underdeep.1131.d.flavor: "You sit very still with your eyes shut and let the mountain speak."
 underdeep.1131.e: "Talk over it."
 underdeep.1131.e.flavor: "You start a story loud enough to drown out the other voices."
 underdeep.1131.f: "Someone is in the next room."
 underdeep.1131.f.flavor: "You stay awake all night with your ear to the rock."
 underdeep.1131.g: "Let them talk of home."
 underdeep.1131.g.flavor: "You ask each of them what their own house sounds like in a wind."
 underdeep.1131.h: "Bless the wind."
 underdeep.1131.h.flavor: "You stand in the draught and give the wind a blessing to carry up the mountain."
 underdeep.1131.i: "Answer the voices."
 underdeep.1131.i.flavor: "You put your mouth to the crack and answer them."

 # 1132: The Door That Held
 underdeep.1132.t: "The Door That Held"
 underdeep.1132.desc: "Some way down the crawlway the dragon-worn rock gave way to dressed stone. A door of the Dwarves stood shut in the side of the tunnel, banded with iron gone black. Something very large had tried to get through it long ago. The gouges went deep into the stone on either side, but the door had held. Before it lay the bones of a Dwarf in rusted mail with his axe across his knees, still facing the way the drake had come.\n\n#weak This event comes from the entrance you chose: the Wyrms' Pathway.#!"
 underdeep.1132.a: "Take the axe."
 underdeep.1132.a.flavor: "You lift the axe from the bony knees. The haft has rotted but the head is good."
 underdeep.1132.b: "Leave him at his post."
 underdeep.1132.b.flavor: "You salute the old guard and lead the company past without touching him."
 underdeep.1132.c: "Open the door."
 underdeep.1132.c.flavor: "You work at the lock with a thin blade while the company holds the light."
 underdeep.1132.c.success: "It swings open on the treasury of a hall the dragons never took"
 underdeep.1132.c.failure: "The door was made to keep out worse than you"
 underdeep.1132.d: "Read the runes on the door."
 underdeep.1132.d.flavor: "You rub away the soot of an old fire and spell out the runes."
 underdeep.1132.d.success: "The door names its hall and the last king of it. You know now where the Dwarves dug deepest"
 underdeep.1132.d.failure: "The last line names the cold-drake. Nobody likes the sound of it"
 underdeep.1132.e: "Close his eyes and name him."
 underdeep.1132.e.flavor: "You kneel before the guard and say the words your people say for the fallen."
 underdeep.1132.f: "Coax the old lock."
 underdeep.1132.f.flavor: "You find the craftsman's mark on the lock and open it the way it was meant to be opened."
 underdeep.1132.g: "Strip him and the door both."
 underdeep.1132.g.flavor: "You take the mail and the axe and lever the iron bands off the door."
 underdeep.1132.h: "Carry him home."
 underdeep.1132.h.flavor: "You wrap the bones in a cloak and give up a share of the stores to carry them."
 underdeep.1132.i: "Turn him to face the door."
 underdeep.1132.i.flavor: "You turn the bones around so that he looks at what he guarded."

 # 1133: Something Uses This Road
 underdeep.1133.t: "Something Uses This Road"
 underdeep.1133.desc: "The smooth floor of the crawlway was not as old as they had thought. Here the scrapes along the walls were fresh and pale. A smell of hot iron hung in the air. Then from far ahead came a long dragging sound that filled the tunnel from wall to wall, growing nearer. The tales of the Grey Mountains say that the cold-drakes went away north long ago. They do not say that all of them did.\n\n#weak This event comes from the entrance you chose: the Wyrms' Pathway.#!"
 underdeep.1133.a: "Hide in the side-holes."
 underdeep.1133.a.flavor: "You push the company into the holes along the wall and put out the torches."
 underdeep.1133.a.success: "It drags past and does not stop"
 underdeep.1133.a.failure: "It stops by your hole"
 underdeep.1133.b: "Set an ambush."
 underdeep.1133.b.flavor: "You post the spears on both sides of a narrow place and wait."
 underdeep.1133.b.success: "It comes into the narrows and does not leave them"
 underdeep.1133.b.failure: "It is bigger than the narrows"
 underdeep.1133.c: "Stand alone in the way."
 underdeep.1133.c.flavor: "You send the others back and step out into the middle of the tunnel."
 underdeep.1133.c.success: "It sees you standing and turns back into the dark"
 underdeep.1133.c.failure: "It does not turn back"
 underdeep.1133.d: "Run back the way you came."
 underdeep.1133.d.flavor: "You turn the company around and run until the sound is gone."
 underdeep.1133.e: "Wait for its head."
 underdeep.1133.e.flavor: "You stand where the head must come and strike once."
 underdeep.1133.f: "Douse every light."
 underdeep.1133.f.flavor: "You remember the old songs of the Grey Mountains. Drakes hunt by flame."
 underdeep.1133.g: "Meet it head on."
 underdeep.1133.g.flavor: "You walk toward the sound with your blade out so the company can see it."
 underdeep.1133.h: "Get the others into the holes first."
 underdeep.1133.h.flavor: "You push every one of them into cover before you look for your own."
 underdeep.1133.i: "Call to it."
 underdeep.1133.i.flavor: "You cup your hands and call down the tunnel in the old tongue of the North."

 ### Encounters ###

 # 1201: Bare Feet
 underdeep.1201.t: "Bare Feet"
 underdeep.1201.desc: "In the rime of the passage floor they found the print of a bare foot, then another, going on before them into the dark. The marks were narrow and they were fresh, for the edges had not yet softened. They followed for the length of a long bowshot, speaking low. Then the prints came to the middle of the way and ended, with neither side-turning nor stair, nor any sign of anyone turning back."
 underdeep.1201.a: "Ignore them and keep going."
 underdeep.1201.a.flavor: "Stepping past the last print, you order the company not to speak of it."
 underdeep.1201.b: "Post torches at the rear and go on."
 underdeep.1201.b.flavor: "Burning brands go behind the column so nothing can come up unseen."
 underdeep.1201.c: "Find out where they went."
 underdeep.1201.c.flavor: "You sound the walls and floor around the last print for a concealed passage."
 underdeep.1201.c.success: "You find a way the prints took"
 underdeep.1201.c.failure: "The trail ends in bare rock"
 underdeep.1201.d: "I will not follow those."
 underdeep.1201.d.flavor: "At the first print you halt and insist on taking another passage."
 underdeep.1201.e: "I know feet and those are wrong."
 underdeep.1201.e.flavor: "Crouching beside the narrow marks, you point out how their toes splay oddly."
 underdeep.1201.f: "Let me read the tracks."
 underdeep.1201.f.flavor: "Stride by stride, you read where the walker truly went."

 # 1202: The Count
 underdeep.1202.t: "The Count"
 underdeep.1202.desc: "At the halt the company was counted by name, as was the custom. The count came to one more than had entered. When it was counted again it came right. No one spoke of it as they went on, but each walked a little closer to the one before. Some looked often at the last in the file and the last in the file looked often behind."
 underdeep.1202.a: "Count them again."
 underdeep.1202.a.flavor: "You line everyone up to call the roll a third time. They do not thank you for it."
 underdeep.1202.b: "No more counting."
 underdeep.1202.b.flavor: "Roll calls are ended, though the doubt will follow them deeper."
 underdeep.1202.c: "Talk to each one."
 underdeep.1202.c.flavor: "You go down the file with a question for each, listening for the wrong answer."
 underdeep.1202.c.success: "One of them answers too well"
 underdeep.1202.c.failure: "Something slips off into the dark before you reach it"
 underdeep.1202.d: "It came right, so that settles it."
 underdeep.1202.d.flavor: "You declare the matter closed and glare down anyone still whispering."

 # 1203: A Wind from Below
 underdeep.1203.t: "A Wind from Below"
 underdeep.1203.desc: "Without warning a warm wind came up the passage, smelling of hot iron. The torches flared and streamed. The frost upon the walls wept for a moment, then ran down. When the wind failed, the wet froze again where it had stopped, so that the walls were hung with small dark teeth. It did not come again, though for some while afterward they could smell it on their cloaks, faint beneath the smoke of the torches."
 underdeep.1203.a: "Fix the torches and go on."
 underdeep.1203.a.flavor: "You trim the scorched wicks and relight the worst of the brands."
 underdeep.1203.b: "Work out what burns down there."
 underdeep.1203.b.flavor: "Sniffing your cloak, you weigh the iron reek against what you know."
 underdeep.1203.b.success: "The smell tells you what awaits"
 underdeep.1203.b.failure: "The smell tells you nothing useful"
 underdeep.1203.c: "Move before it comes back."
 underdeep.1203.c.flavor: "The moment the air falls still, you hurry the company onward."
 underdeep.1203.d: "That is a forge and someone keeps it."
 underdeep.1203.d.flavor: "You name the metal by its smell and reckon how recently the bellows blew."
 underdeep.1203.e: "I know when a wind is turning."
 underdeep.1203.e.flavor: "A wet finger reads the draught and you warn of what rises beneath."

 # 1204: A Voice Calling
 underdeep.1204.t: "A Voice Calling"
 underdeep.1204.desc: "From a passage they had not chosen there came a voice, thin with distance, calling as one calls across a field at evening. It called a name known to one of the company, the name of one who had lain long in the earth. Nothing more was said for a time. Again it called from somewhere closer, less patiently than before."
 underdeep.1204.a: "Cover your ears and keep walking."
 underdeep.1204.a.flavor: "Palms pressed to your head, you drive your feet forward."
 underdeep.1204.a.success: "You walk until it is behind you"
 underdeep.1204.a.failure: "You hear every word through your hands"
 underdeep.1204.b: "Answer it."
 underdeep.1204.b.flavor: "You call back into the passage and wait for what replies."
 underdeep.1204.b.success: "Something comes out to meet you"
 underdeep.1204.b.failure: "It hears you and you cannot take it back"
 underdeep.1204.c: "Keep them in line and march."
 underdeep.1204.c.flavor: "Barked orders close the ranks until boots drown out the calling."
 underdeep.1204.c.success: "Marching boots smother the voice"
 underdeep.1204.c.failure: "The ranks waver at the calling"

 # 1205: The Pegged Rope
 underdeep.1205.t: "The Pegged Rope"
 underdeep.1205.desc: "Along the wall of the passage ran a rope, stiff with ice, pegged every few paces by some careful hand. It was good rope, though none of them could say how old. They followed it for a time, taking comfort in it, for it spoke of others going this way and meaning to come back. Then it turned, dropping into a shaft in the floor. As they stood over the shaft, the rope went taut and something below pulled on it three times."
 underdeep.1205.a: "Leave the rope alone."
 underdeep.1205.a.flavor: "Lifting your hand from the cord, you warn the others away from it."
 underdeep.1205.b: "Haul it up."
 underdeep.1205.b.flavor: "You set your feet, wrap the line around your forearms and drag it hand over hand."
 underdeep.1205.b.success: "A laden sack comes up the rope"
 underdeep.1205.b.failure: "The rope snaps taut and burns you"
 underdeep.1205.c: "Keep everyone moving and calm."
 underdeep.1205.c.flavor: "Talking over the silence, you usher everyone quickly past the pegs."
 underdeep.1205.c.success: "They pass the rope without a tremor"
 underdeep.1205.c.failure: "Panic ripples along the file"
 underdeep.1205.d: "Pull back three times."
 underdeep.1205.d.flavor: "Gripping the icy line, you return the signal tug for tug."
 underdeep.1205.e: "I know how miners mark a way."
 underdeep.1205.e.flavor: "You study the spacing of the pegs and follow their code to a side way."

 # 1206: A Civil Question
 underdeep.1206.t: "A Civil Question"
 underdeep.1206.desc: "A lone figure came up the passage without a light, walking as one walks who is tired and nearly home. It stopped short of the torches and asked very civilly whether this was the way to the gate. Then it asked whether the company had news of the king. The voice was hoarse, yet young. But the cloak it wore had been out of fashion for a thousand years. The hem of that cloak did not stir at all."
 underdeep.1206.a: "Point the way and walk on."
 underdeep.1206.a.flavor: "With a gesture back along the passage, you hurry the company past it."
 underdeep.1206.b: "Tell it gently how long it has been."
 underdeep.1206.b.flavor: "You explain that a thousand years have gone and that it may rest now."
 underdeep.1206.b.success: "It sighs and fades into the dark"
 underdeep.1206.b.failure: "It refuses to understand you"
 underdeep.1206.c: "Draw steel and bar the way."
 underdeep.1206.c.flavor: "Your blade levels at the stranger and you refuse it passage."
 underdeep.1206.c.success: "It halts and turns back"
 underdeep.1206.c.failure: "Its cold hand finds your arm"
 underdeep.1206.d: "Tell it the war was won."
 underdeep.1206.d.flavor: "You assure it that the king triumphed and that the gates stand open."
 underdeep.1206.e: "Ask it which king it served."
 underdeep.1206.e.flavor: "You address it in the old courtly speech and learn whose banner it followed."

 # 1207: The Unfinished Carving
 underdeep.1207.t: "The Unfinished Carving"
 underdeep.1207.desc: "A long relief ran beside the passage, left unfinished by whoever had begun it. They passed it with little thought. At the next turning they found it again. The carver had gone on in the meantime, for the stone now showed a file of small figures with torches. There were as many figures as there were in the company. The last of them had no face yet."
 underdeep.1207.a: "Look away and keep walking."
 underdeep.1207.a.flavor: "You put a hand on the nearest shoulder and turn it toward the road."
 underdeep.1207.b: "Study it until you understand it."
 underdeep.1207.b.flavor: "You hold the torch close and follow the chisel marks to their end."
 underdeep.1207.b.success: "You see in time where to stop looking"
 underdeep.1207.b.failure: "It shows you one thing more"

 # 1208: The Same Marks
 underdeep.1208.t: "The Same Marks"
 underdeep.1208.desc: "Some way on they came to a burn upon the wall where a torch had been rested. Beside it was a mark scratched with a knife. It was the mark that the company had been making at each turning to find the way back. They had not come this way before. Farther along they found another and then another, each a little fresher than the one before it."
 underdeep.1208.a: "Stop marking the walls and walk on."
 underdeep.1208.a.flavor: "You take the knife from the one who carries it and say no more about it."
 underdeep.1208.b: "Keep them moving."
 underdeep.1208.b.flavor: "You set a hard pace and give the company no time to count the marks."
 underdeep.1208.b.success: "The marks fall behind and do not come again"
 underdeep.1208.b.failure: "Someone starts to run"

 # 1209: What Turned Over
 underdeep.1209.t: "What Turned Over"
 underdeep.1209.desc: "It began as a trembling in the soles of the feet. Then very slowly the whole passage leaned a little. Dust came down from a roof that had been still for longer than there had been a Sun. Far below them something had turned over in its sleep. The sound of it went on for the better part of an hour. When it ended none of them could say whether it had finished."
 underdeep.1209.a: "Crouch down and wait for it to pass."
 underdeep.1209.a.flavor: "You press your back to the wall and listen to the whole of it."
 underdeep.1209.b: "Stay on your feet and hold the line."
 underdeep.1209.b.flavor: "You brace in the middle of the passage and catch whoever stumbles."
 underdeep.1209.b.success: "You keep your feet to the end"
 underdeep.1209.b.failure: "The floor throws you against the wall"

 # 1210: Another Voice
 underdeep.1210.t: "Another Voice"
 underdeep.1210.desc: "One of the sleepers sat up in the last hour of the watch and began to speak. The voice was clear and rather pleasant and it was not the sleeper's own. It gave a long list of names, some of which the company knew. At dawn the sleeper woke hungry and cheerful, remembering nothing. No one could think how to begin telling it."
 underdeep.1210.a: "Say nothing about it."
 underdeep.1210.a.flavor: "You meet the eyes of those who heard and shake your head."
 underdeep.1210.b: "Calm the company before it spreads."
 underdeep.1210.b.flavor: "You speak to each who heard it, quietly and one at a time."
 underdeep.1210.b.success: "They agree that it was only a dream"
 underdeep.1210.b.failure: "They begin to look at you the same way"

 # 1211: The Open Roof
 underdeep.1211.t: "The Open Roof"
 underdeep.1211.desc: "The roof of the gallery had been torn away in some old ruin and through the gap the company looked up a shaft of unguessed height. At the top there were stars. They were not the stars of Varda, nor any that were known. They were moving very slowly together, as the eyes of a crowd will move to follow someone walking past."
 underdeep.1211.a: "Keep your eyes on the ground."
 underdeep.1211.a.flavor: "You pull up your hood and walk on beneath the gap."
 underdeep.1211.b: "Set them to checking the packs."
 underdeep.1211.b.flavor: "You give every hand a task and every eye something near to look at."
 underdeep.1211.b.success: "They finish the count with their heads down"
 underdeep.1211.b.failure: "One of them looks up and cannot look away"

 # 1212: The Roll of the Company
 underdeep.1212.t: "The Roll of the Company"
 underdeep.1212.desc: "On a table in a small dry room lay a sheet of good vellum, the ink not long dry. It was a roll of the company, set out in a neat hand, with every name spelled as its owner spelled it. Against each name was written a day. None of those days had yet come and the last of them was not very far off."
 underdeep.1212.a: "Leave it where it lies."
 underdeep.1212.a.flavor: "You turn the sheet face down and close the door behind you."
 underdeep.1212.b: "Find out who forged it."
 underdeep.1212.b.flavor: "You bring the sheet to the light and compare the hand with what you know."
 underdeep.1212.b.success: "The hand is a copy and a poor one"
 underdeep.1212.b.failure: "The hand is your own"

 # 1213: The Last Entry
 underdeep.1213.t: "The Last Entry"
 underdeep.1213.desc: "A pack lay against the wall of the passage with its straps still buckled. There was no body near it. Inside were a dry crust, a stub of candle and a small book gone soft with damp. Only the last page could still be read.\n\n#TOLKIENQUOTE "We counted nine at the last halt. I have gone over it and over it. There were eight of us."#!\n#QUOTEDCHARACTER: - written in a failing hand#!"
 underdeep.1213.a: "Take what is useful."
 underdeep.1213.a.flavor: "You empty the pack onto the stone and keep what can still be used."
 underdeep.1213.b: "Read back through the book."
 underdeep.1213.b.flavor: "You dry the pages by the torch and peel them apart one at a time."
 underdeep.1213.b.success: "Earlier pages tell where they went and what they met there"
 underdeep.1213.b.failure: "Every page counts them. The number goes up"
 underdeep.1213.c: "Look for whoever carried it."
 underdeep.1213.c.flavor: "You follow the scuffs on the floor away from the pack."
 underdeep.1213.c.success: "You find their last camp and what they left behind"
 underdeep.1213.c.failure: "The scuffs lead back to your own camp"
 underdeep.1213.d: "Keep the book."
 underdeep.1213.d.flavor: "You wrap the book in oilcloth and put it with your own records."
 underdeep.1213.e: "Say it was a list of debts."
 underdeep.1213.e.flavor: "You shut the book and tell the company the man owed money to nine people."
 underdeep.1213.f: "Copy out the whole book."
 underdeep.1213.f.flavor: "You sit down with a fresh sheet and copy every page that can still be read."
 underdeep.1213.g: "Promise them it ends better."
 underdeep.1213.g.flavor: "You lay the book back in the pack and tell the company this is not how it ends for them."
 underdeep.1213.h: "Write a line beneath it."
 underdeep.1213.h.flavor: "You add one line beneath the last, giving the count as it stands now."

 ### Special encounters ###

 # 1250: What Answered
 underdeep.1250.t: "What Answered"
 underdeep.1250.desc: "The voice stopped when it was answered and for a moment there was only the drip of melting frost. Then a shadow stood up from the floor of the passage, though no torch had moved to cast it. It had the shape of the one who had been called by name. It came on without any sound."
 underdeep.1250.a: "Fight it."
 underdeep.1250.a.flavor: "Your blade goes out to meet a thing that has no weight."
 underdeep.1250.a.success: "It comes apart like smoke"
 underdeep.1250.a.failure: "Its cold goes into you through the wound"

 # 1251: The Pool of Fire
 underdeep.1251.t: "The Pool of Fire"
 underdeep.1251.desc: "The warm wind led them down a side-way to a chamber where the floor had long ago turned to fire. A pool of molten rock lay there, slow as porridge and bright enough to read by. One narrow walkway of black stone went out across it. At its far end, heaped on a shelf of rock, lay a pile of raw gems and ore that no one had ever come back to claim."
 underdeep.1251.a: "Cross the walkway."
 underdeep.1251.a.flavor: "You tie back your cloak and set out along the black stone, one foot before the other."
 underdeep.1251.a.success: "You come back with your arms full"
 underdeep.1251.a.failure: "The stone tips and the heat takes you"
 underdeep.1251.b: "Leave it where it lies."
 underdeep.1251.b.flavor: "You watch the pile glitter for a while, then lead the company away."

 # 1252: Short Weight
 underdeep.1252.t: "Short Weight"
 underdeep.1252.desc: "#weak Since the count at the halt, something has not felt right about the company.#!\n\nWhen the packs were opened the purse had grown lighter, though every knot was as it had been tied. No one had been seen near it. [ud_doppel.GetFirstName] offered to carry it from then on, very pleasantly."
 underdeep.1252.a: "Say nothing and tie it tighter."

 # 1253: A Noise at the Halt
 underdeep.1253.t: "A Noise at the Halt"
 underdeep.1253.desc: "#weak Since the count at the halt, something has not felt right about the company.#!\n\nIn the dead of the watch something moved among the sleepers, going from one to the next and stopping at each. When a torch was lit no one was standing. [ud_doppel.GetFirstName] lay very straight with open eyes and wished the watch a good night."
 underdeep.1253.a: "Keep the torch lit until morning."

 # 1254: One Too Many
 underdeep.1254.t: "One Too Many"
 underdeep.1254.desc: "Partway down the file a question was asked that only [ud_copy.GetFirstName] could have answered. It was answered perfectly, in a voice with the right words and no breath behind them. The real [ud_copy.GetFirstName] stood staring from farther back in the line. The thing in front of you smiled with that same face and reached for its knife."
 underdeep.1254.a: "Cut it down."
 underdeep.1254.a.flavor: "You step in close before it can finish the smile."
 underdeep.1254.a.success: "It falls and what lies there is not a face at all"
 underdeep.1254.a.failure: "It opens your arm and is gone among the stones"

 # 1255: The One Who Walked Beside You
 underdeep.1255.t: "The One Who Walked Beside You"
 underdeep.1255.desc: "#weak Since the count at the halt, something has not felt right about the company.#!\n\nOn the way out the company passed the place where they had stopped to count. A body lay there in the rime, frozen and long dead. It had the face of [ud_doppel.GetFirstName]. When they looked round for the one who had walked with them all that way, there was only a pack set neatly down on the stone."
 underdeep.1255.a: "Bury what can be buried."

 # 1260: The Two Cups
 underdeep.1260.t: "The Two Cups"
 underdeep.1260.desc: "The passage widened around a small table of black stone and upon it stood two cups, both full. Nothing else in that place had been set out with such care. The wine in them had not frozen. There was no sign of whoever had poured it, but someone had drawn back one chair."
 underdeep.1260.a: "Sit down and drink."
 underdeep.1260.a.flavor: "You lift the nearer cup and drink it to the dregs."
 underdeep.1260.a.lose: "You do not rise from the chair"
 underdeep.1260.a.win: "Under the table lies more gold than you can carry"
 underdeep.1260.b: "Walk away."
 underdeep.1260.b.flavor: "You push the chair back under the table and lead the company on."

 ### Company events ###

 # 5001: Words at the Halt
 underdeep.5001.t: "Words at the Halt"
 underdeep.5001.desc: "At the halt the torches were set together on the stone and there was little room about them. It began over a strip of dried meat, when [delver.GetFirstName] said a thing in a low voice. [delver_two.GetFirstName] answered it in a lower and those nearest drew back their feet. Neither had yet laid a hand to a hilt, but neither had looked away."
 underdeep.5001.a: "Both of you stop and take the watch."
 underdeep.5001.a.flavor: "Both quarrellers draw a long stint on guard while the others take their rest."
 underdeep.5001.b: "Make them share the meal."
 underdeep.5001.b.flavor: "You split the strip in two and sit between them until both have eaten."
 underdeep.5001.b.success: "The grudge eases over shared food"
 underdeep.5001.b.failure: "Both push the food away and stand up"
 underdeep.5001.c: "Order them to opposite ends of the line."
 underdeep.5001.c.flavor: "You send [delver.GetFirstName] to the van and [delver_two.GetFirstName] to the rear without discussion."
 underdeep.5001.c.success: "The line holds them apart"
 underdeep.5001.c.failure: "Neither will move at your word. A blade comes out"
 underdeep.5001.d: "Hear both of them, then judge."
 underdeep.5001.d.flavor: "Each account is weighed in turn before you give a fair ruling."
 underdeep.5001.e: "Let them settle it."
 underdeep.5001.e.flavor: "You step back and clear a space for the two to come to blows."

 # 5002: The Shared Cloak
 underdeep.5002.t: "The Shared Cloak"
 underdeep.5002.desc: "[delver_two.GetFirstName] had begun to shake with a cold that no fire would have eased, but said nothing of it. In the dark hours [delver.GetFirstName] came to sit close, putting [delver.GetHerHis] own cloak about them both. For a long while neither spoke. When the company rose to go on, the two of them went together. The others made no remark upon it."
 underdeep.5002.a: "Say nothing and let them be."
 underdeep.5002.a.flavor: "Your eyes turn away, allowing the quiet kindness to grow unremarked."
 underdeep.5002.b: "Thank [delver.GetFirstName] in front of the company."
 underdeep.5002.b.flavor: "You speak of the cloak before all at the next halt, giving honour where due."
 underdeep.5002.b.success: "Both warm to your praise"
 underdeep.5002.b.failure: "Your words embarrass them both"
 underdeep.5002.c: "Tell them to pull themselves together."
 underdeep.5002.c.flavor: "You snap at the pair to stand up and stop wasting the march."

 # 5003: Two Torches
 underdeep.5003.t: "Two Torches"
 underdeep.5003.desc: "It was noticed that [delver.GetFirstName] and [delver_two.GetFirstName] now walked side by side, neither giving place when the way narrowed. They spoke little and what they spoke was low. In that place it seemed a strange thing to see, though a small one. It was like a single candle burning in a great hall. None among them had the heart to put it out."
 underdeep.5003.a: "Leave them be."
 underdeep.5003.a.flavor: "Pretending not to notice the pair, you keep your gaze on the road."
 underdeep.5003.b: "Find out what they are whispering."
 underdeep.5003.b.flavor: "You drop back within earshot and catch what passes between the two in low voices."
 underdeep.5003.b.success: "You overhear a dangerous confidence"
 underdeep.5003.b.failure: "They fall silent at your approach"
 underdeep.5003.c: "Remind them where they are."
 underdeep.5003.c.flavor: "A stern warning reaches the pair that this is no place for tender things."

 # 5004: The Boot
 underdeep.5004.t: "The Boot"
 underdeep.5004.desc: "When the packs were opened at the halt the count of the plunder fell short and [delver_two.GetFirstName] said that [delver_two.GetSheHe] knew why. [delver.GetFirstName] laughed at that. The laughter stopped when a small thing of gold was found in the lining of [delver.GetHerHis] boot. No one could say how long it had been there, or whether some other hand had put it there."
 underdeep.5004.a: "Take it back and say no more."
 underdeep.5004.a.flavor: "You return the gold to the plunder and close the matter with a cold look."
 underdeep.5004.b: "Find out who really put it there."
 underdeep.5004.b.flavor: "Questions go to all who stood near the packs and might have handled that boot."
 underdeep.5004.b.success: "The true culprit is uncovered"
 underdeep.5004.b.failure: "Every answer leads you in circles"
 underdeep.5004.c: "Punish the thief."
 underdeep.5004.c.flavor: "You pronounce [delver.GetFirstName] guilty before the company and lay down a fitting penalty."
 underdeep.5004.d: "Keep it and keep quiet."
 underdeep.5004.d.flavor: "The trinket slips into your own purse and you let the accusation fade."

 # 5005: The One Who Would Not Sleep
 underdeep.5005.t: "The One Who Would Not Sleep"
 underdeep.5005.desc: "For three halts now [delver.GetFirstName] had not slept for so much as an hour. [delver.GetSheHe|U] sat with [delver.GetHerHis] back to the wall and [delver.GetHerHis] eyes upon the others. When [delver_two.GetFirstName] brought food [delver.GetFirstName] looked at it a long while before setting it down again, untouched. In the long hours of rest [delver.GetFirstName] was heard to speak, softly and with great courtesy, to someone who did not answer."
 underdeep.5005.a: "Keep a torch burning beside them."
 underdeep.5005.a.flavor: "A torch is spent through the rest hours so that the sleepless one has light."
 underdeep.5005.b: "Give them something to help them sleep."
 underdeep.5005.b.flavor: "You brew a draught from your stores and press the cup into those shaking hands."
 underdeep.5005.b.success: "Sleep comes at last"
 underdeep.5005.b.failure: "The draught brings only worse dreams"
 underdeep.5005.c: "Sit with them and talk."
 underdeep.5005.c.flavor: "Settling at [delver.GetFirstName]'s side, you speak of home until the whispering stops."
 underdeep.5005.c.success: "The whispering stops at your voice"
 underdeep.5005.c.failure: "You get only a courteous silence"
 underdeep.5005.d: "Leave them behind."
 underdeep.5005.d.flavor: "You take up your pack and march the company on while the sleepless one sits."

 # 5006: An Unwelcome Debt
 underdeep.5006.t: "An Unwelcome Debt"
 underdeep.5006.desc: "In a narrow place the stone gave way and [delver.GetFirstName] would have gone down with it, had not [delver_two.GetFirstName] caught [delver.GetHerHim] by the belt and held on. Neither said anything for a while. Later [delver.GetFirstName] was seen sitting alone, looking long across the torchlight, for it is a hard thing to owe your life to one you do not like."
 underdeep.5006.a: "Say nothing and let them work it out."
 underdeep.5006.a.flavor: "You keep out of it and trust the weight of the debt to do its work."
 underdeep.5006.b: "Make them clasp hands."
 underdeep.5006.b.flavor: "Standing the two face to face, you refuse to move on until they grip palms."
 underdeep.5006.b.success: "The old rivalry ends in a handclasp"
 underdeep.5006.b.failure: "Both hands stay stiffly at their sides"
 underdeep.5006.c: "Reward [delver_two.GetFirstName] for it."
 underdeep.5006.c.flavor: "A purse of coin goes into the rescuer's hands in thanks for that firm grip."
 underdeep.5006.d: "Praise [delver_two.GetFirstName] before the whole company."
 underdeep.5006.d.flavor: "You recount the rescue aloud at the halt, leaving nothing out and adding nothing."

 # 5007: The Cold Fire
 underdeep.5007.t: "The Cold Fire"
 underdeep.5007.desc: "[delver.GetFirstName] had the last watch, so when the company woke the fire was cold and [delver.GetFirstName] was gone, [delver.GetHerHis] pack gone with [delver.GetHerHim]. [delver_two.GetFirstName] found the tracks going back toward the stair, close together and hurried. They had not gone very far before a second line of tracks came up beside them. After that the first tracks went on with no hurry in them at all."
 underdeep.5007.a: "Go after them."
 underdeep.5007.a.flavor: "Fresh brands are lit and you follow the double tracks back toward the stair."
 underdeep.5007.b: "Send [delver_two.GetFirstName] to bring them back."
 underdeep.5007.b.flavor: "You point [delver_two.GetFirstName] toward the tracks and order a swift return with the runaway."
 underdeep.5007.b.success: "[delver_two.GetFirstName] returns leading the deserter"
 underdeep.5007.b.failure: "[delver_two.GetFirstName] returns alone and shaken"
 underdeep.5007.c: "Leave them and go on."
 underdeep.5007.c.flavor: "You kick ash over the dead fire and turn the company toward the depths."
 underdeep.5007.d: "I knew this would happen, so go on."
 underdeep.5007.d.flavor: "Without surprise you shoulder your pack, having expected such a betrayal from the start."

 # 5008: The Long Lesson
 underdeep.5008.t: "The Long Lesson"
 underdeep.5008.desc: "[delver.GetFirstName], who had been down in dark places before, took to walking beside [delver_two.GetFirstName], showing [delver_two.GetHerHim] how to bind a torch so that it would burn long and how to listen at a passage before going into it. [delver_two.GetFirstName] said little and forgot nothing. It was a small comfort to see a thing being learned in that place, as though there would be a use for it afterward."
 underdeep.5008.b: "Join the lesson."
 underdeep.5008.b.flavor: "You fall in beside the pair and share what you know of torch and tunnel."
 underdeep.5008.b.success: "All three trade hard-won craft"
 underdeep.5008.b.failure: "Your advice only muddles the lesson"
 underdeep.5008.c: "Slow the march and let them finish."
 underdeep.5008.c.flavor: "The file eases its pace at your word so the old hand can show every trick."

 # 5009: One Blood
 underdeep.5009.t: "One Blood"
 underdeep.5009.desc: "[delver.GetFirstName] and [delver_two.GetFirstName] were of one blood, come down together on a promise made to those at home. But [delver.GetFirstName] was growing slow, each halt coming sooner than the last, while the others had begun to glance at the torches. [delver_two.GetFirstName] carried both packs now and would not hear it spoken of. At the last halt [delver.GetFirstName] said quietly, 'Go on without me,' after which neither would look at the other."
 underdeep.5009.a: "Slow the march for them."
 underdeep.5009.a.flavor: "You call more halts, burning extra torches so the two kin can stay together."
 underdeep.5009.b: "Talk to both of them together."
 underdeep.5009.b.flavor: "Drawing the pair apart, you speak plainly of the promise and the road."
 underdeep.5009.b.success: "Their shoulders ease a little"
 underdeep.5009.b.failure: "Neither will meet your eyes"
 underdeep.5009.c: "Share out the packs among everyone."
 underdeep.5009.c.flavor: "You divide the two heavy loads fairly across every back in the company."
 underdeep.5009.c.success: "The lighter load keeps [delver.GetFirstName] moving"
 underdeep.5009.c.failure: "Complaints leave the packs where they lie"
 underdeep.5009.d: "Kin are not left behind."
 underdeep.5009.d.flavor: "Before all, you declare that this company will not abandon one of its blood."
 underdeep.5009.e: "Let me see to that leg."
 underdeep.5009.e.flavor: "You unwrap the swollen limb, set it right and bind it firmly for the road."

 # 5010: Sums at the Rear
 underdeep.5010.t: "Sums at the Rear"
 underdeep.5010.desc: "[delver_two.GetFirstName] came to the head of the line at the third halt, speaking with [delver_two.GetHerHis] eyes on the ground. Some at the rear had been counting the torches and the days, with [delver.GetFirstName] doing the sums for them. Nothing had been said that could be called treason. But the rear of the file now walked very close together. When the leader looked back, the talk went out of them like a pinched wick."
 underdeep.5010.a: "Say nothing and double the watch."
 underdeep.5010.a.flavor: "Keeping your counsel, you set extra sentries along the rear through the rest hours."
 underdeep.5010.b: "Answer their fears in front of everyone."
 underdeep.5010.b.flavor: "You call the file together and lay out plainly how the torches will last."
 underdeep.5010.b.success: "The muttering dies at your reckoning"
 underdeep.5010.b.failure: "Your figures only feed their doubts"
 underdeep.5010.c: "Challenge [delver.GetFirstName] openly."
 underdeep.5010.c.flavor: "At the rear you call [delver.GetFirstName] out before every listening ear."
 underdeep.5010.c.success: "[delver.GetFirstName] backs down before you"
 underdeep.5010.c.failure: "Steel answers you and draws blood"
 underdeep.5010.d: "Turn the rear against [delver.GetFirstName]."
 underdeep.5010.d.flavor: "Whispers spread among the rear at your bidding that the sums serve only one purse."
 underdeep.5010.d.success: "The followers desert [delver.GetFirstName]"
 underdeep.5010.d.failure: "Your whispers find no willing ears"
 underdeep.5010.e: "Change the order of march without giving reasons."
 underdeep.5010.e.flavor: "You shuffle the file at a stroke and break the rear apart without explanation."

 # 5011: A Debt to the Dead
 underdeep.5011.t: "A Debt to the Dead"
 underdeep.5011.desc: "Before ever the company came under the stone, [delver.GetFirstName] had sworn to take no share of the plunder until a certain debt was paid to the dead. That oath had been kept, though the packs grew heavy and [delver.GetHerHis] own stayed light. [delver_two.GetFirstName] called it a fool's oath and said so at every halt. At the last turning a ring of old gold lay in the way. [delver.GetFirstName] looked at it for a long time, then stepped over it."
 underdeep.5011.a: "Honour the vow and say nothing."
 underdeep.5011.a.flavor: "You pass the ring by as well and give the oath your silent respect."
 underdeep.5011.b: "Ask [delver.GetFirstName] about the debt."
 underdeep.5011.b.flavor: "Falling into step beside the oath-keeper, you ask gently who the dead were."
 underdeep.5011.b.success: "The tale softens even [delver_two.GetFirstName]"
 underdeep.5011.b.failure: "[delver.GetFirstName] will not speak of it"
 underdeep.5011.c: "Find a lawful end to the vow."
 underdeep.5011.c.flavor: "You search old law and custom for some clause that would honourably discharge the oath."
 underdeep.5011.c.success: "An old rite releases the oath"
 underdeep.5011.c.failure: "No custom will loose this oath"
 underdeep.5011.d: "Pick up the ring."
 underdeep.5011.d.flavor: "Stooping, you pocket the ring and remark that the dead have no use for gold."
 underdeep.5011.e: "I will give up my share too."
 underdeep.5011.e.flavor: "Your own portion goes aside as you join the vow to the silent dead."

 # 5012: The Telling
 underdeep.5012.t: "The Telling"
 underdeep.5012.desc: "It was [delver_two.GetFirstName] who had found the hidden way past the last fall of stone. But it was [delver.GetFirstName] who told of it at the halt and told it well. In the telling the deed grew larger as the finder grew smaller, until by the end the finder was not in it at all. [delver_two.GetFirstName] sat mending a strap without looking up, the needle going in and out a little harder than it needed to."
 underdeep.5012.a: "Let the tale stand."
 underdeep.5012.a.flavor: "You nod along with the boastful account and leave the true finder unnamed."
 underdeep.5012.b: "Set the story straight, gently."
 underdeep.5012.b.flavor: "A quiet word at the close credits the one who truly found the way."
 underdeep.5012.b.success: "The true finder gains their due"
 underdeep.5012.b.failure: "The company hears only sour correction"
 underdeep.5012.c: "Divide the reward by the work done."
 underdeep.5012.c.flavor: "You tally each person's part and give the finder the portion truly earned."
 underdeep.5012.c.success: "The shares satisfy them both"
 underdeep.5012.c.failure: "Your tally pleases neither of them"
 underdeep.5012.d: "Make a better song of it."
 underdeep.5012.d.flavor: "You rhyme the deed anew, with both names ringing proudly in the closing verse."
 underdeep.5012.e: "Say the plan was mine."
 underdeep.5012.e.flavor: "Cutting in, you claim the hidden way was found at your direction."

 # 5013: The Burned Farm
 underdeep.5013.t: "The Burned Farm"
 underdeep.5013.desc: "Neither had spoken of it above ground, but it was known that a farm had burned once on the border between their lands, with a life lost in it. Down here it had seemed a small matter. Then [delver.GetFirstName] was seen at the halt, turning a little knife over and over, looking at nothing. [delver_two.GetFirstName] moved [delver_two.GetHerHis] bedding to the other side of the fire."
 underdeep.5013.a: "Set them at opposite ends."
 underdeep.5013.a.flavor: "Each is assigned a place at the far ends of the line for the march."
 underdeep.5013.b: "Make them talk it out."
 underdeep.5013.b.flavor: "You sit them on one stone and will not rise until the whole tale is told."
 underdeep.5013.b.success: "The old grudge finally burns out"
 underdeep.5013.b.failure: "The talk ends in colder silence"
 underdeep.5013.c: "Take the knife by force."
 underdeep.5013.c.flavor: "You seize the wrist that turns the blade and wrest the weapon away."
 underdeep.5013.c.success: "The little knife is yours now"
 underdeep.5013.c.failure: "[delver.GetFirstName] keeps a grip on it"
 underdeep.5013.d: "Find out who lit that fire."
 underdeep.5013.d.flavor: "A few sly questions about that night reveal who stood to gain."
 underdeep.5013.d.success: "You learn who held the torch"
 underdeep.5013.d.failure: "The past keeps its ashes buried"
 underdeep.5013.e: "Ask them to let it go."
 underdeep.5013.e.flavor: "You speak softly of what the dead would want and urge both toward mercy."
 underdeep.5013.f: "Let [delver.GetFirstName] have the reckoning."
 underdeep.5013.f.flavor: "You look aside as the blade is taken up and the old score comes due."

 # 5014: Fetching Water
 underdeep.5014.t: "Fetching Water"
 underdeep.5014.desc: "Something had been following the company for two halts. It did not tire and [delver_two.GetFirstName] could no longer walk. At the turning of the passage [delver.GetFirstName] took one torch from the bundle, saying that [delver.GetSheHe] would go back a little way and make a noise. It was said as one speaks of fetching water. [delver_two.GetFirstName] took [delver.GetHerHim] by the sleeve, but [delver.GetFirstName] gently undid the fingers, one by one."
 underdeep.5014.a: "Let [delver.GetFirstName] go."
 underdeep.5014.a.flavor: "You speak no word of refusal and lead the others on as the torch recedes."
 underdeep.5014.b: "Stay together and carry [delver_two.GetFirstName]."
 underdeep.5014.b.flavor: "A litter of spears and cloaks is rigged and torches burn through the slow march."
 underdeep.5014.c: "Go back and fight it together."
 underdeep.5014.c.flavor: "Weapons ready, you march back up the passage to meet the pursuer together."
 underdeep.5014.c.success: "Together you bring the thing down"
 underdeep.5014.c.failure: "Its claws rake you in the dark"
 underdeep.5014.d: "Set an ambush at the turning."
 underdeep.5014.d.flavor: "You douse the lights, post blades on either side and wait for the follower."
 underdeep.5014.d.success: "The snare closes on the thing"
 underdeep.5014.d.failure: "The thing smells out the trap"
 underdeep.5014.e: "I will go instead."
 underdeep.5014.e.flavor: "You take the torch from that steady hand and walk back into the dark alone."
 underdeep.5014.f: "Let me at the thing."
 underdeep.5014.f.flavor: "With a howl at the dark, you rush headlong at the pursuer."

 # 5015: The Left Hand
 underdeep.5015.t: "The Left Hand"
 underdeep.5015.desc: "[delver_two.GetFirstName] came to the leader at the halt, but would say only that [delver.GetFirstName] was not as [delver.GetSheHe] had been. There was nothing to point to, for [delver.GetFirstName] ate and marched, answering when spoken to, pleasant to all. But [delver.GetSheHe] no longer hummed while tying off a pack and [delver.GetSheHe] had begun to use [delver.GetHerHis] left hand. In the twenty years that [delver_two.GetFirstName] had known [delver.GetHerHim], it had always been the right."
 underdeep.5015.a: "Watch [delver.GetFirstName] and say nothing."
 underdeep.5015.a.flavor: "Every small gesture is marked by your careful eye and you confide in no one."
 underdeep.5015.b: "Talk with [delver.GetFirstName] alone."
 underdeep.5015.b.flavor: "You draw the other aside at the halt and speak gently about old times."
 underdeep.5015.b.success: "The old humming comes back"
 underdeep.5015.b.failure: "You receive only pleasant empty answers"
 underdeep.5015.c: "Ask what only [delver.GetFirstName] would know."
 underdeep.5015.c.flavor: "A question from shared years goes out and you weigh the answer closely."
 underdeep.5015.c.success: "The answer tells you the truth"
 underdeep.5015.c.failure: "The answer tells you nothing certain"
 underdeep.5015.d: "Bind [delver.GetFirstName] until we are out."
 underdeep.5015.d.flavor: "You take hold with sudden force and lash the wrists tight for the whole march."
 underdeep.5015.d.success: "The knots hold fast"
 underdeep.5015.d.failure: "You are thrown off and cursed"
 underdeep.5015.e: "Let me look into those eyes."
 underdeep.5015.e.flavor: "Taking that face between your hands, you gaze long for what lies behind."
 underdeep.5015.f: "I can tell what is wrong there."
 underdeep.5015.f.flavor: "You recognise a kindred strangeness and name aloud the thing the others cannot see."

 # 5016: Far Enough
 underdeep.5016.t: "Far Enough"
 underdeep.5016.desc: "There was no quarrel and no fever. At the start of the march [delver.GetFirstName] simply sat down on a block of fallen stone, set [delver.GetHerHis] pack beside it, then said that [delver.GetSheHe] had gone far enough. [delver_two.GetFirstName] laughed, then stopped, then knelt to talk in a low voice and went on talking for some time. [delver.GetFirstName] listened with great patience but did not move, while all around them the torches were burning down."
 underdeep.5016.a: "Carry [delver.GetFirstName] if need be."
 underdeep.5016.a.flavor: "You sling the weary one over a shoulder and burn more torches on the slow going."
 underdeep.5016.b: "Give [delver.GetFirstName] a reason to rise."
 underdeep.5016.b.flavor: "Kneeling beside the block, you speak of those still waiting for a homecoming."
 underdeep.5016.b.success: "[delver.GetFirstName] stands and shoulders the pack"
 underdeep.5016.b.failure: "The words wash past unheeded"
 underdeep.5016.c: "Haul [delver.GetFirstName] up by force."
 underdeep.5016.c.flavor: "You seize belt and collar, wrench your companion upright and shove them along the road."
 underdeep.5016.c.success: "[delver.GetFirstName] stumbles onward at last"
 underdeep.5016.c.failure: "Your grip is shrugged off entirely"
 underdeep.5016.d: "Leave [delver.GetFirstName] a spare torch."
 underdeep.5016.d.flavor: "One burning brand is set upon the stone before you walk on without looking back."
 underdeep.5016.e: "I know, so sit a moment with me."
 underdeep.5016.e.flavor: "You lower yourself onto the stone alongside and share the weight of that silence."

 ### Bosses ###

 # 6001: The Pit-Warlord
 underdeep.6001.t: "The Pit-Warlord"
 underdeep.6001.desc: "The way ended at a long guardroom. At its far end, in a chair of iron, sat an [Concept('orcs','Orc')|E] older than any the company had heard of, with rime upon his shoulders. His band had long since gone to bones about the room and he had gone on giving them orders. When the torches came near he rose slowly and looked the company over from end to end. 'The relief is late,' he said."
 underdeep.6001.a: "Fall back and leave him to his post."
 underdeep.6001.a.flavor: "You edge back from the iron chair and lead the company the long way back to daylight."
 underdeep.6001.c: "Form a line and press."
 underdeep.6001.c.flavor: "Ranks dress and advance shield by shield until the warlord has no room."
 underdeep.6001.c.success: "The ranks pin him against the wall"
 underdeep.6001.c.failure: "The warlord breaks your front rank"
 underdeep.6001.d: "Report for duty."
 underdeep.6001.d.flavor: "You stand to attention, play the late relief and haggle for the warlord's keys."
 underdeep.6001.d.success: "The warlord hands over keys and spoils"
 underdeep.6001.d.failure: "The warlord sees through your report"
 underdeep.6001.e: "Send someone behind him."
 underdeep.6001.e.flavor: "Your quietest companion slips along the wall to reach the iron chair unseen."
 underdeep.6001.e.success: "Your companion draws blood from behind"
 underdeep.6001.e.failure: "The warlord hears the creeping steps"
 underdeep.6001.f: "Say the relief has come."
 underdeep.6001.f.flavor: "You snap to attention and announce the end of a very long watch."
 underdeep.6001.g: "Challenge him to a duel."
 underdeep.6001.g.flavor: "With a salute of your sword you call the warlord out for a single bout."
 underdeep.6001.g.success: "You test his guard and it teaches you more of the blade than any master"
 underdeep.6001.g.failure: "His blade finds the gap in your guard"
 underdeep.6001.h: "Demand his hoard."
 underdeep.6001.h.flavor: "You name a figure and point at the chests along the wall."
 underdeep.6001.h.success: "He pushes the chests across with his foot"
 underdeep.6001.h.failure: "He reaches for his blade instead"
 underdeep.6001.i: "Ask of the first muster."
 underdeep.6001.i.flavor: "You sit down on a bench and ask the old captain about the days of his first orders."
 underdeep.6001.i.success: "He talks and you find the weakness in his guard"
 underdeep.6001.i.failure: "He tires of your questions"
 underdeep.6001.j: "Give him new orders."
 underdeep.6001.j.flavor: "You use the voice of one who has been obeyed for a very long time."
 underdeep.6001.fight: "He came down the length of the guardroom without haste, the rust falling from his mail at each step. The company drew back to give the two of you room. Whatever could be arranged had been arranged."
 underdeep.6001.lose: "He fought as though the long years had been a single hour of drill. The company was thrown back along the guardroom with blood on the frost. They heard him return to his chair and sit. He did not trouble to pursue them, for his orders reached no further than that door."
 underdeep.6001.win: "The old captain went down on one knee, then on both. The rust of his mail came away in a red cloud. With his last breath he asked who held the post now. No one in the company answered him as they took up his keys and went on through the far door."

 # 6002: The Ice-Troll
 underdeep.6002.t: "The Ice-Troll"
 underdeep.6002.desc: "For a long while the cold had been growing and now it came to them like a hand laid flat upon the chest. The passage opened into a cavern ribbed with pale ice, where one of the ribs moved. A [Concept('trolls','Troll')|E] rose out of the wall with the frost cracking off its hide in plates. It was grey and very large and in no haste. Having looked at the torches for a moment, it gave a long, slow yawn."
 underdeep.6002.a: "Run for the side passage."
 underdeep.6002.a.flavor: "You dash for the nearest gap while the great beast is still waking."
 underdeep.6002.b: "Go for its legs alone."
 underdeep.6002.b.flavor: "Ducking beneath its arms, you hack at the frost-split knees."
 underdeep.6002.b.success: "Its knees buckle under your blows"
 underdeep.6002.b.failure: "A great fist swats you aside"
 underdeep.6002.c: "Drive it back with spears."
 underdeep.6002.c.flavor: "Points level in a tight wedge, the company forces the troll from the passage."
 underdeep.6002.c.success: "The spears pen it against the ice"
 underdeep.6002.c.failure: "It snaps the spears and wades in"
 underdeep.6002.d: "Find a thin plate."
 underdeep.6002.d.flavor: "You study the cracks in its plated hide for any place a blade might enter."
 underdeep.6002.d.success: "You find the seam and pierce it"
 underdeep.6002.d.failure: "You misjudge the hide and it strikes"
 underdeep.6002.e: "Set a fire trap."
 underdeep.6002.e.flavor: "Torch-oil is poured out in a trench and you lure the troll across it."
 underdeep.6002.e.success: "The burning oil sears its hide"
 underdeep.6002.e.failure: "The oil gutters and it wades through"
 underdeep.6002.f: "Stare it down."
 underdeep.6002.f.flavor: "You meet its dull gaze and do not blink until it lumbers away."
 underdeep.6002.h: "Call it out."
 underdeep.6002.h.flavor: "You stand alone in the open and shout until the great head turns."
 underdeep.6002.h.success: "The company sees you stand against it"
 underdeep.6002.h.failure: "The beast ignores your calls"
 underdeep.6002.i: "Hold it off the fallen."
 underdeep.6002.i.flavor: "You plant yourself in front of the ones who cannot run."
 underdeep.6002.j: "Call down the old light."
 underdeep.6002.j.flavor: "You lift a torch and speak the oldest words you know against the thing."
 underdeep.6002.fight: "The great grey thing came on across the ice and the company spread out to either side of it. It looked down at you for a moment and then lifted one hand."
 underdeep.6002.lose: "Without any show of anger it swept the company from its path as a broom sweeps a step. Those who could still run ran, dragging those who could not. Behind them it went back into the wall, where the ice closed over it and left no sign that it had ever moved."
 underdeep.6002.win: "The great grey thing fell across the mouth of the cavern. The cold went out of the air by a small degree. Its hide split in the fall, laying bare the rings and blades of those who had met it before, frozen fast yet easily chipped away."

 # 6401: Blade to Blade
 underdeep.6401.t: "Blade to Blade"
 underdeep.6401.desc_win: "The bout was short and ugly, as such bouts are in the dark. When it was done [ud_boss.GetFirstName] lay on the stones at your feet. The company had kept back along the walls without a sound. Now they let out their breath all together."
 underdeep.6401.desc_lose: "You found yourself on the stones with blood in your mouth and no memory of the blow. [ud_boss.GetFirstName] did not stay to finish it. [ud_boss.GetSheHe|U] had already turned to the rest of the company. They came on together to meet [ud_boss.GetHerHim], since there was nothing else to do."
 underdeep.6401.a: "It is done."
 underdeep.6401.b: "Get back on your feet."

 ### Endings ###

 # 7001: Daylight
 underdeep.7001.t: "Daylight"
 underdeep.7001.desc: "Those who kept the camp above had begun to speak of the company as folk speak of the dead. They no longer set out a bowl at evening. Then, on a grey and bitter morning, a line of figures came stumbling out of the ground. They were thin and blinking and the packs on their backs were heavy. No one cheered at first. But someone went to fetch more bowls and presently the whole camp was awake and shouting."
 underdeep.7001.a: "Go home and count the plunder."
 underdeep.7001.a.flavor: "You lead the worn company away from the camp to share out the treasure."

 # 7002: The Last Torch
 underdeep.7002.t: "The Last Torch"
 underdeep.7002.desc: "On the last night the watchers saw no sign. On the next a single hand came groping out of the dark of the way down. The others came after it, each holding to the cloak of the one before. Their eyes were wide and saw nothing. Not a torch was left among them. Those above wrapped them in blankets and lit every lamp in the camp, yet still some called for light."
 underdeep.7002.a: "Get them home."
 underdeep.7002.a.flavor: "You guide the blinded company along the road, abandoning what the weary cannot carry."

 # 7003: The Quiet Return
 underdeep.7003.t: "The Quiet Return"
 underdeep.7003.desc: "The company came up in the full light of noon, walking in good order. The watchers ran to meet them, then slowed, for not one had any wound to show. They answered when spoken to, but they answered other questions than the ones that had been asked. They would not sit with their backs to the north. That evening one of them began laying stones in a line from the tent door. The rest rose without a word to help, as though each knew where the stones must go."
 underdeep.7003.a: "Take them home."
 underdeep.7003.a.flavor: "You shepherd the silent company home, leaving behind most of what they carried up."

 # 7004: The Open Sky
 underdeep.7004.t: "The Open Sky"
 underdeep.7004.desc: "No one waited for them at the mouth of the ruin, for no one lives within many days of that place. They came out into the white light, a thin and scarred band who did not look like the heroes of any song. One among them carried a trophy of the deep, wrapped in sacking. For a long while they only stood and looked at the sky, as if they had not expected to see it again."
 underdeep.7004.a: "Go home with the trophy."
 underdeep.7004.a.flavor: "You carry the sacking-wrapped prize down the road with the children running alongside."

 # 7005: The Empty Chair
 underdeep.7005.t: "The Empty Chair"
 underdeep.7005.desc: "For many days the watchers kept the fire burning at the place where the company had gone down, yet nothing came up but the cold. A few crawled out at last, unwilling to say what they had seen. The one who led them was not among them. When word reached the hall, the chair was left empty for a time. No one cared to move the cup that stood beside it until the spring came and the servants took it quietly away."
 underdeep.7005.a: "Mourn and carry on."

 ### Stories for Gandalf and Saruman ###

 # 8001: A Walker in Grey
 underdeep.8001.t: "A Walker in Grey"
 underdeep.8001.desc: "Gandalf had come to many doors in his long wanderings. From most of them he had been asked to leave. No one had asked him to come here, nor had anyone told him not to. He stood a while at the threshold and lit his pipe, which the company took for unconcern, then went in with the torchbearers behind him. They remarked afterward that he walked a little faster than was his habit, never once looking back. That was the party's final chance to turn back."
 underdeep.8001.a: "Lead on."
 underdeep.8001.a.flavor: "Knocking out your pipe, you step beneath the lintel without a backward look."
 underdeep.8001.b: "Tell them why we came."
 underdeep.8001.b.flavor: "Gathering the torchbearers at the door, you speak plainly of the purpose here."
 underdeep.8001.b.success: "Your words put heart in them"
 underdeep.8001.b.failure: "Your words fall flat in the cold"
 underdeep.8001.c: "Look for signs of older visitors."
 underdeep.8001.c.flavor: "Torch lowered, you search the door stones for scratches and worn places."
 underdeep.8001.c.success: "You read the traces of earlier comers"
 underdeep.8001.c.failure: "The stones keep their secrets"
 underdeep.8001.d: "Turn back."
 underdeep.8001.d.flavor: "You knock out your pipe and decide this door can wait for another age."

 # 8002: The Small Thing in the Dark
 underdeep.8002.t: "The Small Thing in the Dark"
 underdeep.8002.desc: "In a blind gallery they came upon a thing no larger than a child, crouched over a heap of small bones. What it had once been none could tell. It shrank from the torches, yet would not be driven off. When the company drew steel, Gandalf put out his staff between them, then sat down upon the stone. After a while he held out a piece of bread and waited, for he had learned patience from one who wept for all things."
 underdeep.8002.a: "Give it the bread and go."
 underdeep.8002.a.flavor: "You wait by torchlight until it takes the crust, then slip quietly away."
 underdeep.8002.b: "Try to learn what it was."
 underdeep.8002.b.flavor: "Sitting close, you speak softly and coax out some memory of its former self."
 underdeep.8002.b.success: "It whispers something of its past"
 underdeep.8002.b.failure: "It only cowers and whimpers"
 underdeep.8002.c: "Let the company deal with it."
 underdeep.8002.c.flavor: "You step aside and leave the matter of the creature to drawn blades."

 # 8005: Tobacco and Silence
 underdeep.8005.t: "Tobacco and Silence"
 underdeep.8005.desc: "He came up out of that place by the way he had gone down, speaking of it to few. At a fireside in the West he said, when pressed, that the journey had been cold and the company poor. To one who asked more gravely he said only that even the worst of fears had once been someone's own. Then he asked whether there was any more of the good tobacco. On that subject alone would he be drawn any further."
 underdeep.8005.a: "Let it rest."
 underdeep.8005.a.flavor: "Another pipe is filled while you turn the talk to gentler matters."
 underdeep.8005.b: "Write it down for those who come after."
 underdeep.8005.b.flavor: "Late over ink and parchment, you set the journey down for later readers."
 underdeep.8005.b.success: "The account comes out clear and true"
 underdeep.8005.b.failure: "The words will not come right"

 # 8101: Measured Steps
 underdeep.8101.t: "Measured Steps"
 underdeep.8101.desc: "Saruman came to the door with a rod of measure and two clerks. He had it written down how high the lintel stood, how thick the stone. He had read of this place in books that few had been suffered to open, wishing to see how much of it was true, while the company waited in the cold. When the clerks had finished he nodded, as one nods at a sum that has come out as expected, then went in. That was the party's final chance to turn back."
 underdeep.8101.a: "Go on."
 underdeep.8101.a.flavor: "Leaving the clerks to their papers, you pass through the measured door."
 underdeep.8101.b: "Compare it with the old books."
 underdeep.8101.b.flavor: "The borrowed volumes come out by torchlight, each claim weighed against the stonework."
 underdeep.8101.b.success: "The stone confirms what the books claim"
 underdeep.8101.b.failure: "The old books mislead you here"
 underdeep.8101.c: "Keep a full record of the way."
 underdeep.8101.c.flavor: "Your clerks log every turn, stair and distance as the company descends."
 underdeep.8101.c.success: "The clerks map a shorter route"
 underdeep.8101.c.failure: "The clerks lose count of the turns"
 underdeep.8101.d: "Turn back."
 underdeep.8101.d.flavor: "You close the notebook and order the clerks back to the road."

 # 8102: The Wheel in the Wall
 underdeep.8102.t: "The Wheel in the Wall"
 underdeep.8102.desc: "Behind a fallen wall they found a great wheel of iron, taller than three riders, set there to draw the cold air down into the deep places. Its bearings had not seized, for in all the long ages since the fall of that house it had not quite stopped, but moved a finger's breadth in a day. Saruman laid his palm upon the rim and smiled. Those who saw it liked that smile less than anything they had met below."
 underdeep.8102.a: "Note how it was made."
 underdeep.8102.a.flavor: "While the others keep watch, you sketch the bearings and spokes in a notebook."
 underdeep.8102.b: "Work out what drives it."
 underdeep.8102.b.flavor: "You trace the rods and shafts behind the rim, hunting for the hidden source of motion."
 underdeep.8102.b.success: "You trace the hidden workings"
 underdeep.8102.b.failure: "The workings baffle even your reckoning"
 underdeep.8102.c: "Set it turning again."
 underdeep.8102.c.flavor: "Freeing the old bearings, you lean upon the rim until the iron groans awake."

 # 8105: Wheels and Smoke
 underdeep.8105.t: "Wheels and Smoke"
 underdeep.8105.desc: "He returned to his tower with a number of chests, which none but he was permitted to open. That year the trees about his walls were felled for a mile in every direction. New pits were dug and a great wheel was raised in the midst of the ring of stone. The folk of the valley complained of the smoke. He told them, kindly, that it would be better for everyone when the work was done."
 underdeep.8105.a: "Continue the work."
 underdeep.8105.a.flavor: "More timber is sent for and the pits are dug deeper still."
 underdeep.8105.b: "Hide the work from the others."
 underdeep.8105.b.flavor: "You disguise the pits, bribe the carters and put out a story about new granaries."
 underdeep.8105.b.success: "No word reaches the other rulers"
 underdeep.8105.b.failure: "Rumour of the smoke spreads abroad"

 ### Intent events ###

 # 9001: An Unlit Stretch
 underdeep.9001.t: "An Unlit Stretch"
 underdeep.9001.desc: "The passage narrowed. For a little while the torches fell far behind as [ud_target.GetFirstName] went on alone ahead. The floor was uneven there. The drop to one side had no bottom that anyone had seen. No one would think it strange if someone were lost in such a place."
 underdeep.9001.a: "Make it look like a fall."
 underdeep.9001.a.flavor: "You quicken your step until only the dark is between you."
 underdeep.9001.a.success: "No one saw it happen"
 underdeep.9001.a.failure: "Your target turns at the last moment"
 underdeep.9001.b: "Not here."
 underdeep.9001.b.flavor: "You slow your pace and let the torches catch up."

 # 9002: A Shared Watch
 underdeep.9002.t: "A Shared Watch"
 underdeep.9002.desc: "The watches below were long, with little to be done in them but sit close to the one small flame and talk. [ud_target.GetFirstName] had been given the same watch and had not moved away. It was a strange place for such thoughts, but it was very cold, with no one else awake."
 underdeep.9002.a: "Move a little closer."
 underdeep.9002.a.flavor: "You share your cloak and say what you have not said before."
 underdeep.9002.a.success: "Your hand is not pushed away"
 underdeep.9002.a.failure: "You are gently, firmly refused"
 underdeep.9002.b: "Keep your eyes on the dark."
 underdeep.9002.b.flavor: "You turn back to the passage and let the moment go."

 # 9003: Side by Side
 underdeep.9003.t: "Side by Side"
 underdeep.9003.desc: "For most of that day's march [ud_target.GetFirstName] had walked beside you. Neither of you had found much to say. At the halt you found yourselves sharing the same bit of dry stone and the last of a good loaf, such things having been the start of longer friendships than most."
 underdeep.9003.a: "Share the loaf and talk."
 underdeep.9003.a.flavor: "You break the bread in two and ask about the road behind them."
 underdeep.9003.a.success: "The talk goes on long past the meal"
 underdeep.9003.a.failure: "The talk runs dry and stays that way"
 underdeep.9003.b: "Eat in silence."
 underdeep.9003.b.flavor: "You keep to your own thoughts until the march begins again."

