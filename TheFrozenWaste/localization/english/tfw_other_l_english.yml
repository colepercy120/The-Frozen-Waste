 ### Bookmarks
 
 bm_2754_frozen_waste: "The Ruined Wastes"
 bm_2754_frozen_waste_desc: "Forodwaith is a harsh sparsely populated land still scared from the War of Wrath, Dragons dominate the skys, spirits of air and darkness trap the land in an eternal winter, and points of civilization are few and far between. but hope is not yet lost. \n\nIn the utter north the lossidil have established a great city around a shard of the great lamps, volcanic hotsprings keep the worst of the winter out of the vale of Evermist, and Dwarves are delving a new great realm in the Ered Muil. \n\nBut in the ruins of Angband, Nixni, the Lady of Cold plots foul deeds in service to the great darkness, casting the land into eternal winter."
 
 bookmark_frozen_waste_nixni: "Nixní"
 bookmark_frozen_waste_nixni_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_nixni_desc: "The Lady of Cold is the most powerful force left in the Frozen Waste. one of Morgoth's luitentents in the elder days she has planted herself in the ruins of Angband, guarding the wreckage until her master returns. yet rumors emerge that she is preparing something devious in the shattered halls, with none but the Dark Lord himself Privy to her plans"

 bookmark_frozen_waste_talanthir: "Talanthir"
 bookmark_frozen_waste_talanthir_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_talanthir_desc: "Talanthir, the High King of the Adlantrim is one of the oldest beings still left in Middle Earth, the last of the Origonal Orcs, he is the only one of their kind left who remembers the days before Melkor stole them away from Cuivenien. he has fought to preserve his childrens souls and worked for eons to heal what has been broken. After all the Orcs are still children of Illuivatar, even if the Elves and the Valar forget that."

 bookmark_frozen_waste_graw: "Graw"
 bookmark_frozen_waste_graw_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_graw_desc: "Graw is a unique soul, A foundling who grew up on the ships that ply the islands of the Forodain, he has always suspected hes destined for greatness, yet it was not until the Great Cold Drake, Faron, slew his adoptive parents and sank their ship did he know what his purpose was. he would bring down the dragon even if it costs him his life."

 bookmark_frozen_waste_evermist_queen: "Vorwen"
 bookmark_frozen_waste_evermist_queen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_evermist_queen_desc: "The daughter of the fourth son of Feanor, Vorwen spent the First Age fighing in her families wars across belariand. but after the war was over and the land itself was ruined she swore a diffrent oath, not to reclaim her grandfather's jewels, but to stay in middle earth until the world was healed from the damage her family caused."

 bookmark_frozen_waste_eitri: "Eitri"
 bookmark_frozen_waste_eitri_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_eitri_desc: "The Second son of the King of the Ironfists, Eitri wanted more in life than his families ancient holds in the Red Mountains, Hearing of Riches untold left buried in the mountians of the utter north, he has organized an expiditon to the Bleak Mountains to establish a new sattilite hold, one that might one day rival even the great holds of the elder days..."
 
  
