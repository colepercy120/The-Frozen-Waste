 # ============================================================
 # Bookmarks
 # ============================================================

 bm_2754_frozen_waste: "The Ruined Wastes"
 bm_2754_frozen_waste_desc: "[Concept('forodwaith','Forodwaith')|E] is a harsh, sparsely populated land still scarred by the [Concept('warofwrath','War of Wrath')|E]. [Concept('dragon','Dragons')|E] dominate its skies, spirits of air and darkness hold it in an eternal winter, and centers of civilization are few and far between. Yet hope is not lost.\n\nIn the uttermost North, the [Concept('lossidil','Lossidil')|E] have raised a great city around a shard of the [Concept('lampsofthevalar','Great Lamps')|E]. Volcanic hot springs shelter the valley of [Concept('evermist','Evermist')|E] from the worst of winter, while [Concept('dwarves','Dwarves')|E] carve a new realm into the Ered Muil.\n\nBut in the ruins of [Concept('angband','Angband')|E], Nixní, the [Concept('ladyofcold','Lady of Cold')|E], plots in service to the ancient darkness, holding the land in an endless frost."

 bookmark_frozen_waste_nixni: "Nixní"
 bookmark_frozen_waste_nixni_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_nixni_desc: "The [Concept('ladyofcold','Lady of Cold')|E] is the most powerful being left in the Frozen Waste. One of [Concept('morgothcharacter','Morgoth')|E]'s lieutenants in the [Concept('elderdays','Elder Days')|E], she has established herself in the ruins of [Concept('angband','Angband')|E], guarding his shattered realm until her master returns. Yet rumors suggest that she is preparing something within the broken halls, with none but the [Concept('darklord','Dark Lord')|E] himself privy to her plans."

 bookmark_frozen_waste_talanthir: "Talanthir"
 bookmark_frozen_waste_talanthir_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_talanthir_desc: "Talanthir, High King of the [Concept('adlantrim','Adlantrim')|E], is one of the oldest beings still living in [Concept('middleearth','Middle-earth')|E]. The last of the original [Concept('orcs','Orcs')|E], he alone remembers the days before [Concept('melkorcharacter','Melkor')|E] stole his people from [Concept('cuivienen','Cuiviénen')|E]. He has fought to preserve his children's souls and worked for ages to heal what was broken. The Orcs, too, are children of [Concept('eruiluvatar','Ilúvatar')|E], even if the [Concept('elves','Elves')|E] and the [Concept('valargods','Valar')|E] forget it."

 bookmark_frozen_waste_graw: "Graw"
 bookmark_frozen_waste_graw_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_graw_desc: "Graw is a foundling raised aboard the ships that ply the [Concept('forodain','Forodain')|E] islands. He has always suspected that he was destined for greatness. Only when the great cold-[Concept('drake','drake')|E] Faron slew his adoptive parents and sank their ship did he discover his purpose: he would bring down the dragon, even if it cost him his life."

 bookmark_frozen_waste_evermist_queen: "Vorwen"
 bookmark_frozen_waste_evermist_queen_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_evermist_queen_desc: "The daughter of [Concept('feanor','Fëanor')|E]'s fourth son, Vorwen spent the [Concept('firstage','First Age')|E] fighting in her family's wars across [Concept('beleriand','Beleriand')|E]. When the war ended and the land itself lay ruined, she swore a different oath: not to reclaim her grandfather's jewels, but to remain in [Concept('middleearth','Middle-earth')|E] until the damage her family had helped cause was healed."

 bookmark_frozen_waste_eitri: "Eitri"
 bookmark_frozen_waste_eitri_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_frozen_waste_eitri_desc: "The second son of the King of the [Concept('ironfists','Ironfists')|E], Eitri sought more than a life within his family's ancient halls in the Red Mountains. Hearing of untold riches buried beneath the mountains of the Utter North, he organized an expedition to the Bleak Mountains to establish a new outpost, one that might someday rival the great holds of the [Concept('elderdays','Elder Days')|E]."


