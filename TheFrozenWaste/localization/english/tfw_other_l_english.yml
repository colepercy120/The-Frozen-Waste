 situation_tfw_orc_restoration: "The Great Healing"
 situation_tfw_orc_restoration_desc: "The [Concept('adlantrim','Adlantrim')|E], abandoned children of [Concept('eruiluvatar','Ilúvatar')|E], have endured untold suffering since [melkorcharacter|E] stole their ancestors from [cuivienen|E]. Yet they have not lost hope. They work tirelessly to cleanse themselves of the taint of the [darklord|E]."
