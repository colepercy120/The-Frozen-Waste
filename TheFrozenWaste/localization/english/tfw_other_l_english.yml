 nick_queen_air_dark_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], the [Concept('ladyofcold','Lady of Cold')|E], is known to the [Concept('lossoth','Lossoth')|E] as Yâdânaisëny, the Winter Queen. One of [melkorcharacter|E]'s chief lieutenants during the [elderdays|E], she was no match for [sauroncharacter|E] in power, but was feared for her cold cruelty and her inability to tell a direct lie.\n\nKnown for her bargains, she was said to serve the Shadow only because of a pact with [melkorcharacter|E]. In later ages, she remained one of the last rivals to [sauroncharacter|E], haunting the icy waters of [Concept('forochel','Forochel')|E]."

