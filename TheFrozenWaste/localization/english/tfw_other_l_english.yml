 elven_hope_situation_sub_region_forodwaith: "Forodwaith"
 elven_hope_situation_sub_region_forodwaith_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The Frozen North has long been host to [elves|e] dating clear back to the [elderdays|e]. their realms while not as grand as those to the south have endured and unlike much of the [eldar|e] have even thrived far away from the troubles of warmer climes.#!"
