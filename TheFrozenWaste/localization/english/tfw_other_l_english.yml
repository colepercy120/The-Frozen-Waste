 great_project_type_angband_durnost_construct_building_tt: "The fortress will be expanded to its next level."
 great_project_type_angband_durnost_upgrade_stonework: "Massive Stoneworks"
 great_project_type_angband_durnost_upgrade_stonework_desc: "Quarry, shape, and transport the immense quantities of stone required to enlarge the fortress."
 great_project_type_angband_durnost_upgrade_fortifications: "Strengthen the Fortifications"
 great_project_type_angband_durnost_upgrade_fortifications_desc: "Raise new walls, gates, towers, and defensive works around the growing stronghold."
