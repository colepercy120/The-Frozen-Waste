 situation_frozen_waste: "The Frozen Waste"
 situation_frozen_waste_desc: "The Shattered land of [forodwaith|e] once played host to the First Dark Lord, [morgothcharacter|e] and his great fortresses. The Dark Lord may be gone, but his taint lays on the land even mellenia later. The region has remained unnaturally cold and barren ever since the [warofwrath|e]. Some blame this on the lingering shadow, others blame the [witchking|e] and [sauroncharacter|e] while still others speak of the [ladyofcold|e]..."
