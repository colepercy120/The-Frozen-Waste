 situation_frozen_waste: "The Frozen Waste"
 situation_frozen_waste_desc: "The shattered lands of [forodwaith|E] once housed the great fortresses of [morgothcharacter|E], the first Dark Lord. Though he is gone, his taint still lies upon the land millennia later. The region has remained unnaturally cold and barren since the [warofwrath|E]. Some blame the lingering Shadow, others the [witchking|E] and [sauroncharacter|E], while still others whisper of the [ladyofcold|E]..."
