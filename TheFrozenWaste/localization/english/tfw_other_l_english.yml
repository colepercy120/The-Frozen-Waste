 # ============================================================
 # Game concepts
 # ============================================================

 game_concept_frozen_waste: "The Frozen Waste"
 game_concept_the_frozen_waste: "The Frozen Waste"
 game_concept_frozen_waste_desc: "The far north of [middleearth|E] is more than merely cold. [forodwaith|E] still bears the scars of the [elderdays|E], when [morgothcharacter|E] ruled the North from his great fortresses. Though the First Dark Lord is gone, his works, ruins, and corruption continue to burden the land.\n\nFor millennia the region has remained unnaturally barren and hostile, its peoples living among the wreckage of older ages while the shadow of the North has never entirely faded. Some blame the lingering taint of Morgoth, others the later works of the [witchking|E] and [sauroncharacter|E], while many in the Utter North place the greatest blame upon the [ladyofcold|E]."

 game_concept_eternal_winter: "The Eternal Winter"
 game_concept_endless_winter: "The Eternal Winter"
 game_concept_eternal_winter_desc: "For thousands of years an unnatural winter has lain over [forodwaith|E], leaving much of the far North colder, darker, and more barren than it should be. The long frost is bound closely to the power of the [ladyofcold|E] and to the lingering wounds left upon the region by the struggles of the [elderdays|E].\n\nEnding the Eternal Winter requires more than defeating a single ruler. The ancient wounds of the North must be addressed: [angband|E] must be cleansed, [frostwood|E] healed, the Winter Queen driven from her hold over the North, and [helecthil|E] kept from evil hands. Only then can true spring return to the farthest reaches of [Concept('middleearth','Middle-earth')|E]."

 game_concept_the_unbroken: "The Unbroken"
 game_concept_unbroken: "The Unbroken"
 game_concept_the_unbroken_desc: "The Unbroken is the central ideal of the [uracinar|E]: the conviction that no wound, ruin, or corruption is necessarily beyond healing. A shattered blade may be reforged, a ruined hall rebuilt, a wounded body tended, and even a people deliberately broken over ages may slowly make themselves whole again.\n\nThe Unbroken do not claim that restoration is easy or quick. Their creed instead treats patience, diligence, memory, and rebuilding as acts of defiance against despair and against the legacy of [morgothcharacter|E]."

 game_concept_gift_of_the_wolf: "Gift of the Wolf"
 game_concept_wolfs_gift: "Gift of the Wolf"
 game_concept_wolfgift: "Gift of the Wolf"
 game_concept_gift_of_the_wolf_desc: "After the ancestors of the [gauredain|E] were driven from [angmar|E] into the frozen North, [radagastcharacter|E] took pity upon them. Through his teaching, some among their people learned to assume the form of great wolves, gaining the strength, endurance, senses, and protection from the cold needed to survive in [forodwaith|E].\n\nTo the Gauredain this wolf-shape is not a curse or surrender to bestial nature, but a sacred covenant and means of survival. The gift became an inheritance guarded by their people and a symbol that exile and winter would not destroy them."

 game_concept_ladyofcold: "The Lady of Cold"
 game_concept_winter_queen: "The Winter Queen"
 game_concept_snowqueen: "The Winter Queen"
 game_concept_nixni: "Nixní"
 game_concept_ladyofcold_desc: "Nixní, the Lady of Cold, is known across the North as the Winter Queen. In the [elderdays|E] she served as one of [morgothcharacter|E]'s chief lieutenants. Though lesser in power than [sauroncharacter|E], she became feared for her cold cruelty, her bargains, and her reputation for never speaking a direct lie.\n\nNorthern tradition holds that even her service to Morgoth was the result of a bargain. In later ages she endured as one of the last great powers of the old Shadow to remain active in the far North, haunting the icy reaches of [Concept('forochel','Forochel')|E] and becoming inseparably tied to the [eternal_winter|E]."

 game_concept_tareg: "Tareg"
 game_concept_tareg_desc: "One of the great war leaders of the [avari|E] at the [battleofpalisor|E], Tareg later joined [ermon|E] on his westward journey at the head of a great [avarin|E] host. Seeking peace and safety, groups from the host settled along the route. Most remained in Eryn Rhûn, on the shores of the inland sea. The rest continued north into what is now [frostwood|E].\n\nThere they encountered the forces of [morgothcharacter|E], led by the [ladyofcold|E]. Tareg was struck down and entombed in a pillar of ice, an enduring reminder to the Avari of Frostwood of the fate awaiting those who resisted the darkness."

 game_concept_giftlord: "The Giftlord"
 game_concept_giftbringer: "The Gift Bringer"
 game_concept_gift_bringer: "The Gift Bringer"
 game_concept_giftlord_desc: "The Giftlord is a mysterious [maiagod|E] said to dwell at the very top of the world. His followers know him above all as a bringer of gifts, aid, and joy to those in need, and honor him especially during the depths of midwinter.\n\nThe Anwantar who revere the Giftlord place generosity among the highest virtues. They travel widely, distribute gifts and wealth, support charitable works, and seek to bring hope to others during the darkest season of the year."

 game_concept_forodain: "Forodain"
 game_concept_forodain_desc: "The Forodain are a people of the far North descended from [Concept('numenorean','Númenórean')|E] whalers who settled in [forodwaith|E] and mingled with [Concept('men','Men')|E] already living there, later receiving strong cultural influence from the [Concept('dunedain','Dúnedain')|E] of [arnor|E]. The fall of [Concept('numenor','Númenor')|E] and the dangers of the North left their communities scattered among the broken lands of the region.\n\nForodain tradition places great importance on endurance, courage, loyalty, genealogy, and the keeping of oaths. The histories of the [elderdays|E] are preserved not merely as distant legend, but as lessons and obligations carried forward through song and memory."

 game_concept_lossidil: "Lossidil"
 game_concept_lossidil_desc: "The Lossidil are northern [Concept('elves','Elves')|E] descended from Nandorin peoples who journeyed into the far North and later mingled with [Concept('sindarelves','Sindar')|E] fleeing the destruction of [Concept('beleriand','Beleriand')|E] after the [warofwrath|E]. They adapted to the long darkness and bitter cold of [forodwaith|E], creating enduring communities far from the great Elven realms of the South.\n\nTheir spiritual and cultural life is closely bound to [helecthil|E], whose light serves as a beacon of refuge and hope beneath the auroras of the northern sky."

 game_concept_gauredain: "Gauredain"
 game_concept_wolfsworn_people: "Gauredain"
 game_concept_gauredain_desc: "The Gauredain descend from peoples who once lived in the dales and valleys of [angmar|E] before being driven north by the Angmarrim and the [witchking|E]. Exiled into [forodwaith|E], they survived in lands where cold, hunger, and isolation threatened to destroy them.\n\nTheir history changed when [radagastcharacter|E] granted their people the [gift_of_the_wolf|E], allowing chosen members of the community to take wolf-shape. The Gauredain remember Angmar as their lost homeland even as generations of exile have made the frozen wilderness their refuge."

 game_concept_uracinar: "Úrácinar"
 game_concept_unbowed_orcs: "The Unbowed"
 game_concept_adlantrim: "Adlantrim"
 game_concept_adalantrim: "Adlantrim"
 game_concept_uracinar_desc: "The Úrácinar are [orcs|E] who reject the claim that darkness owns their people. They believe their ancestors were broken and corrupted by [morgothcharacter|E], and that the damage inflicted upon Orc-kind does not create an eternal obligation to serve the Shadow.\n\nTheir communities value diligence, preservation, learning, and patient reconstruction. Old songs are pieced together from fragments, genealogies are preserved, tools and halls are repaired, and each generation is expected to leave its people stronger and freer than it found them. This philosophy is expressed most clearly in the teaching of [the_unbroken|E]."

 game_concept_moriondor: "Moriondor"
 game_concept_orc_father: "Orc Father"
 game_concept_orc_mother: "Orc Mother"
 game_concept_moriondor_desc: "The original [orcs|E]: [elves|E] taken from the wilds by the [darklord|E] and tortured beyond recognition. Marred and twisted into Orcs, they were forced to serve their captor."

 game_concept_helecthil: "Helecthil"
 game_concept_beaconofhelecthil: "Beacon of Helecthil"
 game_concept_beacon_of_helecthil: "Beacon of Helecthil"
 game_concept_helecthil_desc: "After the [Concept('downfallofnumenor','Downfall of Númenor')|E], the Utter North was left ruined and cast into long periods of darkness, far beyond the light of either Sun or Moon for much of the year. Northern [Concept('elves','Elven')|E] tradition holds that [ulmocharacter|E], wishing to provide hope to those who remained, raised a shard of the [Concept('lampsofthevalar','ancient Lamps')|E] to become Helecthil.\n\nIts light became a beacon and sanctuary of the [lossidil|E], associated with guidance, endurance, the aurora, and refuge from the killing cold. Over time a settlement grew around the beacon, and Helecthil became one of the great spiritual centers of the northern Elves."

 game_concept_frostwood: "Frostwood"
 game_concept_frostwood_desc: "Frostwood is an ancient forest of the far North whose lands were scarred by the conflicts of the [elderdays|E] and by the power of the [ladyofcold|E]. The forest became home to communities of [avari|E], including the followers of [tareg|E], but its woods remained trapped beneath an unnatural and enduring frost.\n\nHealing Frostwood is one of the great works required to end the [eternal_winter|E]. When its ancient curse is finally broken, life can return to places long left barren, old groves can stir again, and the ice that has clung to its trees for ages can at last begin to melt."

 game_concept_shatterwood: "Shatterwood"
 game_concept_frozen_numenorean_fleet: "The Frozen Númenórean Fleet"
 game_concept_shatterwood_desc: "Shatterwood is the name given to the broken remains of an ancient [Concept('numenorean','Númenórean')|E] fleet locked within the northern ice. Near the end of the [Concept('secondage','Second Age')|E], the ships were shattered by the [ladyofcold|E], leaving weathered hulls and timbers frozen together in a vast field of wreckage.\n\nThe survivors of the disaster later became an important influence upon the [forodain|E]. Their descendants remember the site with reverence, though unstable ice and treacherous ground make travel among the ancient ships dangerous."

 game_concept_morgoths_well: "Morgoth's Well"
 game_concept_morgothswell: "Morgoth's Well"
 game_concept_morgoths_well_desc: "Morgoth's Well was once a vast chasm reaching deep into the earth. Tradition identifies it as the place where [maedhros|E], tormented by the [Concept('silmaril','Silmaril')|E] he had reclaimed, cast himself and the jewel into the depths.\n\nThe later reshaping of the world transformed the ancient crevice. Magma forced its way upward and the site became a massive shield volcano, leaving one of the strangest surviving scars of the [elderdays|E] upon the geography of the North."

 game_concept_evermist: "Evermist"
 game_concept_evermist_desc: "Evermist was founded in the aftermath of the [warofwrath|E], when much of the far North had been devastated by the wars against [morgothcharacter|E]. Its founders did not come merely to survive among the ruins, but to heal them.\n\nOver the long centuries that followed, the [Concept('elves','Elves')|E] of Evermist worked to restore forests, cleanse poisoned lands, shelter surviving peoples, and slowly repair the wounds left across [forodwaith|E]. Their realm became both a refuge and a center of renewal, built around the belief that even lands scarred by the greatest evils of the [elderdays|E] could be made whole again.\n\nMuch of that work was catastrophically undone during the [roundingofworld|E], when the far North was shattered by the transformation of [Concept('arda','Arda')|E] and enormous volcanic upheavals devastated the region."

 game_concept_durnost: "Durnost"
 game_concept_durnost_desc: "Durnost was built by [sauroncharacter|E] during the wars of the [elderdays|E] as an outer defense for [utumno|E] and [angband|E]. More than a simple fortress, it served as Sauron's personal seat in the far North and as one of his principal command posts during [Concept('morgothcharacter','Morgoth')|E]'s wars against the Free Peoples.\n\nFrom Durnost, Sauron directed armies, guarded the approaches to his master's northern strongholds, and gathered wealth, relics, weapons, and other treasures for himself. Many of these hoards were never recovered after the collapse of Morgoth's power.\n\nDurnost remained a frequent haunt of Sauron during the early [secondage|E], but after he secured [mordor|E] as his own great stronghold in the South, he largely abandoned the fortress. Without its master, Durnost steadily declined and eventually fell into the hands of the Snow [Concept('orcs','Orcs')|E], who occupied its ruined halls and fortifications.\n\nBy the later ages Durnost is little more than a shattered remnant of its former strength. Even so, its buried chambers are still believed to contain ancient treasures, forgotten stores, and relics hoarded there by Sauron before he turned his ambitions southward."

 game_concept_nidavellir: "Nidavellir"
 game_concept_nidavellir_desc: "Nidavellir is a [Concept('dwarves','Dwarven')|E] realm of the northern mountains, centered upon halls and settlements carved into the stone of the far North. Its position places it among the isolated mountain powers of [forodwaith|E], where mineral wealth, fortified underground settlements, and control of difficult passes make Dwarven colonization possible even in lands that are hostile to most peoples.\n\nNidavellir is one of the principal centers of renewed Dwarven settlement in the North."

 game_concept_roundingofworld: "Rounding of the World"
 game_concept_forodwaithshattering: "Shattering of Forodwaith"
 game_concept_roundingofworld_desc: "During the [downfallofnumenor|E], the shape of the world itself was changed, and the once-flat world was bent into a sphere. In the more temperate lands nearer the equator, this transformation brought relatively little visible destruction. At the poles, however, the consequences were catastrophic.\n\nThe far North was nearly torn apart. Great stretches of the northern peninsula were shattered into islands, ancient coastlines vanished beneath the sea, and newly awakened volcanoes poured truly immense quantities of lava across the broken land. Mountains split, valleys collapsed, and entire regions were remade in a matter of days.\n\nFor [evermist|E], the catastrophe was especially devastating. Centuries of patient work spent healing the wounds left by [morgothcharacter|E] and restoring the North were undone almost at once. Forests, settlements, and reclaimed lands were buried beneath ash, fire, ice, and flood, leaving the peoples of [forodwaith|E] to begin the work of restoration all over again."

