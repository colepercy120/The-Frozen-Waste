 great_project_type_angband_durnost_upgrade: "Restore Dread Fortress"
 great_project_type_angband_durnost_upgrade_desc: "The North is dotted with dread fortresses of the [elderdays|E]. With sufficient investment and effort, these strongholds can be restored to their ancient grandeur."
