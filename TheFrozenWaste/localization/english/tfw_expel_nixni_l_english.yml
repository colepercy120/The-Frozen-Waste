l_english:
 tfw_expel_nixni_from_angband_decision: "Expel Nixni from Angband"
 tfw_expel_nixni_from_angband_decision_desc: "The Ice Queen has made the ancient fortress of [angband|e] the seat of her tyranny. We must gather our banners, break her dominion, and leave the halls of the Dark Enemy empty and desolate. Should we fail, our disgrace will cost us both fame and devotion."
 tfw_expel_nixni_from_angband_decision_tooltip: "Declare a special war against Nixni to leave Angband as [wilderness|e] and ruin its great building. Defeat costs one level of Fame and Devotion."
 tfw_expel_nixni_from_angband_decision_confirm: "March on Angband!"
 tfw_expel_nixni_angband_cb_name: "Expel Nixni from Angband"
 tfw_expel_nixni_angband_war_name: "War to Expel Nixni from Angband"
 tfw_expel_nixni_cb_victory_desc: "The great building in Angband is ruined and every settled county in Angband becomes wilderness. No titles are seized."
 tfw_expel_nixni_cb_white_peace_desc: "Angband remains under the Ice Queen's control. Neither side gains territory."
 tfw_expel_nixni_cb_defeat_desc: "The attacker loses one level of Fame and one level of Devotion."
 tfw_expel_nixni_cb_invalidated_desc: "The war is invalidated because Nixni is no longer alive or Angband has already been cleansed."
 tfw_expel_nixni.0001.t: "Defiance at Angband"
 tfw_expel_nixni.0001.desc: "[scope:tfw_expel_nixni_attacker.GetTitledFirstName] has raised an army against you, proclaiming that Angband shall be emptied and its ancient fortress reduced to ruins. The challenge is no mere border raid: they intend to cast you from the stronghold itself."
 tfw_expel_nixni.0001.a: "Let them come. The ice will claim them."
