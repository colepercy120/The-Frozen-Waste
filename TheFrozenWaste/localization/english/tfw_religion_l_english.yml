  ### Northern Elven Faiths ###

  # Evermist
  faith_evermist: "Envinyatarim"
  faith_evermist_adj: "Envinyatar"
  faith_evermist_adherent: "Envinyatar"
  faith_evermist_adherent_plural: "Envinyatarim"
  faith_evermist_desc: "The faith of the [noldor_elves|e] of [evermist|E], They believe the ruin of the world is atleast partially the fault of the Eldar and understand they have a responsiblity to heal what was once broken"

  # Helecthil
  faith_helecthil: "Light of Helecthil"
  faith_helecthil_adj: "Helecthil"
  faith_helecthil_adherent: "Helecthili"
  faith_helecthil_adherent_plural: "Helecthilrim"
  faith_helecthil_desc: "After the [downfallofnumenor|e] the Utter north of the world was ruined and cast into shadow, far beyond the light of either the sun or moon for much of the year. [ulmocharacter|e] wishing to provide a new hope to those who remained raised a shard of the ancient Lamps to serve as a beacon in the darkness. this shard the Helecthil, has been a source of Reverence for the Eldar ever since."

  # Eternal Vigil
  faith_eternal_vigil: "Tirítli"
  faith_eternal_vigil_adj: "Tiríte"
  faith_eternal_vigil_adherent: "Tirítmo"
  faith_eternal_vigil_adherent_plural: "Tirítli"
  faith_eternal_vigil_desc: "The [elves|e] of the Vigil, the Tiritli remain ever watchful against the darkness returning to the world, seeking to destory the shadow whereever it arises. they are most often survivors of the wars of the [elderdays|e] and spend much of their time near the ruins of [angband|e]"

  # Santa / Giftlord Faith
  faith_santa: "Anwantar"
  faith_santa_adj: "Anwantar"
  faith_santa_adherent: "Anwantarli"
  faith_santa_adherent_plural: "Anwantarim"
  faith_santa_desc: "A Strange sect following a mysterious [maia|e] said to live at the north pole. the Anwantar travel the world offering gifts to all those in need, they value generosity above all else and seek to spread joy across middleearth"

  ### Northern Elven Tenets ###

  # Elven Preservation
  tenet_elven_preservation_name: "Elven Renewal"
  tenet_elven_preservation_desc: "The seasons change and the world grows old, but that doesn't deminish the value of biulding anew. Nothing, not even the [eldar|e] truely last forever, and this faith holds special revrence for the act of creation and esspecially reconstruction"

  # Giftlord
  tenet_giftlord_name: "Reverence for the Giftlord"
  tenet_giftlord_desc: "this faith holds special attention for the Gift Bringer, a mysterious [maia|e] at the top of the world, they celebrate midwinter with gifts and offer much of their wealth to charitible causes."

  # World Shapers
  tenet_world_shapers_name: "Primacy of the World Shapers"
  tenet_world_shapers_desc: "This Faith holds the [vala|e] [aluecharacter|e] and [yavannahcharacter|e] in special regard, seeing them as the literal shapers of the world and the architechs of [arda|e]"
  
  tenet_helecthil_name: "Glory of Helecthil"
  tenet_helecthil_desc: "This Faith holds [ulmocharacter|e], the Helecthil, and the Aurora in high regard, finding hope and peace in the everchanging northern lights"

