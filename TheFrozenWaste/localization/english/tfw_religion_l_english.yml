   ### Winter Queen Faith ###
  faith_winter_queen: "Cult of the Winter Queen"
  faith_winter_queen_adj: "Winter Queen"
  faith_winter_queen_adherent: "Winter Courtier"
  faith_winter_queen_adherent_plural: "Winter Courtiers"
  faith_winter_queen_desc: "In the frozen reaches of the North, the faithful give their devotion to Nixni, the Winter Queen. To them, winter is not merely a season to be endured, but a proving ground that strips away weakness and reveals strength, discipline, and resolve. Cold, snow, and deprivation are sacred trials, and those who master them are held in the highest esteem.\n\nThe faithful seek the Winter Queen's favor through endurance, ambition, and mastery of the frozen lands. Her chosen warriors are expected to move through snow and ice where others falter, turning the bitter climate itself into a weapon against their foes."

  ### Winter Queen Deity ###
  nixni_god: "Nixni"
  nixni_god_possessive: "Nixni's"

  ### Winter Queen Tenet ###
  tenet_winter_queen_name: "Favor of the Winter Queen"
  tenet_winter_queen_desc: "The Winter Queen favors those who thrive where others merely survive. Bitter cold, deep snow, and the long darkness of the North are not curses, but sacred trials through which the faithful prove their worth. Warriors trained in these lands learn to turn winter itself against their enemies, enduring privation and striking with deadly advantage in the frozen wastes."

