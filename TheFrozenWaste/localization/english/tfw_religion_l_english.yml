  ### Werewolf Faith ###
  faith_werewolves: "Wolfsworn"
  faith_werewolves_adj: "Wolfsworn"
  faith_werewolves_adherent: "Wolfsworn"
  faith_werewolves_adherent_plural: "Wolfsworn"
  faith_werewolves_desc: "The Wolfsworn descend from the [eriadorrim|E] who once dwelt in the lands of Angmar before they were driven north by the Angmarrim. Hunted from their homes and forced into the frozen expanses of [forodwaith|E], they survived where few others could, carrying with them only fragments of their old customs, their hatred of those who dispossessed them, and the memory of the lands they had lost.\n\nTheir survival changed when [radagastcharacter|E] took pity upon them. Through his gift, certain among their people learned to take the shape of great wolves, gaining the strength, endurance, keen senses, and thick hides needed to survive the northern wastes. What began as a means of survival became a sacred inheritance, passed down and guarded with great care.\n\nThe Wolfsworn do not see the wolf-shape as a curse or loss of humanity. To them it is a covenant: a gift granted so that their people would endure when exile, cold, and hunger should have destroyed them. They revere Radagast as their protector and teacher, and regard the wild places of the North as both refuge and proving ground."

  ### Werewolf Tenet ###
  tenet_werewolves_name: "Gift of the Wolf"
  tenet_werewolves_desc: "When our people were driven from their homes and cast into the frozen North, we were not left to die. Radagast gave us the means to endure, teaching some among us to take the shape of the wolf and survive where ordinary flesh would fail.\n\nThis gift is sacred. The wolf-shape grants strength against the cold, speed across the snow, and senses sharp enough to live from the harsh land itself. To take that form is not to become a beast, but to accept the means by which our people were preserved. So long as the gift remains among us, exile will not break us, winter will not claim us, and no enemy will easily drive us from our refuge again."
 
