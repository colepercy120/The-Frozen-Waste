  holy_order_wardens_of_the_north: "Wardens of the North"
  holy_order_oathsworn_of_forodain: "Oathsworn of Forodain"
  holy_order_spears_of_the_elder_days: "Spears of the Elder Days"
  holy_order_guardians_of_the_old_tales: "Guardians of the Old Tales"
