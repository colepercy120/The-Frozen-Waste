  ### Forodain Faith ###
  faith_forodain: "Lore of the North"
  faith_forodain_adj: "Forodain"
  faith_forodain_adherent: "Forodain"
  faith_forodain_adherent_plural: "Forodain"
  faith_forodain_desc: "The Forodain preserve a stern faith shaped by the long winters of the North and the memory of the Elder Days. They hold courage, endurance, loyalty, and the keeping of oaths among the highest virtues, remembering the ancient struggles of Elves and Men against the Shadow as examples for every generation that follows.\n\nTo the Forodain, the deeds of their forebears are not distant stories. They are lessons, warnings, and obligations carried forward through song, genealogy, and sacred tradition. A worthy life is one that leaves behind a name fit to be remembered."

  ### Silmarillion Tenet ###
  tenet_silmirillion_name: "The Silmarillion"
  tenet_silmirillion_desc: "The ancient histories of the Elder Days are more than chronicles of a vanished age. They preserve the story of the creation of the world, the deeds of the Powers, the awakening of the Children of Ilúvatar, the making and loss of the Silmarils, and the long wars against the first Dark Lord.\n\nThe faithful treat these tales as sacred history and moral instruction. The triumphs, failures, oaths, sacrifices, and tragedies of the great figures of old are studied so that the living might recognize the same choices when they arise again."

