  holy_order_sons_of_the_cold_wind: "Sons of the Cold Wind"
  holy_order_the_oathbound_company: "The Oathbound Company"
  holy_order_sentinels_of_the_high_north: "Sentinels of the High North"
  holy_order_blades_of_remembrance: "Blades of Remembrance"
  holy_order_the_last_watchfires: "The Last Watchfires"
  holy_order_companions_of_the_elder_lore: "Companions of the Elder Lore"
  holy_order_the_northern_shieldwall: "The Northern Shieldwall"
  
  faith_unbowed: "Úrácina"
  faith_unbowed_adj: "Úrácina"
  faith_unbowed_adherent: "Úrácina"
  faith_unbowed_adherent_plural: "Úrácinar"
  faith_unbowed_desc: "The Úrácinar are [orcs|E] who refuse the claim that darkness owns them. They remember that their people were not always creatures of chains and cruelty, and that before the first Dark Lord broke their ancestors there was something older beneath the scars. They do not expect that inheritance to return easily. What was ruined over ages must be restored through patience, discipline, and work.\n\nAmong the Úrácinar, diligence is treated almost as a sacred virtue. A damaged wall is rebuilt stone by stone. A neglected field is cleared and planted again. A broken tool is repaired rather than discarded. Old songs are reconstructed from fragments, genealogies are carefully preserved, children are taught what their ancestors were denied, and every generation is expected to leave its people stronger, wiser, and freer than it found them. Idleness in the face of suffering is regarded with contempt, for there is always something that can be mended, learned, strengthened, or restored.\n\nThey oppose [morgothcharacter|E] and every would-be [darklord|E] absolutely. No master, however ancient or powerful, has a rightful claim upon them. Their freedom is maintained not only with weapons, but through the patient work of rebuilding a people that was deliberately shattered. They look toward the elder traditions of the [elves|E] and the echoes of the [ainurgods|E] not because they believe they can simply become what their ancestors once were, but because memory gives them a foundation upon which something new can be built."

  tenet_unbroken_name: "The Unbroken"
  tenet_unbroken_desc: "Nothing broken is beyond healing if enough effort is given to its restoration. A shattered blade can be reforged, a ruined hall rebuilt, a wounded body tended, and a damaged people made whole again. Some wounds require years, generations, or even ages of patient work, but difficulty does not make restoration impossible.\n\nThe faithful believe that perseverance is itself an act of defiance against despair. What has been damaged must be tended, what has been lost must be sought, and what has been weakened must be strengthened. They do not expect healing to be quick or easy, only that with sufficient patience, diligence, and effort, even the deepest wounds can mend.\n\n #BOL Nothing that is lost cannot be found, nothing that is broken can't be repaired, No Wound can't be healed and No Stain Can't be cleaned.#!"
  
