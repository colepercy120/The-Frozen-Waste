### Situation Events

 tfw_situation.0001.t: "Angband Cleansed"
 tfw_situation.0001.desc: "Angband Stands Shattered! The Ancient Taint of [melkorcharacter|e] has been cast off and the tunnels cleansed of evil! The shadow it has left on the world might remain, but at long last the world may finally start healing."
 tfw_situation.0001.a: "The long shadow recedes."

 tfw_situation.0002.t: "Frostwood Healed"
 tfw_situation.0002.desc: "The long labor of restoration has borne fruit. The wounds of Frostwood have begun to close, and life once again spreads through places long left barren and broken.\n\nAncient groves stir beneath the cold sky, roots reclaim scarred earth, and the Ice that has clung to the trees since the [elderdays|e] has finally began to melt. Frostwood will never be precisely what it once was, but it lives."
 tfw_situation.0002.a: "Let the forest flourish."
 
 tfw_situation.0003.t: "A Frozen Miracle"
 tfw_situation.0003.desc: "A miracle has occured! [tareg|e], the leader of our host has survived being frozen in Ice! for the last 7000 years frozen he has lain frozen in the eternal ice of the [ladyofcold|e]. but as the ice finally began to melt we were amazed to find him still alive. \n\nWhile his body is wounded and covered in frostbite it is not yet broken and our great leader has once again taken control of the [avarielves|e] of the Frostwood"
 tfw_situation.0003.a: "Hail the Return of the King (play as Tareg)"
 tfw_situation.0003.b: "Hail the Return of the King"
 tfw_situation.0003.c: "We stand independent"
 
 tfw_situation.0005.t: "Spring At Last!" 
 tfw_situation.0005.desc: "Sping has finally come to [forodwaith|e]. the eternal winter of the [snowqueen|e] is finally over. for the first time in over 6000 years a far north will have a summer. \n\n All across the region the people are rejoicing, herds are growing and the spirits of cold are retreating. while the north will never be a warm place, it is no longer hostile. Spring has come at last"
 tfw_situation.0005.a: "To a New Age!"
 
 ### Title Formation Events
 
 tfw_misc.001.t: "The Formation of Rast Losnath"
 tfw_misc.001.desc: "The cape of biting snow has long been vital in the politics of the north. but for to long these lands were divided amoungst competing groups. but no longer. we have unified the cape and proclaimed our might across [forodwaith|e]"
 tfw_misc.001.a: "To a new age!"

 tfw_misc.002.t: "The Formation of Muilfalas"
 tfw_misc.002.desc: "Along the shores of the Forsaken Sea lies Muilfalas, the bleak coast. a land barely more than a waste, but yet we have surivived it. more than that we have thrived, and now the Bleak Coast is truly our home and we will not be expeled"
 tfw_misc.002.a: "To a new age!"

 tfw_misc.003.t: "Our Homeland Reclaimed"
 tfw_misc.003.desc: "For to long our people have been in exile, but now we return! the land of Land of [angmar|e] has been freed and we once more take our place in [eriador|e] along side our kin!"
 tfw_misc.003.a: "At long last!"

 tfw_misc.004.t: "A New Realm in Exile!"
 tfw_misc.004.desc: "Since the Downfall, our people have been scattered across the shattered remnants of the North, surviving among the ruins while the fortunes of our kin to the south waxed and waned. We have endured in isolation for long enough.\n\nIf we are ever to stand beside [gondor|E], [arnor|E], or even [umbar|E] as a great realm of the Dúnedain, then we must cast aside our divisions, unite our people, and carve our own path through the world. Let the scattered heirs of Númenor in the North be scattered no longer."
 tfw_misc.004.a: "We shall take our rightful place!"

 tfw_misc.005.t: "The Lossoth United"
 tfw_misc.005.desc: "The scattered peoples of Forochel have at last been brought together. Tribes and clans that once stood apart now acknowledge a common ruler, their old rivalries set aside beneath a single banner.\n\nThe frozen North has shaped the Lossoth through countless generations, teaching us endurance where softer peoples would perish. Now that strength is no longer divided. From the coasts of Forochel to the deepest reaches of the frozen wastes, the Lossoth stand united."
 tfw_misc.005.a: "One people beneath the northern sky."

 tfw_misc.006.t: "The Bay of Forochel United"
 tfw_misc.006.desc: "From one end of the frozen coast to the other, the peoples of the Bay of Forochel now acknowledge a common ruler. The scattered settlements and clans that once looked only to their own shores now stand together as part of a greater whole.\n\nThe bay that once divided us now binds us together. Its waters, islands, and icy coasts belong to one realm, and its people will face the future as one."
 tfw_misc.006.a: "Let the bay be divided no longer."

 tfw_misc.007.t: "The Utter North Secured"
 tfw_misc.007.desc: "The distant territories of the North have been brought beneath our authority. Lands that once stood apart now answer to a common order, their rulers and peoples incorporated into the greater hegemony.\n\nFrom the heartlands of Forodwaith to its furthest reaches, our influence now extends across the Utter North."
 tfw_misc.007.a: "The North is ours to guard."

 tfw_misc.008.t: "The Unification of the Avari"
 tfw_misc.008.desc: "The [avari|e], long divided have been reunited under the [ROOT.Char.GetName]. Already the [elves|e] of the world are calling this a turning point in their races history. Now all eyes turn to [ROOT.Char.GetFirstName] and what the future holds for him"
 tfw_misc.008.a: "Hail the Reunifier!"

 tfw_misc.009.t: "Forodwaith United"
 tfw_misc.009.desc: "For generations, the lands of Forodwaith have been divided between distant peoples, rival realms, and isolated communities scattered across the frozen North. Mountains, wastes, forests, and icy seas kept them apart, and few rulers could claim authority beyond their own borders.\n\nNo longer. The realms of the North now stand beneath a single hegemony. From the shores of Forochel to the furthest reaches of the frozen wastes, the peoples of Forodwaith are bound together under one order.\n\nOnly once before has the North been united, and then it was beneath the cruel dominion of the Dark Lord Melkor. This time is different. Forodwaith stands together not through terror or chains, but through shared purpose, strength, and the will to build something greater than what came before. The North is united at last, and its future is its own."
 tfw_misc.009.a: "A new age dawns in the North."

 tfw_misc.010.t: "The Formation of Winter"
 tfw_misc.010.desc: "A new realm has arisen in the north. The lands and peoples of Winter now stand united beneath a single authority, and a new chapter in the history of the frozen wastes has begun."
 tfw_misc.010.a: "So it shall be."
 
 ### Into Events

 ### Talanthir
 tfw_intro.001.t: "The Abandoned Children of Ilúvatar"
 tfw_intro.001.desc: "The Adalantrim are some of the most peculiar peoples in [middleearth|e], [orcs|e] who have chosen to reject the darkness [morgothcharacter|e] inflicted upon them and instead work to create something new and whole out of the ruins. One of the biggest reasons for that is [ROOT.Char.GetFirstName]. \n\n[ROOT.Char.GetFirstName] was one of the [elves|e] who awoke at cuiveneien in the [elderdays|e], captured and tortured by [morgothcharacter|e] along with his kin until they were the [moriondor|e] the first of the [orcs|e], he survived the wars of the [firstage|e] with a mix of cunning, skill, and luck and has the honor of being the only one to survive. \n\nYet when [morgothcharacter|e] fell and the world was changed, when he approched the host of the [valargods|e] to beseech aid for his children he was turned back before even reaching [eonwecharacter|e], cast out by the people who should have been his champions. \n\nHe has spent the latter days working to heal his folk and turn them into more than mere slaves to the [darklord|e], taking in any [orc|e] who wanted something more, and turning the ruins left by the [valargods|e] into a true homeland for them"
 tfw_intro.001.a: "All that is broken can be made whole"

 ### Evermist
 tfw_intro.002.t: "The Noldor of Oiomure"
 tfw_intro.002.desc: "Hidden amid the frozen reaches of the Ered Rhivamar stands Oiomure, or Evermist in the common tongue. A hidden vale in the ruins of an ancient volcano. the land itself geothermally heated to warmth in even the coldest winters. Found by [ROOT.Char.GetName] during the [warofwrath|e], after the she lead a contingent of [noldorelves|e] to the valley and began to heal the scars of the war. \n\n For [ROOT.Char.GetFirstName] belived that her family and the [noldorelves|e] as a whole bared partial responsiblity for the destruction and thus must bare the responsiblity for its renewal. pledging to not rest until the world was purged of the taint of [morgothcharacter|e]"
 tfw_intro.002.a: "Until the Task is done"

 ### Lossidil
 tfw_intro.003.t: "The Lossidil of the Utter North"
 tfw_intro.003.desc: "The [lossidil|e] are a strange folk, decendents of Sindar fleeing destruction of Belariand and Nandor who had wandered into the far north, they crystalized into a cohesive whole before the end of the [firstage|e]. With the death of their king in the [warofwrath|e], the twin heirs [GetScriptedCharacterByHistoryID('tfw_lineoflossidil_celethrim_003').GetFirstName] and [GetScriptedCharacterByHistoryID('tfw_lineoflossidil_celethrim_004').GetFirstName] settled their people in the northern forest of [GetTitleByKey('k_taurethon').GetNameNoTier]. But they wouldn't all remain under the pines. \n\nIn the early days of the [secondage|e] upon seeing the beutiful Aurora for the first time [GetScriptedCharacterByHistoryID('tfw_lineoflossidil_celethrim_004').GetFirstName] bid her brother farewell and led a group of her people to discover the source of the beutiful light. upon one of the islands of the uttermost north they found it. the [beaconofhelecthil], a gift from [ulmocharacter|e], raised on an obsidion spire, shining the ancient light of the great Lamps into the skies. it was there under the light that she raised the second Lossidil realm, [GetTitleByKey('k_aurora_isles').GetName]."
 tfw_intro.003.a: "And here we stay."

 ### Frostwood
 tfw_intro.004.t: "The Refuge of Frostwood"
 tfw_intro.004.desc: "Frostwood was not always a kingdom.\n\nIn the Elder Days, Sairavel and Hwerin were war leaders among the Avari, fighting to preserve their people against enemies far greater than themselves. When that struggle ended in defeat, they led the survivors north and withdrew into the frozen forest that would become their refuge.\n\nWhat began as a sanctuary slowly became a realm.\n\nThe Windan settled the western reaches beneath Sairavel, while the Hwenti gathered in the east beneath Hwerin. The two peoples kept their own traditions, their own rulers, and their own ways, but they shared the memory of defeat and the knowledge that Frostwood existed because there had been nowhere else left to go.\n\nSince the Elder Days, Sairavel and Hwerin have ruled there together, husband and wife over two crowns. Generations have been born beneath the frozen boughs while the kingdoms of the outside world rose, fell, and passed into legend.\n\nFrostwood is no longer merely a refuge. It is their homeland now, defended by people who remember exactly what it cost to find one."
 tfw_intro.004.a: "We endured, and made a home of it."

 ### Story Events

 tfw_story.001.t: "The Foundling from the North"
 tfw_story.001.desc: "[ROOT.Char.GetFirstName] has just lost pretty much everything he had. a foundling who grew up on the cold ships of the [forodain|e], he came to consider the crew of his ship as the closest thing hes had to a family, that is until two days ago.\n\n Two days ago his ship was attacked by the elder Cold [drake|e] Faron, the bane of the north. She sunk his ship and killed most of the crew with [ROOT.Char.GetFirstName] and a few others left clinging to timbers. \n\nBut now is not the time for grief, now is the time for vengeance. The [dragon|e] sank the wrong ship and [ROOT.Char.GetFirstName] will not rest until shes dead."
 tfw_story.001.a: "I Shall Be Avenged!"

 tfw_story.002.t: "Tol Faron"
 tfw_story.002.desc: "The island rises from the cold sea like the back of some sleeping beast. Faron has ruled here for centuries. Her presence is written across the land. Blackened trees stand beside forests that have grown and burned and grown again beneath her shadow, bones of dead animals riddle the forest, and upon the tallest mountain of the island not a single green thing still grows. it is there in one of the cracks and caves left over from the Cataclysm of the Elder Days that the dragon sleeps upon her horde of stolen gold and its there i will either suceed or fail in my destiny"
 tfw_story.002.a: "I did not come here to turn back."

 tfw_story.003.t: "Among the Treasures of the Dead"
 tfw_story.003.desc: "Faron's hoard is older than the great kingdoms of the south. Gold lies in drifts across the cavern floor, mixed with silver cups, broken crowns, rusting armor, shattered shields, and treasures whose makers have been dust for thousands of years. Treasures who could have only come from the [elves|e] in their ancient war with [morgothcharacter|e]. \n\nOut of the corner of my eye i spot it, an ancient [noldorelves|e] Sword, Forged in [gondolin|e] in the [firstage|e]. its blade untouched by time and faintly shimering in the dark. a weapon forged precisely for my present purpose."
 tfw_story.003.a: "I shall call you Maegdaes"

 tfw_story.004.t: "The Cold-Drake"
 tfw_story.004.desc: "As i climb deeper into the caverns i finally spot my foe. The brilliant silver grey scales of the long sinuous [dragon|e] reflect the light of my torch. Faron is one of the truly ancient Wyrms and i only can see a portion of her bulk, the rest of her mass lays obscured in shadow and beneath the horde. But I spy her head poking up out of a pile of golden coins.\n\nIts now or never."
 tfw_story.004.a: "I jam my blade deep into her Eye"
 tfw_story.004.a.success: "The Dragon Falls"
 tfw_story.004.a.failure: "You Die"
 tfw_story.004.b: "I may have miscalculated."

 tfw_story.006.t: "Victory!"
 tfw_story.006.desc: "Faron lies slain before me, The great [dragon|e] of the [elderdays|e] is finally dead! her reign of terror across [forodwaith|e] is finally over! No longer do the [forodain|e] have to fear for our ships, no longer do we need to fear this island! Now it is time for us to reclaim what was stolen and for us to find solance in victory"
 tfw_story.006.a: "To the Victor go the spoils"

 tfw_story.007.t: "A New Dawn"
 tfw_story.007.desc: "The dragon is dead, my vengeance is saited, yet now is the matter of what to do next. word of the dragons fall will quickly spread across the north, leading to many a wanderer coming to claim a share of the loot if its not protected. which leaves me with a quandry. \n\nby ancient right to the victor go the spoils, this island is as much part of the spoils as the gold or the sword is. but do i want to claim it as my own"
 tfw_story.007.a: "King Graw has a nice ring to it"
 tfw_story.007.b: "There are still roads I have not walked."
 claim_tol_faron: "Claim Tol Faron as your Realm"