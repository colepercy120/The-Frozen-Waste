l_english:

 cleanse_angband_decision: "Cleanse Angband"
 cleanse_angband_decision_desc: "The shadow of [morgothcharacter|e] still clings to [angband|e]. Its halls, pits, and broken foundations remain stained by the evils committed there. Through immense devotion, labor, and sacrifice, we may finally begin the work of cleansing this ancient wound upon the world."
 cleanse_angband_decision_tooltip: "Undertake the sacred work of cleansing Angband of its lingering corruption."
 cleanse_angband_decision_confirm: "Begin the Cleansing"
 cleanse_angband_decision_tooltip_1: "You completely control the Angband fortress county, and no county in Angband has an evil-aligned ruler"
 cleanse_angband_decision_tooltip_2: "Every [county|e] in [GetTitleByKey('k_angband').GetName] is [wilderness|e]."
 cleanse_angband_decision_effect: "Angband is cleansed of darkness."

 heal_frostwood_decision: "Heal Frostwood"
 heal_frostwood_decision_desc: "[frostwood|e] has endured wounds that neither years nor winter could erase. Yet what has been scarred need not remain broken forever. With sufficient devotion and effort, the forests may be restored and the ancient land allowed to flourish once again."
 heal_frostwood_decision_tooltip: "Undertake the sacred work of restoring and healing Frostwood."
 heal_frostwood_decision_confirm: "Begin the Healing"
 heal_frostwood_decision_tooltip_1: "Every [county|e] in [GetTitleByKey('e_frostwood').GetName] is held by a good-aligned ruler."
 heal_frostwood_decision_effect: "The curse upon Frostwood is broken."

 unleash_angband_decision: "Unleash Angband"
 unleash_angband_decision_desc: "For too long, I have sat idle among the broken wastes of [melkorcharacter|e]'s realm. It is time for terror to spread across the North once more, and for [angband|e] to rise again!"
 unleash_angband_decision_tooltip: "Unleash Angband"
 unleash_angband_decision_confirm: "Raise a Great Host"
 unleash_angband_decision_effect: "Gain access to war declarations."

 decision_form_rast_losnath: "Form the Kingdom of Rast Losnath"
 decision_form_rast_losnath_desc: "Rast Losnath, the Cape of Biting Snow, is one of the coldest and most unforgiving places in [forodwaith|e]. Yet we have survived, and even thrived. Now that the cape is united, we can proclaim these lands a [kingdom|e], indivisible until the end of days."
 decision_form_rast_losnath_tooltip: "Form the Kingdom of Rast Losnath."
 decision_form_rast_losnath_confirm: "Proclaim the Kingdom of Rast Losnath"

 decision_form_muilfalas: "Form the Kingdom of Muilfalas"
 decision_form_muilfalas_desc: "Between the Bleak Mountains and the Forsaken Sea lies Muilfalas, the Bleak Coast. Though little more than a narrow coastal strip, the land holds strength. United, it could become a true power of the North."
 decision_form_muilfalas_tooltip: "Form the Kingdom of Muilfalas."
 decision_form_muilfalas_confirm: "Proclaim the Kingdom of Muilfalas"

 decision_form_gaurmar: "Reclaim Our Homeland!"
 decision_form_gaurmar_desc: "Long ago, we lived in the dales and valleys of [angmar|e], before the Angmarrim and the [witchking|e] drove us into the frozen wastes. The time has come to make our glorious return!"
 decision_form_gaurmar_tooltip: "Form the Kingdom of Gaurmar."
 decision_form_gaurmar_confirm: "Proclaim the Kingdom of Gaurmar"

 decision_form_fordor: "Unite the Forodain"
 decision_form_fordor_desc: "Since the Downfall, our people have been scattered across the shattered lands of the North, barely scraping by while the fortunes of our southern kin waxed and waned. If we wish to stand alongside [gondor|e], [arnor|e], or even [umbar|e], we must unite and carve our own path through the world."
 decision_form_fordor_tooltip: "Unite the Forodain"
 decision_form_fordor_confirm: "Proclaim the High Kingdom of Fordor"
 unite_forodain_effect_tooltip: "[GetTitleByKey('e_fordor').GetName] will become [de_jure|e] liege of every [kingdom|e] in [GetGeographicalRegion('custom_greater_forochel').GetName]"
 unite_forodain_tooltip: "At least 95% of the [counties|e] of [GetPlayer.GetCulture.GetName] [culture|e] are ruled by [GetPlayer.GetName] or their vassals."

 decision_form_lossoth: "Unite the Lossoth"
 decision_form_lossoth_desc: "For generations, the [lossoth|e] have endured the frozen shores of [forochel|e] as scattered tribes and petty realms, divided by distance, custom, and old rivalries. Yet no matter how far apart our people have grown, we remain bound by the same harsh land, the same ancient traditions, and the same struggle to survive beneath the northern sky.\n\nThe time has come to bring the Lossoth together beneath a single banner. If we are to endure the dangers of the North and command the respect of the realms beyond the ice, then the people of Forochel must stand as one."
 decision_form_lossoth_tooltip: "Unite the Lossoth"
 decision_form_lossoth_confirm: "Unite the Lossoth"
 unite_lossoth_effect_tooltip: "[GetTitleByKey('e_lossoth').GetName] will become [de_jure|e] liege of every [kingdom|e] in [GetGeographicalRegion('custom_greater_forochel').GetName]"
 unite_lossoth_tooltip: "At least 95% of the [counties|e] of [GetPlayer.GetCulture.GetName] [culture|e] are ruled by [GetPlayer.GetName] or their vassals."

 decision_form_forochel: "Unite the Bay of Forochel"
 decision_form_forochel_desc: "The shores of the Bay of [forochel|e] have long been divided between scattered clans, coastal settlements, and rival chieftains. Though the sea and ice bind us together, old feuds and local loyalties have kept the peoples of the bay apart.\n\nThat division can no longer continue. The coasts of Forochel must be brought beneath a single rule, so that its harbors, hunting grounds, and settlements may stand together against whatever threats come from beyond the frozen sea or the wastes inland."
 decision_form_forochel_tooltip: "Unite the peoples and settlements of the Bay of Forochel under one ruler"
 decision_form_forochel_confirm: "The Bay shall stand united"
 decision_form_forochel_effect: "[GetTitleByKey('e_forochel').GetName] will become [de_jure|e] liege of every [kingdom|e] in [GetGeographicalRegion('custom_greater_forochel').GetName]"

 decision_form_northern_territories: "Secure the Utter North"
 decision_form_northern_territories_desc: "The farthest reaches of the North remain divided between scattered realms, distant settlements, and lands only loosely bound to the greater powers of [forodwaith|e]. Though these territories have long stood apart, their isolation leaves them vulnerable and weakens the authority of any realm that would claim dominion over the North.\n\nThe time has come to bring these lands into a broader order. By extending our rule across the Utter North, we can bind its peoples and territories into the existing realm and ensure that no corner of Forodwaith stands beyond our reach."
 decision_form_northern_territories_tooltip: "Integrate the territories of the Utter North into your hegemony"
 decision_form_northern_territories_confirm: "Secure the Utter North"
 secure_the_north_effect: "Kingdoms with capitals in Forodwaith become de jure vassals of the Northern Territories."

 decision_form_avari: "Unite the Avari"
 decision_form_avari_desc: "For too long, the [avari|e] have been scattered across [middleearth|e]. If we reunite the ancient houses of our people and proclaim a united realm, we need no longer fear the [darklord|e] or the abuses of [men|e] and [dwarves|e]. Even the [eldar|e] would have to respect our strength."
 decision_form_avari_tooltip: "Form the Hegemony of Avari."
 decision_form_avari_confirm: "Proclaim the Hegemony of Avari"

 decision_form_forodwaith: "Unite Forodwaith"
 decision_form_forodwaith_desc: "None since [melkorcharacter|e] has dared to unite the Utter North. These vast frozen lands may be inhospitable to most, but they are our home, and our home should stand united. Though we come from different peoples, we have turned the ruins of the [elderdays|e] into realms worthy of any in [middleearth|e]."
 decision_form_forodwaith_tooltip: "Unite Forodwaith"
 decision_form_forodwaith_confirm: "Unite Forodwaith"

 decision_form_winter: "Form the Hegemony of Winter"
 decision_form_winter_desc: "Our supremacy across the north can no longer be denied. We shall establish the Hegemony of Winter."
 decision_form_winter_tooltip: "Form the Hegemony of Winter."
 decision_form_winter_confirm: "Proclaim the Hegemony of Winter"

 decision_build_nidavillir: "Construct a Great Hold"
 decision_build_nidavillir_desc: "Our expedition to the Ered Muil has borne fruit. We have established ourselves in these halls, and now we must plan for the future. It is time to decide what shape our great hold will take, and what kind of people we will become."
 decision_build_nidavillir_tooltip: "Construct a Great Hold"
 decision_build_nidavillir_confirm: "Draw up the plans"
 decision_build_nidavillir_effect: "You will choose a new name and coat of arms for [GetTitleByKey('k_nidavellir').GetName]."
 decision_build_nidavillir_effect_2: "You will choose a [great_building|e] to construct in [GetTitleByKey('c_nidavellir_1').GetName]."

 start_long_winter_decision: "Start the Long Winter"
 start_long_winter_decision_desc: "The [darklord|e] has called in an ancient favor, asking me to cast a curse of winter upon the South. The timing remains mine to choose. Is it time to unleash [sauroncharacter|e]'s winter?"
 start_long_winter_decision_tooltip: "Start the Long Winter"
 start_long_winter_decision_confirm: "Cast the Arctic Winds"
 start_long_winter_decision_trigger: "The current month is September through March."
 start_long_winter_decision_effect: "The Long Winter begins."

