 cleanse_angband_decision: "Cleanse Angband"
 cleanse_angband_decision_desc: "The shadow of Morgoth still clings to Angband. Its halls, pits, and broken foundations remain stained by the evils committed there. Through immense devotion, labor, and sacrifice, we may finally begin the work of cleansing this ancient wound upon the world."
