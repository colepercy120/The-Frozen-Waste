 cleanse_angband_decision_effect: "Angband Is Cleansed of Darkness"

 heal_frostwood_decision: "Heal Frostwood"
 heal_frostwood_decision_desc: "Frostwood has endured wounds that neither years nor winter could erase. Yet what has been scarred need not remain broken forever. With sufficient devotion and effort, the forests may be restored and the ancient land allowed to flourish once again."
