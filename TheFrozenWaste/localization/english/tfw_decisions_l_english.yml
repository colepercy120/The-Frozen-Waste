 tfw_embrace_elven_restoration_decision: "Embrace Redemption"
 tfw_embrace_elven_restoration_decision_desc: "Our prayers have been answered. The Creator has freed us from the taint of [melkorcharacter|e], and the time has come to join our brethren in the light once more."
 tfw_embrace_elven_restoration_decision_tooltip: "Embrace Redemption"
 tfw_embrace_elven_restoration_decision_confirm: "Embrace Redemption"
