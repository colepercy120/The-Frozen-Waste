l_english:
 tfw_santa_001_name: "Annahir"
 nick_tfw_father_christmas: "Father Christmas"
 nick_tfw_father_christmas_desc: "Annahir, the lord of gifts, is a Maiar who resides in the uttermost north, known to travel south every Yule delivering gifts to the virtuous, his name and reputation were used by [sauroncharacter|e] to deceive the elves into forging the rings of power"
 h_tfw_santa_host: "Host of the Gift Lord"
 h_tfw_santa_host_adj: "Gift Lord's"
 tfw_santa_intervention: "Annahir, Father Christmas"
 setting_tfw_santa_intervention: "Annahir, Father Christmas"
 setting_tfw_santa_intervention_desc: "If an evil ruler comes to dominate Middle-earth, Annahir arrives from the uttermost North with gifts for the virtuous and an army to challenge the Shadow."
 tfw_santa_landing_modifier: "Arrival of the Gift Lord"
 tfw_santa_landing_modifier_desc: "The Gift Lord's followers have brought supplies, craftspeople and renewed prosperity to this landing place."
 tfw_santa_invasion_army_name: "The Gift Lord's Host"
 TFW_SANTA_HOST_LANDING_WAR_NAME: "The Arrival of Father Christmas"
 TFW_SANTA_HOST_LANDING_CB_NAME: "Arrival of the Gift Lord"
 tfw_santa_invasion_victory_desc: "The Gift Lord takes the lands of the defeated realm in the far North, drawing aligned rulers into his new order and replacing those who resist."
 tfw_santa_invasion_defeat_desc: "The Gift Lord's invasion is repelled, and his captured lands return to the victorious defender."
 tfw_santa_invasion.0001.t: "Father Christmas Has Come"
 tfw_santa_invasion.0001.desc: "From beyond the ice of the uttermost North comes a strange host, laden with gifts and marching beneath festive banners. Annahir, whom many call Father Christmas, has come to answer the growing power of the Shadow. He promises gifts to the virtuous, and the overthrow of those who would rule through fear. Yet behind the kindly words stands an army that will not be turned away."
 tfw_santa_invasion.0001.a: "A curious sort of generosity."
