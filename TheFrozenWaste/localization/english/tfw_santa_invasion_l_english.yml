 nick_tfw_gift_lord: "the Gift Lord"
 h_tfw_santa_host: "Host of the Gift Lord"
 h_tfw_santa_host_adj: "Gift Lord's"
 tfw_santa_intervention: "Santa, the Gift Lord"
 setting_tfw_santa_intervention: "Santa, the Gift Lord"
 setting_tfw_santa_intervention_desc: "When a single power dominates Middle-earth, Santa arrives from the far North, bringing the Gift Lord's bounty to those who will accept it and war to those who resist."
 tfw_santa_landing_modifier: "Arrival of the Gift Lord"
 tfw_santa_landing_modifier_desc: "The Gift Lord's followers have brought supplies, craftspeople and renewed prosperity to this landing place."
 tfw_santa_invasion_army_name: "The Gift Lord's Host"
 TFW_SANTA_HOST_LANDING_WAR_NAME: "The Gift Lord's Arrival"
 TFW_SANTA_HOST_LANDING_CB_NAME: "Arrival of the Gift Lord"
 tfw_santa_invasion_victory_desc: "The Gift Lord takes the lands of the defeated realm in the far North, drawing aligned rulers into his new order and replacing those who resist."
 tfw_santa_invasion_defeat_desc: "The Gift Lord's invasion is repelled, and his captured lands return to the victorious defender."
 tfw_santa_invasion.0001.t: "The Gift Lord Has Come"
 tfw_santa_invasion.0001.desc: "From beyond the ice of the uttermost North comes a strange host, laden with gifts and marching beneath festive banners. Its master calls himself Santa, the Gift Lord, and declares that no throne is too proud to receive his generosity. His followers speak of kindness and plenty, yet their arrival is backed by an army that will not be turned away."
 tfw_santa_invasion.0001.a: "A curious sort of generosity."
