l_english:
 tfw_e_winter_court_crown_name: "Crown of the Winter Queen"
 tfw_e_winter_court_crown_description: "Nixni fashioned this crown in [angband|E] from a single piece of enchanted ice. The blue depths of the circlet are quite clear, and through them may be seen the fine cracks left by the Winter Queen's fingers when she bent it to the shape of her brow."
 tfw_e_winter_court_weapon_name: "Ringmegil"
 tfw_e_winter_court_weapon_description: "The sword of Nixni, Queen of Winter. Its blade is of the same ice as her crown, though at the edge it is so thin that the colour is lost altogether. The smiths of [angband|E] made the iron hilt. None among them could set an edge on the blade, which Nixni sharpened herself."
 tfw_e_ered_rhivamar_crown_name: "Iron Crown of the Adalantrim"
 tfw_e_ered_rhivamar_crown_description: "The royal crown of the Adalantrim was wrought from the iron collar Talanthir had worn in bondage. The smith cut away the lock and beat three points from the upper rim, but left the hinge and a single broken link. On the inside of the band the old rivet holes can still be felt."
 tfw_e_ered_rhivamar_weapon_name: "Eithelrist"
 tfw_e_ered_rhivamar_weapon_description: "An [elven|E] longsword looted from [gondolin|E] when the city fell in the [firstage|E]. A fountain in silver wire adorns the guard, though the name of the Elf who bore it has been lost.\n\nThe sword was carried north among the spoils of the city. By the time it came into Talanthir's hands its jewelled scabbard had been stripped for the stones. The blade itself was still keen, and Talanthir had a plain iron-bound sheath made for it."
 tfw_k_angband_crown_name: "Castellan's Crown of Angband"
 tfw_k_angband_crown_description: "This heavy circlet belonged to the keeper of the lower gates of [angband|E]. Its teeth are cast in the likeness of the iron uprights of the gate. A second band was riveted inside it when it passed from the great helm of the castellan to the rulers of the fortress."
 tfw_k_angband_weapon_name: "Anghathol"
 tfw_k_angband_weapon_description: "A bearded axe from the armouries of [angband|E]. The mark struck into its cheek occurs also on the hinges of the lower gates. Both are attributed to the smiths who once supplied the household of the castellan."
 tfw_k_winter_queen_faith_crown_name: "Mitre of the Frozen Throne"
 tfw_k_winter_queen_faith_crown_description: "A narrow silver crown worn by the head of the Winter Queen's faith. The white stones about the band are polished rock crystal. An old inventory of the shrine values the silver at very little, but counts and names every stone."
 tfw_k_winter_queen_faith_weapon_name: "Aeglosson"
 tfw_k_winter_queen_faith_weapon_description: "The ceremonial spear of the Frozen Throne has a head of pale steel and a socket long enough to take a standard. Fragments of blue silk beneath the binding are all that survive of the first banner dedicated at Nixni's shrine."
 tfw_k_durnost_crown_name: "War Crown of Durnost"
 tfw_k_durnost_crown_description: "The kings of Durnost wear this broad iron band over a cap of hide. The earliest clan mark is almost hidden beneath the plate of a later king, whose smith found it easier to cover the old device than to chisel it away."
 tfw_k_durnost_weapon_name: "Gurthangren"
 tfw_k_durnost_weapon_description: "A heavy [orcish|E] sword taken from the hoard of the Black Fang clan. The Red Maw and the Ash Tusk have each held it since. All three claim to have forged it, and between their several marks little of the original tang remains visible."
 tfw_k_nidavellir_crown_name: "King's Fillet of Nidavellir"
 tfw_k_nidavellir_crown_description: "Seven pieces of gold are joined so closely in this [dwarven|E] crown that the seams can be found only on the underside. Each piece bears a different maker's mark. The kings of Nidavellir have traditionally kept the names of the seven in the reckoning of their royal smiths."
 tfw_k_nidavellir_weapon_name: "Hadhodrist"
 tfw_k_nidavellir_weapon_description: "The long cutting edge of this [dwarven|E] axe is steel welded to a softer iron head. A row of silver runes gives the weight of the metal and the fee paid by the king of Nidavellir. The smith seems to have regarded both as worth recording."
 tfw_k_aurora_isles_crown_name: "Pearl Crown of Helecthil"
 tfw_k_aurora_isles_crown_description: "The circlet worn by the rulers of the Aurora Isles is set with small grey pearls from the waters about Helecthil. One place above the brow was made for a pearl of exceptional size. It was lost at sea, and the setting has stood empty ever since."
 tfw_k_aurora_isles_weapon_name: "Gaearaeg"
 tfw_k_aurora_isles_weapon_description: "An island spear with a long leaf-shaped head of [elven|E] steel. It belonged to the household guard at Helecthil before the lords of the isles took it to sea. The silver ferrule bears the old harbour mark used on fittings belonging to the royal ships."
 tfw_k_taurethon_crown_name: "Beech Crown of Taurethon"
 tfw_k_taurethon_crown_description: "The crown of Taurethon is wrought in the likeness of a beech spray in winter. The slender twigs are silver, but the closed buds are of reddish copper. They have darkened with age wherever the hands of successive wearers have left them untouched."
 tfw_k_taurethon_weapon_name: "Ech Brethil"
 tfw_k_taurethon_weapon_description: "A silver band at the socket identifies this spear as the property of the marchwardens of Taurethon. Its birchwood shaft was cut to the measure of their woodland paths, where the longer spears used in open battle were apt to catch among the branches."
 tfw_k_evermist_crown_name: "Circlet of Evermist"
 tfw_k_evermist_crown_description: "Fëanor wrought this gold circlet in [valinor|E] for the household of his son Caranthir. The red jewel above the brow is held by eight small claws in the form of the star of his house. Vorwen brought the circlet to Evermist, where it became the crown of her realm."
 tfw_k_evermist_weapon_name: "Carnist"
 tfw_k_evermist_weapon_description: "The sword of Caranthir, fourth son of Fëanor. Forged by his father in [valinor|E], it was carried across the sea in the [exileofthenoldor|E] and borne by Caranthir during his lordship in Thargelion. The garnets in its pommel are of later workmanship, set by the Dwarves with whom he traded in the east of [beleriand|E].\n\nAfter Caranthir's death his sword passed to his daughter Vorwen. She bears it in Evermist, still fitted with the dark leather grip her father favoured."
 tfw_k_tol_faron_crown_name: "Founder's Crown of Tol Faron"
 tfw_k_tol_faron_crown_description: "Graw's crown is an open band of bronze, ornamented with a running hart. The die used to strike the hart was afterwards used on the clasps of his household. The impression on the crown is the earliest, taken before a flaw appeared in the antlers."
 tfw_k_tol_faron_weapon_name: "Rassvegil"
 tfw_k_tol_faron_weapon_description: "The hunting spear of Tol Faron has a crosspiece of antler below the blade. Graw bore it before he held the island, and it appears beside him on his early seal, where a later king would ordinarily be shown with a sword."
 tfw_k_ered_rhivamar_crown_name: "Crown of the Mountain Gate"
 tfw_k_ered_rhivamar_crown_description: "A low circlet of iron faced with silver, once worn by the lord who kept the approaches to Ered Rhivamar. Part of the silver facing was cut away to pay his garrison during a siege. Later kings have kept the worn iron exposed."
 tfw_k_ered_rhivamar_weapon_name: "Andrathrist"
 tfw_k_ered_rhivamar_weapon_description: "A broad sword carried by the wardens of the high pass in Ered Rhivamar. Its scabbard is faced with horn against the damp. Beneath the horn survives a strip of an older sheath, stamped with the toll mark of the mountain gate."
 tfw_k_northern_iron_mountains_crown_name: "Crown of the Ironmasters"
 tfw_k_northern_iron_mountains_crown_description: "This crown was made from the first iron drawn from a royal working in the Northern Iron Mountains. The band has since been lined with gold, but the outer face still bears the scale left when the iron cooled."
 tfw_k_northern_iron_mountains_weapon_name: "Angaeg"
 tfw_k_northern_iron_mountains_weapon_description: "The kings of the Northern Iron Mountains inherited this spear from the guard of the royal mines. Its stout iron shoe allowed it to serve as a staff on the steep road between the workings and the high hall."
 tfw_k_angband_reach_crown_name: "Tower Crown of the Reach"
 tfw_k_angband_reach_crown_description: "A mural crown worn by the lords of Angband Reach. Its front preserves the outline of a ruined watchtower, down to the low eastern parapet by which the garrison once entered from the hillside."
 tfw_k_angband_reach_weapon_name: "Berthamegil"
 tfw_k_angband_reach_weapon_description: "This short sword was recovered from a fallen tower on the marches of [angband|E]. Its guard is turned sharply towards the blade on one side, a fashion favoured by the men who fought on the narrow stairs of the watch."
 tfw_k_komi_crown_name: "Ivory Crown of Komi"
 tfw_k_komi_crown_description: "The pale plaques of this crown were cut from a single tusk and sewn to a band of hide. The hide has been renewed many times. On the back of each plaque an Umli craftsman cut a number so the old order could be restored."
 tfw_k_komi_weapon_name: "Forodhathol"
 tfw_k_komi_weapon_description: "A broad axe of Komi, distinguished by the walrus ivory at the butt of its haft. The ivory bears a brief account of the tribute paid to its first owner, from which the royal reckoners have settled more than one dispute."
 tfw_k_west_frostwood_crown_name: "Crown of the Western Wood"
 tfw_k_west_frostwood_crown_description: "The lords of West Frostwood wore this circlet when receiving the kindreds of the forest. Its overlapping copper leaves once covered the whole band. Two were removed to furnish clasps for a treaty, one for each copy."
 tfw_k_west_frostwood_weapon_name: "Annúnrist"
 tfw_k_west_frostwood_weapon_description: "An [elven|E] sword of West Frostwood, readily known by the copper beech leaf let into its guard. The same device appears on the boundary stones of the western wood, where the blade was formerly borne at the yearly riding of the bounds."
 tfw_k_east_frostwood_crown_name: "Crown of the Eastern Wood"
 tfw_k_east_frostwood_crown_description: "Pairs of amber beads are set between the silver leaves of this crown. The greatest pair came from a single piece split by the lapidary. The same small winged fly may be seen from either side when the halves are held together."
 tfw_k_east_frostwood_weapon_name: "Amrûnaeg"
 tfw_k_east_frostwood_weapon_description: "This slender spear belonged to the guard of the eastern eaves of Frostwood. The bronze sun upon its socket was once gilded. A little gold survives beneath the rim where the leather cover protected it on the march."
 tfw_tareg_weapon_name: "Thangrist"
 tfw_tareg_weapon_description: "Tareg's sword was found with him beneath the ice. The scabbard had perished, leaving its bronze fittings frozen beside the bare blade. Of the inscription upon the steel only the name Thangrist could still be read."
 tfw_annahir_weapon_name: "Ech Girith"
 tfw_annahir_weapon_description: "Annahir's spear is called Ech Girith, the Quivering Spear. The name renders the northern Gungnir into the speech of the Grey-elves. Its head is of bright steel on a shaft of ash, which is said to tremble in the hand of the Gift Lord even when he holds it at rest."
