l_english:
 tfw_e_winter_court_crown_name:0 "Rî Rîw"
 tfw_e_winter_court_crown_description:0 "Known as the Crown of Winter. Eight narrow points rise like ice along a window ledge."
 tfw_e_winter_court_weapon_name:0 "Ringrist"
 tfw_e_winter_court_weapon_description:0 "Cold-cleaver. The fuller stays white with rime even beside the queen’s hearth."
 tfw_e_ered_rhivamar_crown_name:0 "Rî Giliath"
 tfw_e_ered_rhivamar_crown_description:0 "Known as the Crown of Stars. A star is punched into the band for each pass sworn to the high throne."
 tfw_e_ered_rhivamar_weapon_name:0 "Gilcrist"
 tfw_e_ered_rhivamar_weapon_description:0 "Star-cleaver. Silver stars run down the fuller, worn smooth near the guard where generations of rulers laid a thumb."
 tfw_k_angband_crown_name:0 "Rî Angband"
 tfw_k_angband_crown_description:0 "Known as the Crown of Iron Prison. Black iron uprights echo the bars of the fortress gates."
 tfw_k_angband_weapon_name:0 "Angristor"
 tfw_k_angband_weapon_description:0 "Iron hewer. The hooked beard bears dents from the iron rim of a rebel’s shield."
 tfw_k_winter_queen_faith_crown_name:0 "Rî Nîf"
 tfw_k_winter_queen_faith_crown_description:0 "Known as the Crown of Pallor. The celebrant’s pale circlet catches candlelight through flakes of translucent stone."
 tfw_k_winter_queen_faith_weapon_name:0 "Ech Nim"
 tfw_k_winter_queen_faith_weapon_description:0 "White spear. A white pennon wraps the shaft during the winter rites."
 tfw_k_durnost_crown_name:0 "Rî Dûr"
 tfw_k_durnost_crown_description:0 "Known as the Crown of Darkness. Overlapping black plates let the smith widen the crown for each new master of Durnost."
 tfw_k_durnost_weapon_name:0 "Morgrist"
 tfw_k_durnost_weapon_description:0 "Dark cleaver. Short and heavy, the blade has room on its tang for the marks of rival clans."
 tfw_k_nidavellir_crown_name:0 "Rî Gond"
 tfw_k_nidavellir_crown_description:0 "Known as the Crown of Stone. The square-cut stones fit so closely that a fingernail can barely find the joins."
 tfw_k_nidavellir_weapon_name:0 "Gondrist"
 tfw_k_nidavellir_weapon_description:0 "Stone-cleaver. The smith left a seam of dark metal visible along the beard, like an ore vein crossing bare rock."
 tfw_k_aurora_isles_crown_name:0 "Rî Calad"
 tfw_k_aurora_isles_crown_description:0 "Known as the Crown of Light. Polished slivers of shell catch the shifting northern lights."
 tfw_k_aurora_isles_weapon_name:0 "Ech Galad"
 tfw_k_aurora_isles_weapon_description:0 "Gleam of light. A blue cord binds the grip so a watcher can hold it with wet hands above the surf."
 tfw_k_taurethon_crown_name:0 "Rî Taur"
 tfw_k_taurethon_crown_description:0 "Known as the Crown of Forest. Each silver leaf turns separately on its pin when the wearer moves."
 tfw_k_taurethon_weapon_name:0 "Ech Daur"
 tfw_k_taurethon_weapon_description:0 "Forest spear. The long ash shaft carries a notch for every winter the border watch held its ground."
 tfw_k_evermist_crown_name:0 "Rî Hîth"
 tfw_k_evermist_crown_description:0 "Known as the Crown of Mist. Fine grey wire veils the brow stone until light reaches it from the side."
 tfw_k_evermist_weapon_name:0 "Crist Hîth"
 tfw_k_evermist_weapon_description:0 "Mist blade. Beads of mist gather on the steel and follow the shallow grooves to the point."
 tfw_k_tol_faron_crown_name:0 "Rî Faron"
 tfw_k_tol_faron_crown_description:0 "Known as the Crown of Hunter. Small antler tines clasp a band darkened by the oil of many hands."
 tfw_k_tol_faron_weapon_name:0 "Ech Faron"
 tfw_k_tol_faron_weapon_description:0 "Hunter’s spear. A boar’s tusk forms the toggle on the wrist loop, polished by years of hunting from the island shore."
 tfw_k_ered_rhivamar_crown_name:0 "Rî Ered"
 tfw_k_ered_rhivamar_crown_description:0 "Known as the Crown of Mountains. The serrated rim follows the peaks as they appear from the royal gate."
 tfw_k_ered_rhivamar_weapon_name:0 "Crist Oron"
 tfw_k_ered_rhivamar_weapon_description:0 "Mountain blade. The stone set in the pommel came from the first cairn on the road over the pass."
 tfw_k_northern_iron_mountains_crown_name:0 "Rî Ang"
 tfw_k_northern_iron_mountains_crown_description:0 "Known as the Crown of Iron. The iron band bears the hammer strokes of the mountain smiths."
 tfw_k_northern_iron_mountains_weapon_name:0 "Ech Angren"
 tfw_k_northern_iron_mountains_weapon_description:0 "Iron spear. A broad iron shoe keeps the shaft steady on the loose stone of the high passes."
 tfw_k_angband_reach_crown_name:0 "Rî Ram"
 tfw_k_angband_reach_crown_description:0 "Known as the Crown of Wall. Little crenellations cast a row of square shadows across the wearer’s brow."
 tfw_k_angband_reach_weapon_name:0 "Crist Ram"
 tfw_k_angband_reach_weapon_description:0 "Wall blade. Narrow enough for a crowded parapet, the blade has a thick guard to protect the hand above the stones."
 tfw_k_komi_crown_name:0 "Rî Loss"
 tfw_k_komi_crown_description:0 "Known as the Crown of Snow. White stones stand proud of the band like the first snow on a ridge."
 tfw_k_komi_weapon_name:0 "Lossrist"
 tfw_k_komi_weapon_description:0 "Snow-cleaver. The haft is wrapped in pale hide, with a long loop for a mittened hand."
 tfw_k_west_frostwood_crown_name:0 "Rî Annûn"
 tfw_k_west_frostwood_crown_description:0 "Known as the Crown of Sunset. The copper leaves glow red when the evening sun enters the western hall."
 tfw_k_west_frostwood_weapon_name:0 "Dúnrist"
 tfw_k_west_frostwood_weapon_description:0 "West-cleaver. A red stone set low in the guard catches the last light under the canopy."
 tfw_k_east_frostwood_crown_name:0 "Rî Amrûn"
 tfw_k_east_frostwood_crown_description:0 "Known as the Crown of Sunrise. Amber buds open between the leaves along the eastern ruler’s brow."
 tfw_k_east_frostwood_weapon_name:0 "Ech Amrûn"
 tfw_k_east_frostwood_weapon_description:0 "Spear of sunrise. The spearhead bears a sunburst so fine that each ray disappears when viewed edge-on."
 tfw_tareg_weapon_name:0 "Crist Rhîw"
 tfw_tareg_weapon_description:0 "Winter blade. When Tareg stirred beneath the ice, his hand was still closed around the grip. A thin black line on the steel marks how far the blade stood clear of the glacier."
 tfw_annahir_weapon_name:0 "Ech Ann"
 tfw_annahir_weapon_description:0 "Spear of the gift. Children tie ribbons beneath Annahir’s bright spearhead when he visits their hearths. He leaves the knots in place when he goes to war."
