l_english:
 tfw_e_winter_court_crown_name:0 "The Crown of the Unthawing Winter"
 tfw_e_winter_court_crown_description:0 "Nixni lifted a hoop of clear ice from a black pool beneath Angband and spoke over it until eight points rose between her fingers. At her first winter feast it froze the cushion to the throne. The servants have carried it on iron hooks ever since."
 tfw_e_winter_court_weapon_name:0 "Helegrist"
 tfw_e_winter_court_weapon_description:0 "Nixni drew the Ice-cleaver from the same pool as her crown. A swordsmith once set it in his furnace to see what edge lay beneath the ice. By morning the coals were frozen together and the blade still bore his thumbprint."
 tfw_e_ered_rhivamar_crown_name:0 "The Crown of the Adalantrim"
 tfw_e_ered_rhivamar_crown_description:0 "When the Adalantrim chose Talanthir as their king, he brought the smith the iron collar he had worn in bondage. She struck out the lock, widened the band to fit his brow, and hammered three low points into its rim. At his asking she left the last broken link in place. When he bowed his head to receive his people’s oaths, they heard it strike the iron."
 tfw_e_ered_rhivamar_weapon_name:0 "Gilrist"
 tfw_e_ered_rhivamar_weapon_description:0 "Talanthir carried Star-cleaver when he went from hall to hall to hear the mountain lords. At the last gate he drove its point into the threshold and heard both sides of a blood feud before he drew it out. The tip still bends a little to the left."
 tfw_k_angband_crown_name:0 "The Crown of the Iron Doors"
 tfw_k_angband_crown_description:0 "The keepers of Angband made this circlet from the hinges of a fallen gate. When a new lord first enters the fortress, the captain turns the crown in his hands and asks which door he means to hold."
 tfw_k_angband_weapon_name:0 "Angristel"
 tfw_k_angband_weapon_description:0 "The first warden of the Iron Doors lost his axe breaking a siege ladder. His armourer fitted the broken head with a deep new beard. Its inner hook is still just wide enough to catch a ladder rung."
 tfw_k_winter_queen_faith_crown_name:0 "The Pale Chaplet"
 tfw_k_winter_queen_faith_crown_description:0 "During the long vigil before Nixni’s altar, the lamps failed one by one. The last watcher found enough light in the pale stones of her chaplet to finish the office. Since that night her successors have kept the vigil by its light alone."
 tfw_k_winter_queen_faith_weapon_name:0 "Nimthel"
 tfw_k_winter_queen_faith_weapon_description:0 "The White Point once carried the winter sanctuary’s bell through a storm. The bell was lost when the bearer crossed the last drift. Those who follow the spear in falling snow still listen for it."
 tfw_k_durnost_crown_name:0 "The Crown of the Three Tusks"
 tfw_k_durnost_crown_description:0 "Three rival chiefs came armed to the first moot at Durnost. Each broke a tusk from his own war helm and drove it through the other two chiefs’ iron bands. The bands can slide to fit a new brow. The tusks still hold them together."
 tfw_k_durnost_weapon_name:0 "Morrist"
 tfw_k_durnost_weapon_description:0 "A Red Maw smith ground the teeth from a captured saw to make Dark-cleaver. An Ash Tusk chief won it from him at the ford and added the first clan mark. There are now so many on the tang that the grip scarcely fits."
 tfw_k_nidavellir_crown_name:0 "The Diadem of the Deep Measure"
 tfw_k_nidavellir_crown_description:0 "A mason of Sindri’s line cut the first stone as a gauge for the vault above the royal hall. When the centring came down, the king set the gauge in his own brow-band. The vault still stands to its measure."
 tfw_k_nidavellir_weapon_name:0 "Gonnhast"
 tfw_k_nidavellir_weapon_description:0 "Stone-hewer opened a way through a fall in the lower galleries. The miners who came out last set a thread of silver in the crack along its cheek. Their descendants renew the thread whenever it wears thin."
 tfw_k_aurora_isles_crown_name:0 "The Crown of the Northern Lights"
 tfw_k_aurora_isles_crown_description:0 "When the harbour fires of Helecthil went out, a fisherwoman brought the royal ship home by the lights in the northern sky. The queen took the pearl comb from her own hair and had its shell set in this circlet in the pilot’s honour."
 tfw_k_aurora_isles_weapon_name:0 "Gilvegil"
 tfw_k_aurora_isles_weapon_description:0 "The islanders call this spear Star-blade for the sliver of bright metal in its socket. Lashed to an oar above the stern, it caught the light that guided the last boat through the ice off Helecthil."
 tfw_k_taurethon_crown_name:0 "The Crown of the Listening Boughs"
 tfw_k_taurethon_crown_description:0 "The leaf-smith of Taurethon hung each silver leaf on a separate pin. Its first bearer learned to walk so softly that none stirred. The wardens still listen for the leaves when their ruler comes to inspect the forest watch."
 tfw_k_taurethon_weapon_name:0 "Taurthela"
 tfw_k_taurethon_weapon_description:0 "When fire drove the watch out of the southern wood, its captain cut a living ash pole to carry his spearhead home. A single bud opened beside his hand that spring. A silver leaf now marks its place."
 tfw_k_evermist_crown_name:0 "The Circlet of the Banked Flame"
 tfw_k_evermist_crown_description:0 "Fëanor made this circlet in Tirion before the Exile. He set the red stone deep in its silver cup, where the light seems almost spent until the wearer turns her head. Caranthir carried it east, and in Evermist his daughter Vorwen wears it still."
 tfw_k_evermist_weapon_name:0 "Nauril"
 tfw_k_evermist_weapon_description:0 "Fëanor forged this slender blade and cut his mark on the tang, where only the hand that renewed the grip would find it. Vorwen knew it first as her father Caranthir’s sword. She found her grandfather’s mark herself when the old leather gave way in Evermist."
 tfw_k_tol_faron_crown_name:0 "The Hart’s Crown of Tol Faron"
 tfw_k_tol_faron_crown_description:0 "Graw’s companions brought him the antlers of the white hart they had followed to fresh water. He kept the tips when the first hall rose on Tol Faron. Its rulers still wear them above the brow at the opening of the hunt."
 tfw_k_tol_faron_weapon_name:0 "Arasthel"
 tfw_k_tol_faron_weapon_description:0 "The hunters of Tol Faron carried this spear in pairs across the bog, one man bearing it while the other tested the ground. A boar’s tusk at the wrist loop remembers the hunt from which only the spear came home."
 tfw_k_ered_rhivamar_crown_name:0 "The Passwarden’s Crown"
 tfw_k_ered_rhivamar_crown_description:0 "Each new keeper of the pass took a rubbing of the peaks as seen from the gate. One winter the snow hid them until midsummer. The old keeper cut their outline into his crown so his heir could take the oath on time."
 tfw_k_ered_rhivamar_weapon_name:0 "Cirithrist"
 tfw_k_ered_rhivamar_weapon_description:0 "The sword called Cleft-cleaver lay for a winter beneath the last cairn on the pass. A shepherd found it when the thaw brought down the stones and took one small pebble for its pommel before he returned it to the gate."
 tfw_k_northern_iron_mountains_crown_name:0 "The Black Cairn Crown"
 tfw_k_northern_iron_mountains_crown_description:0 "The ironmasters smelted this band from ore taken beneath the boundary cairn. Each master struck it once while it was hot. The deepest hammer stroke belongs to the apprentice who found the seam."
 tfw_k_northern_iron_mountains_weapon_name:0 "Angthela"
 tfw_k_northern_iron_mountains_weapon_description:0 "The iron shoe on this spear came from the staff of a guide who held a narrow ledge until the last of his company had crossed. The mountain guard has replaced the shaft three times and kept the shoe each time."
 tfw_k_angband_reach_crown_name:0 "The Crown of the Broken Watch"
 tfw_k_angband_reach_crown_description:0 "When the tower above the Reach fell, the watch carried its keys to the next wall. Their captain had the wards filed down and linked the bows into a circlet. Each link once opened a door on the lost tower stair."
 tfw_k_angband_reach_weapon_name:0 "Ramrist"
 tfw_k_angband_reach_weapon_description:0 "The breach in the curtain wall was barely a shoulder wide. The first defender through it broke the last handspan off his sword. When the Reach was retaken he had the stump ground to a new point and wore it for the rest of his life."
 tfw_k_komi_crown_name:0 "The Snowroad Crown"
 tfw_k_komi_crown_description:0 "When the winter road to Komi vanished, the sled leaders built a cairn at every bend. The little white stones of the crown came from the tops of those cairns, gathered when the last sled reached home."
 tfw_k_komi_weapon_name:0 "Lossdrambor"
 tfw_k_komi_weapon_description:0 "The axe called Snow-beater once rang against the frozen river to sound the way for the sled train. Where the first blow gave a hollow note, the scouts turned inland. A silver line on the haft records the bend they took."
 tfw_k_west_frostwood_crown_name:0 "The Copper Crown of Evenfall"
 tfw_k_west_frostwood_crown_description:0 "The western wardens sent a copper leaf home for each watch kept beyond the last familiar tree. Their kin stitched the leaves to leather until there were enough for a circlet. At sunset the oldest leaves still redden first."
 tfw_k_west_frostwood_weapon_name:0 "Dúrist"
 tfw_k_west_frostwood_weapon_description:0 "The westward scouts passed Dusk-cleaver from hand to hand when the snows erased the trail. The last scout home hung it above the door. The dark red stone in the guard was his mother’s token."
 tfw_k_east_frostwood_crown_name:0 "The Amber Crown of First Light"
 tfw_k_east_frostwood_crown_description:0 "The eastern scouts found amber in the roots of a pine overturned by a gale. Each took a bead for the return journey. At the first spring gathering they threaded the beads together for the keeper of the eastern marches."
 tfw_k_east_frostwood_weapon_name:0 "Amrenthel"
 tfw_k_east_frostwood_weapon_description:0 "The eastern watch set this spear upright to mark the safe crossing of a frozen stream. At dawn its polished head flashed across the valley. The answering flash from the far bank became the watchword of the two companies."
 tfw_tareg_weapon_name:0 "Dagorist"
 tfw_tareg_weapon_description:0 "Tareg named his sword Battle-cleaver long before the ice closed over him. The last hand to try to take it broke a finger against the frozen guard. When Tareg wakes, his first movement is to turn the edge away from his own palm, an old swordsman’s habit the glacier never took from him."
 tfw_annahir_weapon_name:0 "Girithron"
 tfw_annahir_weapon_description:0 "The Elves named Annahir’s spear the Shuddering One. A child once took hold of the pennon after he planted it by her door and felt the ash quiver all the way to its iron shoe. Annahir gave her the ribbon. The shaft went on trembling after she let go."
