l_english:
 innovation_forodain_warfare: "Forodain Warfare"
 innovation_forodain_warfare_desc: "The Forodain blend the discipline of the Dúnedain with the shield walls, raiding traditions, and hardiness of the northern seas."
 innovation_northern_orc_warfare: "Northern Orc Warfare"
 innovation_northern_orc_warfare_desc: "The Orcs of the far north fight in brutal warbands adapted to mountains, frozen wastes, and long winters."
 innovation_lossidil_warfare: "Warfare of the Snow Elves"
 innovation_lossidil_warfare_desc: "The Lossidil preserve the deadly discipline of the Eldar, adapting spear, bow, blade, and swift riders to the frozen north."
 innovation_umli_warfare: "Umli Warfare"
 innovation_umli_warfare_desc: "Umli warfare favors dense formations, heavy armor, crossbows, and stubborn defense in hills, mountains, and halls."
 innovation_gauredain_warfare: "Gauredain Warfare"
 innovation_gauredain_warfare_desc: "The Gauredain fight as hunters and wild warriors of the mountains and forests, while a rare few take the forms of great wolves in battle."
 innovation_adlantrim_warfare: "Adlantrim Warfare"
 innovation_adlantrim_warfare_desc: "The Adlantrim retain echoes of ancient Elven warfare, though isolation and hardship have reduced the refinement and power of their formations."
 forodain_huscarls: "Forodain Huscarls"
 forodain_huscarls_flavor: "Heavy household warriors who combine northern shield-wall fighting with the discipline of Dúnedain arms."
 forodain_longbowmen: "Forodain Longbowmen"
 forodain_longbowmen_flavor: "Hardy northern bowmen trained to fight from broken ground and through bitter winters."
 forodain_shieldwall: "Forodain Shieldwall"
 forodain_shieldwall_flavor: "Disciplined spearmen who lock shields against cavalry and monsters alike."
 forodain_raiders: "Forodain Raiders"
 forodain_raiders_flavor: "Fast-moving coastal and winter raiders accustomed to fighting far from settled roads."
 northern_orc_reavers: "Northern Orc Reavers"
 northern_orc_reavers_flavor: "Savage heavy infantry drawn from the strongest Orcs of the frozen north."
 northern_orc_archers: "Northern Orc Archers"
 northern_orc_archers_flavor: "Rough bowmen who harry enemies from ridges, crags, and broken ground."
 northern_orc_spears: "Northern Orc Spears"
 northern_orc_spears_flavor: "Dense spear mobs used to blunt mounted charges and hold narrow mountain approaches."
 northern_orc_trackers: "Northern Orc Trackers"
 northern_orc_trackers_flavor: "Lean scouts and hunters who stalk prey through snow, forest, and mountain passes."
 northern_orc_warg_riders: "Northern Warg Riders"
 northern_orc_warg_riders_flavor: "Swift packs of Orc riders mounted on great northern wargs."
 lossidil_frostguard: "Frostguard"
 lossidil_frostguard_flavor: "Ancient Elven warriors whose armor and discipline are undiminished by the northern cold."
 lossidil_icebowmen: "Icebowmen"
 lossidil_icebowmen_flavor: "Elven archers of exceptional skill, trained to loose deadly volleys through snow and mountain wind."
 lossidil_snow_spears: "Spears of the Snow"
 lossidil_snow_spears_flavor: "Steadfast Elven spearmen who turn frozen passes into walls of silvered steel."
 lossidil_frost_riders: "Frost Riders"
 lossidil_frost_riders_flavor: "Swift Elven riders bred and trained for the open snowfields and cold forests of the north."
 umli_ironwardens: "Umli Ironwardens"
 umli_ironwardens_flavor: "Heavily armored warriors trained in the close-order fighting traditions of the Dwarves."
 umli_crossbowmen: "Umli Crossbowmen"
 umli_crossbowmen_flavor: "Patient marksmen carrying powerful crossbows built by a culture famed for metalcraft."
 umli_deep_pikes: "Umli Deep Pikes"
 umli_deep_pikes_flavor: "Stubborn pikemen formed to hold mountain roads, gates, and underground halls."
 umli_axe_scouts: "Umli Axe Scouts"
 umli_axe_scouts_flavor: "Light troops carrying axes and tools, equally comfortable scouting a ridge or clearing a tunnel."
 gauredain_huntsmen: "Gauredain Huntsmen"
 gauredain_huntsmen_flavor: "Woodland archers whose fieldcraft rivals the best hunters of the Vale."
 gauredain_wildspears: "Gauredain Wildspears"
 gauredain_wildspears_flavor: "Mountain spearmen hardened by war against beasts, raiders, and mounted foes."
 gauredain_wildlings: "Gauredain Wildlings"
 gauredain_wildlings_flavor: "Loose bands of fierce warriors who use forest and snow as naturally as another army uses fortifications."
 gauredain_wolf_skinchangers: "Wolf Skinchangers"
 gauredain_wolf_skinchangers_flavor: "Rare Gauredain warriors gifted with the power to take the shape of great wolves. Few in number, they are terrifying shock troops and relentless hunters."
 adlantrim_blades: "Adlantrim Blades"
 adlantrim_blades_flavor: "Warriors preserving fragments of Elven swordcraft in a harsher and less graceful martial tradition."
 adlantrim_archers: "Adlantrim Archers"
 adlantrim_archers_flavor: "Skilled archers whose methods echo those of the Eldar, though without their ancient perfection."
 adlantrim_spears: "Adlantrim Spears"
 adlantrim_spears_flavor: "Disciplined spear formations descended from half-remembered Elven drill."
 adlantrim_scouts: "Adlantrim Scouts"
 adlantrim_scouts_flavor: "Swift mountain and forest scouts shaped by generations of isolation."
 frostbound_spirits: "Frostbound Spirits"
 frostbound_spirits_flavor: "Restless spirits bound to the frozen wastes, drifting through snow and ice with unnatural speed and deadly purpose."

 frozen_dead: "Frozen Dead"
 frozen_dead_flavor: "Corpses preserved by the bitter cold and raised once more, advancing in great silent masses that ignore pain, hunger, and fear."

 rime_wraiths: "Rime Wraiths"
 rime_wraiths_flavor: "Spirits wrapped in hoarfrost and bitter cold, the Rime Wraiths drift forward like a killing winter, enduring blows that would shatter mortal warriors."
 
