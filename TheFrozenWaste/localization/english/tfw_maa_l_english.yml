 innovation_frostwood_warfare:0 "Warfare of the Frostwood"
 innovation_frostwood_warfare_desc:0 "The Windan and Hwenti have shaped ancient Avarin warfare to the frozen forests of the far north, combining patient archery, disciplined spear formations, and swift hunters who vanish among snow-laden trees."

 frostwood_rangers:0 "Frostwood Rangers"
 frostwood_rangers_flavor:0 "Archers of the Windan and Hwenti move silently beneath snow-heavy boughs, striking from concealment before fading back into the frozen forest."

 frostwood_wardens:0 "Frostwood Wardens"
 frostwood_wardens_flavor:0 "Steadfast spear-warriors guard the narrow paths and ancient groves of the Frostwood, turning dense forest and frozen ground into formidable defensive positions."

 frostwood_stalkers:0 "Frostwood Stalkers"
 frostwood_stalkers_flavor:0 "Light-footed hunters range ahead of the main host, using deep forest, snow, and broken ground to harry heavier enemies and protect the flanks of the Frostwood armies."

 unlock_frostwood_rangers:0 "Unlocks [GetMaA('frostwood_rangers').GetName]"
