 activity_window_character_delver: "Delver\n[Character.GetShortUINameNoTooltip|U]"
 underdeep_option_party_size: "Party Size"
 underdeep_party_small: "Small"
 underdeep_party_small_desc: "A handful of trusted hands who are quick on the stair and easy to feed, with few to carry you out if it goes badly.\n$BULLET_WITH_TAB$Up to 5 from your court\n$BULLET_WITH_TAB$Landed rulers must haul a great weight of supplies north to feed the company"
 underdeep_party_normal: "Normal"
 underdeep_party_normal_desc: "Enough to hold a passage and carry what is found, though not so many that the torches run short.\n$BULLET_WITH_TAB$Up to 8 from your court\n$BULLET_WITH_TAB$Landed rulers must haul a great weight of supplies north to feed the company"
 underdeep_party_large: "Large"
 underdeep_party_large_desc: "A long file of spears and bearers, hard to kill and harder to feed, whose tramping will be heard a long way down.\n$BULLET_WITH_TAB$Up to 15 from your court\n$BULLET_WITH_TAB$Landed rulers must haul a great weight of supplies north to feed the company"
 trait_delver: "Dungeon Delver"
 trait_delver_2: "Seasoned Delver"
 trait_delver_3: "Master of the Deep"
