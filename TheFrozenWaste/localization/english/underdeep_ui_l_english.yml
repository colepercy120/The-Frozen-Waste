 underdeep_tunnel_treasure_learned_2: "Cart ruts lead down here and never come back."
 underdeep_tunnel_danger_1: "A tunnel with deep gouges along the walls."
 underdeep_tunnel_danger_2: "A passage half choked with fallen stone."
 underdeep_tunnel_danger_3: "A low way that reeks of old kills."
 underdeep_tunnel_danger_learned: "Fresh gouges at shoulder height."
