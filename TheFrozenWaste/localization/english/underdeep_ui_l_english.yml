 underdeep_tunnel_whispers_1: "A tunnel that seems to breathe."
 underdeep_tunnel_whispers_2: "A narrow way lined with faint scratches."
 underdeep_tunnel_whispers_3: "A passage where sound dies quickly."
 underdeep_tunnel_whispers_learned: "Scratches that were once a warning."
 underdeep_tunnel_whispers_learned_2: "An old prayer against listening, cut into the rock."
 underdeep_tunnel_rest_1: "A wide tunnel, dry underfoot."
 underdeep_tunnel_rest_2: "A passage with a ledge to sit on."
 underdeep_tunnel_rest_3: "A tunnel with a cold draught of clean air."
