 trait_delver_desc: "Has gone down into the ruins of [utumno|E] and found the way back out.\n\n$underdeep_trait_track$"
 trait_delver_desc_2: "Knows which doors to leave shut and how far a torch will last in bad air.\n\n$underdeep_trait_track$"
 trait_delver_desc_3: "Has seen all that the dark has to offer.\n\n$underdeep_trait_track$"
