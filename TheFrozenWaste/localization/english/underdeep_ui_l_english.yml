 underdeep_prove_intent: "Prove Yourself"
 underdeep_prove_intent_desc: "Gain [prestige|E] and more often find yourself at the centre of events below."
 underdeep_watch_intent: "Watch the Leader's Back"
 underdeep_watch_intent_desc: "When the leader would be wounded, you may take the blow instead."

