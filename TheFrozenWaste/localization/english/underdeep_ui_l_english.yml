 underdeep_door_clue_1102: "Rust stains seep from under this door, red as old blood."
 underdeep_door_clue_1107: "Neat tally marks run along the frame, every one struck through."
 underdeep_door_clue_1110: "Something beyond catches the torchlight and gives it back more softly."
 underdeep_door_clue_1113: "A thread of smoke and the smell of a fire someone is still feeding."
 underdeep_door_clue_1118: "A faint jingle of iron on iron, though no draught stirs."
 underdeep_door_clue_1123: "Something beyond creaks like a great weight settling, then is still."
 underdeep_door_clue_1126: "The glass of the wall ahead once ran like water."
 underdeep_door_clue_1130: "A coin lies on the step with another just below it."
 underdeep_door_clue_1132: "Deep gouges in the rock ahead, every one made in anger."
 underdeep_door_clue_1103: "Grit sifts down from the roof at every footstep."
 underdeep_door_clue_1106: "A reek of marrow and old meat drifts out of the dark."
 underdeep_door_clue_1109: "A cold air rises from the floor and draws the torch smoke down."
 underdeep_door_clue_1112: "Clear blue ice beyond that cracks at a cough."
 underdeep_door_clue_1119: "A pack of animals is panting somewhere ahead in the dark."
 underdeep_door_clue_1122: "The air beyond smells sweet and does not move."
 underdeep_door_clue_1127: "Warm air ahead, under a roof that is not stone."
 underdeep_door_clue_1129: "Fresh frost on the ledge, laid down in long breaths."
 underdeep_door_clue_1133: "Fresh scrapes on the walls and a smell of hot iron."
 underdeep_door_clue_1101: "A stair going down, where the echoes come back late."
 underdeep_door_clue_1104: "Fine carving runs along the wall beyond, with no joy in it."
 underdeep_door_clue_1114: "So cold beyond that every word would smoke."
 underdeep_door_clue_1116: "A tremor felt in the teeth, keeping time with nothing."
 underdeep_door_clue_1120: "The torchlight comes back from the dark too brightly, as from a mirror."
 underdeep_door_clue_1124: "Small scratches cover the wall beyond, endless and all alike."
 underdeep_door_clue_1105: "The frost stops short of the threshold here."
 underdeep_door_clue_1108: "A trickle of water that does not smell foul."
 underdeep_door_clue_1115: "A door that still shuts, with its bar beside it."
 underdeep_door_clue_1117: "A thread of grey light falls on something green."
 underdeep_door_clue_1121: "Someone swept this floor, a long time ago."
 underdeep_door_clue_1125: "Steam drifts along the roof from somewhere close."
 underdeep_door_clue_1128: "A cairn of flat stones stands against the wall below."
 underdeep_door_clue_1131: "A sound like quiet talk in another room."
 underdeep_door_treasure_3: "A cellar hatch, its ring worn bright by hands."
 underdeep_door_treasure_4: "A niche sealed with loose, newer stone."
 underdeep_door_treasure_5: "A strongroom door, hanging from one hinge."
 underdeep_door_treasure_6: "A narrow stair with a dropped coin on it."
 underdeep_door_treasure_learned_2: "Storeroom marks on the lintel suggest that little was carried out."
 underdeep_door_treasure_learned_3: "The seal on this door was a quartermaster's."
 underdeep_door_treasure_learned_4: "A paymaster's mark, scratched beneath the frost."
 underdeep_door_danger_3: "A low tunnel with old bones swept to the sides."
 underdeep_door_danger_4: "The ice here is cracked and the roof sags."
 underdeep_door_danger_5: "A passage that smells of wet fur."
 underdeep_door_danger_6: "A stair with its middle steps fallen away."
 underdeep_door_danger_learned_2: "Pit-trap joints in the floor, badly hidden."
 underdeep_door_danger_learned_3: "Droppings and gnawed hide betray a lair close by."
 underdeep_door_danger_learned_4: "Fresh cracks run through old ice that will not hold long."
 underdeep_door_whispers_3: "A corridor where the frost grows in patterns."
 underdeep_door_whispers_4: "A doorway with no draught and a faint murmur."
 underdeep_door_whispers_5: "A hall of empty niches, all facing inward."
 underdeep_door_whispers_6: "A passage where the torch smoke hangs still."
 underdeep_door_whispers_learned_2: "Warding signs, all of them cut from the inside."
 underdeep_door_whispers_learned_3: "The old script here forbids speaking aloud."
 underdeep_door_whispers_learned_4: "A shrine passage, its carvings made to unsettle."
 underdeep_door_rest_3: "A side cave with a dry floor."
 underdeep_door_rest_4: "A guardroom with its brazier still in place."
 underdeep_door_rest_5: "A small alcove, out of the draught."
 underdeep_door_rest_6: "A low room that smells of old smoke."
 underdeep_door_rest_learned_2: "Scratched tallies mark where others once halted in safety."
 underdeep_door_rest_learned_3: "A watch post, built to be warm."
 underdeep_door_rest_learned_4: "Old camp signs show that whoever stayed left in good order."
 underdeep_door_read_prowess: "[prowess_i] #italic Your [prowess|E] let you size up the danger that way.#!"
 underdeep_door_read_martial: "[martial_i] #italic Your [martial|E] let you read the signs of a fight ahead.#!"
