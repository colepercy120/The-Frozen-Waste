l_english:
 # Forochel salvage story: adapted from the shared EE/WED localization.
 tfw_palantiri.02.t: "The Recovery of the Palantíri"
 tfw_palantiri.02.desc: "The salvage team set sail under a pale, weary sun, their course aimed directly into the churning, frigid waters of Forochel’s most desolate reaches. For weeks, their efforts had yielded little beyond the jagged, frozen coastline and the murmur of the wind in the stillness. But this morning, as the crew cast their nets over the waters where the currents grew colder still, the sea offered a grim treasure. Beneath the dark waves, the wreck of the Arvedui, the fabled vessel of the last King of Arthedain, lay entangled in the jagged rocks, its hull shattered, yet still defiantly holding the secrets of its final voyage. For the men aboard, the sight of the wreck was a moment of awe and dread—both a triumph of discovery and a reminder of the perils the sea had claimed. The divers, now wary of the unforgiving depths, braved the icy waters with one mission: to recover the lost Palantír. \n\nHours passed in tense silence, broken only by the creaking of the ship and the crash of distant waves. Then, with an effort that seemed to defy the very ocean, the first stone surfaced—dark, smooth, and ancient, its glass surface gleaming eerily in the pale light. The Palantír of Annúminas was found, its mysteries preserved in the cold embrace of the sea. The second soon followed, a stone of equal age but twisted by time—the Palantír of Amon Sûl. Their recovery was a victory not only for the salvage team but for the realm itself, for the stones now held the promise of restoring the vision of Arnor, if the King dared to use them. As the team returned to shore, the weight of history seemed to shift, and the distant shadow of the past began to stir once again."
 tfw_palantiri.02.a: "Huzzah!"
 tfw_palantiri.04.t: "No Word from the North"
 tfw_palantiri.04.desc: "We have not yet recived any word on the search for the lost Palantiri of Arnor. Our best adventurers are continuing to search the bay of forochel for any sign of Arvedui's ship. All thats left to do it wait for results."
 tfw_palantiri.04.a: "We Eagerly await their sucess."
 tfw_palantiri.04.b: "Recall them, we can't afford this."
 tfw_palantiri.05.t: "A Frozen Miracle"
 tfw_palantiri.05.desc: "We have recived an utterly astonishing report from the adventurers in Forochel. They encountered a [numenorean|e] ship frozen in an iceberg. Getting aboard was problomatic but once inside it was clear the ship was carrying someone importiant. The crew, still eerily preserved by ice, were clad in fine robes and equiped with fine weapons. Our teams pulled the bodies from the ice to give them proper funereals fitting for our ancestors and salvaged as much as they could of the finnery and documents on the vessel. Then continued to search for the lost Palantiri. But then the miracle happened. A child, identified in the logs as Ârûbên the nephew of [pharazon|e], suddenly awoke. He was badly frostbitten and not able to stand but he was, is, alive."
 tfw_palantiri.05.a: "Bring the Heir of Numenor to the Capital at once!"
 tfw_palantiri_salvage: "Attempt to Salvage the Palantíri"
 tfw_palantiri_salvage_desc: "The frozen shores of Forochel lie beneath our banner at last, and with them, the faintest hope of reclaiming what was thought lost to the depths. Long ago, in the dark days of our kingdom’s decline, the palantíri of Annúminas and Amon Sûl were lost to the icy seas. Treasures beyond price, our birthright swallowed by the cruel northern waters. Yet now, with mastery over these lands, we may dare what none before have dared: to scour the frozen waves and sunken wrecks for our lost seeing-stones. It is a perilous task, one fit only for the desperate or the bold. But if even one of the palantíri is found, it may light a beacon for Arnor’s renewal and bind the sundered North-kingdom whole once more."
 tfw_palantiri_salvage_confirm: "Send a salvage team."
 tfw_palantiri_salvage_tooltip: "Send a salvage team to find the wreck of Arvedui and reclaim the lost Palantíri."
 tfw_palantiri_salvage_effect: "Send a salvage team to find the wreck of Arvedui in the wastes of Forochel and reclaim the lost Palantíri - Warning this will take time!"
 tfw_palantiri_iceboy_name: "Helcion"
 tfw_palantiri_iceboy_name_2: "Ârûbên"
 nick_tfw_palantiri_iceborn: "Helcion"
 nick_tfw_palantiri_iceborn_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was the nephew of [pharazon|e] during the [downfallofnumenor|e]. Considered a failure for taking after Tar-Palantir, his uncle sent him away on an expidition to Forochel, his ship was destoryed but miraculously [CHARACTER.GetShortUINameNoTooltipNoFormat|U] was pulled from the ice by Arnorian salvagers in the late [thirdage|e]."
